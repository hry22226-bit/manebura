      if (this.special && this.special.data.warlockCharge) hbColor = "#c63dff";
      else if (curStats?.electric) hbColor = "#7df9ff";
      else if (curStats?.fire) hbColor = "#ff6a2a";
      else if (curStats?.sword) hbColor = "#e9e4ff";
      else if (curStats?.coinBurst) hbColor = "#ffd700";
      else if (this.attackType && this.attackType.startsWith("smash")) hbColor = "#ff9e35";
      ctx.fillStyle = hbColor;
      ctx.beginPath(); ctx.ellipse(hb.x + hb.w / 2, hb.y + hb.h / 2, hb.w / 2, hb.h / 2, 0, 0, Math.PI * 2); ctx.fill();
      if (curStats?.sword || this.fighter.weapon === "sword" || this.fighter.weapon === "dark") { ctx.strokeStyle = "#ffffff"; ctx.lineWidth = 2.5; ctx.stroke(); }
      if (curStats?.electric) { ctx.strokeStyle = "#e8fdff"; ctx.lineWidth = 2; ctx.stroke(); }
      ctx.restore();

      // スマッシュ／強攻撃の振り抜き軌跡（剣以外のキャラ用スウッシュ）
      if (this.attackType && !curStats?.sword && (this.attackType.startsWith("smash") || this.attackType === "heavy" || this.attackType === "airHeavy")) {
        const m = getMove(this.fighter, this.attackType);
        const prog = Math.max(0, Math.min(1, (this.attackFrame - m.startup + 1) / Math.max(1, m.active + 1)));
        const cx = this.x + this.w / 2, cy = this.y + this.h / 2;
        const dir = this.attackFacing;
        const charged = this.smashChargeScale > 1.05;
        const swooshColor = curStats?.fire ? "#ffb35c" : (curStats?.electric ? "#bdf7ff" : (curStats?.coinBurst ? "#ffe066" : "#ffffff"));
        ctx.save();
        ctx.lineCap = "round";
        ctx.globalAlpha = .75 * (1 - prog * .55);
        ctx.strokeStyle = swooshColor;
        ctx.lineWidth = charged ? 9 : 6;
        if (this.attackType === "smashUp") {
          const r = hb.h * .9;
          ctx.beginPath(); ctx.arc(cx, cy + 6, r, Math.PI * 1.05 + prog * .3, Math.PI * 1.95 - prog * .3 + .001, false); ctx.stroke();
          ctx.lineWidth = 2.5; ctx.globalAlpha *= .9; ctx.strokeStyle = "#ffffff";
          ctx.beginPath(); ctx.arc(cx, cy + 6, r - 7, Math.PI * 1.15, Math.PI * 1.85); ctx.stroke();
        } else if (this.attackType === "smashDown") {
          const r = hb.w / 2;
          for (const sgn of [-1, 1]) {
            ctx.beginPath(); ctx.arc(cx, this.y + this.h - 6, r * (.5 + prog * .5), sgn > 0 ? -.35 : Math.PI - .25, sgn > 0 ? .25 : Math.PI + .35); ctx.stroke();
          }
        } else {
          // 前方への横なぎ: 上から前へ振り下ろす弧
          const sweep = hb.w + 10;
          const startA = -Math.PI * .72, endA = startA + Math.PI * (.5 + prog * .42);
          ctx.beginPath();
          ctx.ellipse(cx + dir * 4, cy, sweep, this.h * .62, 0, dir > 0 ? startA : Math.PI - endA, dir > 0 ? endA : Math.PI - startA, false);
          ctx.stroke();
          ctx.lineWidth = 2.5; ctx.strokeStyle = "#ffffff"; ctx.globalAlpha *= .9;
          ctx.beginPath();
          ctx.ellipse(cx + dir * 4, cy, sweep - 8, this.h * .5, 0, dir > 0 ? startA + .1 : Math.PI - endA + .1, dir > 0 ? endA - .1 : Math.PI - startA - .1, false);
          ctx.stroke();
        }
        ctx.restore();
      }
      if (curStats?.sword && this.attackType) {
        const m = getMove(this.fighter, this.attackType);
        const prog = Math.max(0, Math.min(1, (this.attackFrame - m.startup) / Math.max(1, m.active)));
        ctx.save(); ctx.globalAlpha = 0.9; ctx.lineCap = "round";
        const cx = this.x + this.w / 2, cy = this.y + this.h / 2;
        const dir = this.attackFacing;
        const bladeMain = this.fighter.name === "カノン" ? "#8a2be2" : (this.fighter.style === "buster" ? "#aeb6c0" : (this.fighter.style === "hero" ? "#8ef2c0" : "#dfe9ff"));
        const bladeArc = this.fighter.name === "カノン" ? "#c07bff" : (this.fighter.style === "buster" ? "#7ec8ff" : (this.fighter.style === "hero" ? "#e2fff0" : "#ffffff"));
        if (this.attackType === "smashUp" || this.attackType === "upTilt") {
          ctx.strokeStyle = bladeArc; ctx.lineWidth = 8;
          ctx.beginPath(); ctx.moveTo(cx - 22, cy + 12); ctx.quadraticCurveTo(cx + dir * 6, cy - 46 - prog * 14, cx + 22, cy + 12); ctx.stroke();
          ctx.strokeStyle = "#ffffff"; ctx.lineWidth = 3;
          ctx.beginPath();
          ctx.moveTo(cx - 18, cy + 10);
          ctx.quadraticCurveTo(cx + dir * 6, cy - 40 - prog * 14, cx + 18, cy + 10);
          ctx.stroke();
      } else if (this.attackType === "smashDown") {
          ctx.strokeStyle = bladeArc; ctx.lineWidth = 7;
          ctx.beginPath(); ctx.ellipse(cx, this.y + this.h - 4, 58 * (curStats.rangeMul || 1), 13, 0, 0, Math.PI * 2); ctx.stroke();
        } else {
          const len = 62 * (curStats.rangeMul || 1);
          const yOff = -12 + prog * 24;
          ctx.strokeStyle = bladeMain;
          ctx.lineWidth = this.fighter.style === "buster" ? 12 : 9;
          ctx.beginPath();
          ctx.moveTo(cx, cy + yOff - 20);
          ctx.lineTo(cx + dir * len, cy + yOff + 12);
          ctx.stroke();
          ctx.strokeStyle = "#ffffff"; ctx.lineWidth = 3.5;
          ctx.beginPath();
          ctx.moveTo(cx, cy + yOff - 16);
          ctx.lineTo(cx + dir * len, cy + yOff + 8);
          ctx.stroke();
        }
        ctx.restore();
      }

      if (curStats?.hammer) {
        ctx.save();
        const dir = this.attackFacing;
        const hx = dir > 0 ? this.x + this.w + 22 : this.x - 22;
        const hy = this.y + 12;
        ctx.fillStyle = "#7a4a1f";
        ctx.fillRect(dir > 0 ? this.x + this.w - 6 : hx - 2, hy + 6, 28, 7);
        const m2 = getMove(this.fighter, this.attackType);
        const isCleanFrame = (this.attackFrame - m2.startup) < 2;
        ctx.fillStyle = (curStats.fire && isCleanFrame) ? "#ff7a1f" : "#c9ced6";
        ctx.fillRect(hx - 15, hy - 12, 30, 26);
        ctx.strokeStyle = "#ffffff"; ctx.lineWidth = 2;
        ctx.strokeRect(hx - 15, hy - 12, 30, 26);
        if (curStats.fire && isCleanFrame) {
          ctx.fillStyle = "#ffd23f";
          ctx.beginPath(); ctx.arc(hx, hy, 6, 0, Math.PI * 2); ctx.fill();
        }
        ctx.restore();
      }

      if (curStats?.electric) {
        ctx.save();
        ctx.globalAlpha = 0.85;
        ctx.strokeStyle = "#e8fdff"; ctx.lineWidth = 2;
        for (let i = 0; i < 5; i++) {
          const ex = hb.x + Math.random() * hb.w;
          const ey = hb.y + Math.random() * hb.h;
          ctx.beginPath();
          ctx.moveTo(ex, ey);
          ctx.lineTo(ex + (Math.random() - .5) * 26, ey + (Math.random() - .5) * 26);
          ctx.lineTo(ex + (Math.random() - .5) * 40, ey + (Math.random() - .5) * 40);
          ctx.stroke();
        }
        ctx.restore();
      }
      if (curStats?.fire && !curStats?.hammer) {
        ctx.save();
        ctx.globalAlpha = 0.75;
        ctx.fillStyle = "#ff7a1f";
        for (let i = 0; i < 3; i++) {
          const fx = hb.x + Math.random() * hb.w;
          const fy = hb.y + Math.random() * hb.h;
          ctx.beginPath(); ctx.arc(fx, fy, 5 + Math.random() * 5, 0, Math.PI * 2); ctx.fill();
        }
        ctx.fillStyle = "#ffd23f";
        ctx.beginPath(); ctx.arc(hb.x + hb.w / 2, hb.y + hb.h / 2, 6, 0, Math.PI * 2); ctx.fill();
        ctx.restore();
      }
      if (curStats?.coinBurst) {
        ctx.save();
        ctx.globalAlpha = 0.9;
        ctx.fillStyle = "#ffd700";
        for (let i = 0; i < 4; i++) {
          const fx = hb.x + 10 + Math.random() * Math.max(10, hb.w - 20);
          const fy = hb.y + 10 + Math.random() * Math.max(10, hb.h - 20);
          ctx.beginPath(); ctx.arc(fx, fy, 5, 0, Math.PI * 2); ctx.fill();
          ctx.strokeStyle = "#8a6d00"; ctx.lineWidth = 1; ctx.stroke();
        }
        ctx.restore();
      }
    }

    if (this.smashCharge) {
      // スマッシュホールド: 溜めるほど強く脈打つオーラ＋MAX時の光輪
      const ratio = Math.min(1, this.smashCharge.frames / 45);
      const cx = this.x + this.w / 2, cy = this.y + this.h / 2;
      const pulse = .5 + .5 * Math.sin(this.motionFrame * (.35 + ratio * .5));
      const baseR = this.w * .7 + ratio * 14;
      ctx.save();
      const aura = ctx.createRadialGradient(cx, cy, baseR * .2, cx, cy, baseR + 10);
      const auraColor = ratio >= 1 ? "255,255,255" : "255,212,91";
      aura.addColorStop(0, `rgba(${auraColor},${.05 + ratio * .18})`);
      aura.addColorStop(.75, `rgba(${auraColor},${.08 + ratio * .22 * pulse})`);
      aura.addColorStop(1, `rgba(${auraColor},0)`);
      ctx.fillStyle = aura;
      ctx.beginPath(); ctx.arc(cx, cy, baseR + 10, 0, Math.PI * 2); ctx.fill();
      ctx.globalAlpha = .35 + ratio * .5;
      ctx.strokeStyle = ratio >= 1 ? "#ffffff" : "#ffd45b";
      ctx.lineWidth = 2 + ratio * 2.5;
      ctx.beginPath(); ctx.arc(cx, cy, baseR + pulse * 3, 0, Math.PI * 2); ctx.stroke();
      if (ratio > .5) {
        // 高溜め時のエネルギー弧
        ctx.lineWidth = 1.5;
        ctx.globalAlpha = (ratio - .5) * 1.4;
        for (let i = 0; i < 3; i++) {
          const a0 = this.motionFrame * .25 + i * 2.1;
          ctx.beginPath(); ctx.arc(cx, cy, baseR * .75, a0, a0 + .9); ctx.stroke();
        }
      }
      if (ratio >= 1) {
        ctx.globalAlpha = .55 + pulse * .3;
        ctx.fillStyle = "#ffffff"; ctx.font = "bold 11px sans-serif"; ctx.textAlign = "center";
        ctx.fillText("MAX", cx, this.y - 16);
      }
      ctx.restore();
    }

    if (this.specialEndlag > 12) {
      ctx.save();
      ctx.globalAlpha = .55; ctx.strokeStyle = "rgba(255,90,90,.8)"; ctx.lineWidth = 2;
      ctx.strokeRect(this.x - 3, this.y - 3, this.w + 6, this.h + 6);
      ctx.restore();
    }

    if (this.moveLabelTimer > 0 && this.moveLabel) {
      ctx.save();
      ctx.globalAlpha = Math.min(1, this.moveLabelTimer / 12);
      ctx.textAlign = "center"; ctx.font = "bold 11px sans-serif";
      ctx.fillStyle = this.fighter.effectColor || "#ffe88a";
      ctx.fillText(this.moveLabel, this.x + this.w / 2, this.y - 10);
      ctx.restore();
    }

    if (this.holdingTarget) {
      ctx.save();
      ctx.textAlign = "center"; ctx.font = "bold 11px sans-serif"; ctx.fillStyle = "#8ef7ff";
      ctx.fillText("GRAB! 方向で投げ", this.x + this.w / 2, this.y - 10);
      ctx.restore();
    }
    if (this.special?.grabTarget) {
      ctx.save();
      ctx.textAlign = "center"; ctx.font = "bold 11px sans-serif"; ctx.fillStyle = "#ffb86a";
      ctx.fillText(this.special.data.label, this.x + this.w / 2, this.y - 14);
      ctx.restore();
    }
    if (this.parryFlash > 0) {
      ctx.save();
      ctx.textAlign = "center"; ctx.font = "bold 13px sans-serif"; ctx.fillStyle = "#fff06a";
      ctx.fillText("JUST GUARD!", this.x + this.w / 2, this.y - 12);
      ctx.restore();
    }
    if (this.ledgeGrab) {
      ctx.save();
      ctx.textAlign = "center"; ctx.font = "bold 10px sans-serif"; ctx.fillStyle = "#ffe88a";
      const shLbl = formatKeyLabel(this.keys.shield);
      const wkLbl = formatKeyLabel(this.keys.weak);
      const upLbl = formatKeyLabel(this.keys.up);
      const downLbl = formatKeyLabel(this.keys.down);
      ctx.fillText(`崖 [${shLbl}:回避上がり / ${wkLbl}:攻撃 / ${upLbl}:ジャンプ / ${downLbl}:離す]`, this.x + this.w / 2, this.y - 8);
      ctx.restore();
    }
    ctx.restore();
  }
}
// ===== 当たり判定の表示（設定でONにすると対戦中に可視化）=====
function hitboxFill(color, alpha) {
  const r = parseInt(color.slice(1, 3), 16), g = parseInt(color.slice(3, 5), 16), b = parseInt(color.slice(5, 7), 16);
  return `rgba(${r}, ${g}, ${b}, ${alpha})`;
}

function drawHitboxRect(r, color, label) {
  if (!r) return;
  ctx.save();
  ctx.globalAlpha = 1;
  ctx.fillStyle = hitboxFill(color, .2);
  ctx.fillRect(r.x, r.y, r.w, r.h);
  ctx.strokeStyle = color; ctx.lineWidth = 1.5;
  ctx.setLineDash([5, 3]);
  ctx.strokeRect(r.x, r.y, r.w, r.h);
  ctx.setLineDash([]);
  if (label) {
    ctx.font = "bold 9px sans-serif"; ctx.textAlign = "left";
    ctx.lineWidth = 3; ctx.strokeStyle = "rgba(0,0,0,.85)";
    ctx.strokeText(label, r.x + 2, r.y + 10);
    ctx.fillStyle = color; ctx.fillText(label, r.x + 2, r.y + 10);
  }
  ctx.restore();
}

function drawCharacterHitboxes(p) {
  if (!p || !p.alive || !settings.showHitboxes) return;
  ctx.save();
  // 体・しゃがみ判定（水色）
  const body = p.getBody();
  ctx.fillStyle = "rgba(80, 200, 255, .16)";
  ctx.fillRect(body.x, body.y, body.w, body.h);
  ctx.strokeStyle = "#5fd0ff"; ctx.lineWidth = 1.5; ctx.setLineDash([4, 4]);
  ctx.strokeRect(body.x, body.y, body.w, body.h);
  ctx.setLineDash([]);
  ctx.font = "bold 9px sans-serif"; ctx.textAlign = "left";
  ctx.lineWidth = 3; ctx.strokeStyle = "rgba(0,0,0,.85)";
  ctx.strokeText("体", body.x + 2, body.y + 10); ctx.fillStyle = "#5fd0ff"; ctx.fillText("体", body.x + 2, body.y + 10);
  // 攻撃判定（赤）
  const atk = p.getHitbox();
  if (atk) drawHitboxRect(atk, "#ff5555", "攻撃");
  // 崖攻撃（オレンジ）
  const ledge = p.getLedgeAttackHitbox();
  if (ledge) drawHitboxRect(ledge, "#ff9f43", "崖攻撃");
  // 必殺技（黄）
  const spAtk = p.getSpecialHitbox(false);
  if (spAtk) drawHitboxRect(spAtk, "#ffe066", "必殺技");
  // つかみ（紫）
  const grab = p.getGrabBox();
  if (grab) drawHitboxRect(grab, "#c86bff", "つかみ");
  // 崖つかまり中は、掴める崖の範囲を緑で表示
  if ((p.ledgeGrab || p.ledgeAction) && mainPlatform) {
    const side = p.ledgeSide < 0 ? -1 : 1;
    const ex = p.ledgeX || (side < 0 ? mainPlatform.x : mainPlatform.x + mainPlatform.w);
    const ey = p.ledgeY || mainPlatform.y;
    drawHitboxRect({ x: ex - 14, y: ey - 10, w: 28, h: 24 }, "#6ee7b7", "崖");
  }
  // 無敵・回避・ひるみの残り時間（白／赤の丸）
  if (p.invincible > 0 || p.dodgeInvincible > 0 || p.hitstun > 0) {
    const cx = p.x + p.w / 2, cy = p.y + p.h / 2;
    ctx.strokeStyle = p.hitstun > 0 ? "#ff9b9b" : "#ffffff";
    ctx.globalAlpha = .55; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.arc(cx, cy, p.w * .75, 0, Math.PI * 2); ctx.stroke();
    if (p.invincible > 0) {
      ctx.fillStyle = "#ffffff"; ctx.font = "bold 9px sans-serif"; ctx.textAlign = "center";
      ctx.fillText(`無敵 ${p.invincible}`, cx, p.y - 8);
    }
    ctx.globalAlpha = 1;
  }
  ctx.restore();
}

// 電三郎先生・お去るのジョージアの技の小道具（エッフェル塔・電流・滑り台・爆発・チャリ・ホッピング）
function drawFighterProps(p) {
  const cx = p.x + p.w / 2, feet = p.y + p.h, f = p.facing;
  ctx.save();
  // 状態異常アイコン（火傷は炎、食中毒は緑の泡）
  if (p.burnTimer > 0) {
    const n = 2 + Math.min(2, Math.floor(p.burnTimer / 30));
    for (let k = 0; k < n; k++) {
      const bx = cx - 12 + k * 9, by = p.y - 14 - (k % 2) * 4 + Math.sin((p.motionFrame + k * 7) / 6) * 2;
      ctx.fillStyle = k % 2 ? "#ff9a3a" : "#ffe17a";
      ctx.beginPath(); ctx.moveTo(bx, by - 7); ctx.quadraticCurveTo(bx + 5, by, bx, by + 5); ctx.quadraticCurveTo(bx - 5, by, bx, by - 7); ctx.fill();
    }
  }
  if (p.poisonTimer > 0) {
    for (let k = 0; k < 3; k++) {
      const bx = cx + 12 + k * 6, by = p.y - 18 - ((p.motionFrame + k * 11) % 12);
      ctx.globalAlpha = .7;
      ctx.fillStyle = "#7ed957";
      ctx.beginPath(); ctx.arc(bx, by, 3.2, 0, Math.PI * 2); ctx.fill();
      ctx.globalAlpha = 1;
    }
  }
  if (p.eatTimer > 0) {
    ctx.fillStyle = "#fff"; ctx.font = "bold 10px sans-serif"; ctx.textAlign = "center";
    ctx.fillText("もぐもぐ", cx, p.y - 26);
  }
  if (p.attackType) {
    const st = getMoveStats(p.fighter, p.attackType);
    const m = getMove(p.fighter, p.attackType);
    const t = Math.min(1, p.attackFrame / Math.max(1, m.startup + m.active));
    const af = p.attackFacing || f;
    if (st.prop === "eiffel") {
      const bx = cx + af * (p.w / 2 + 20), hgt = 18 + 52 * Math.min(1, p.attackFrame / Math.max(1, m.startup));
      ctx.strokeStyle = "#8c6a3c"; ctx.lineWidth = 2.5;
      ctx.beginPath(); ctx.moveTo(bx - 14, feet); ctx.lineTo(bx, feet - hgt); ctx.lineTo(bx + 14, feet); ctx.stroke();
      ctx.lineWidth = 1.5;
      for (let k = 1; k < 4; k++) { const yy = feet - hgt * k / 4, half = 14 * (1 - k / 4); ctx.beginPath(); ctx.moveTo(bx - half, yy); ctx.lineTo(bx + half, yy); ctx.stroke(); }
      ctx.beginPath(); ctx.moveTo(bx - 9, feet); ctx.quadraticCurveTo(bx, feet - 12, bx + 9, feet); ctx.stroke();
    } else if (st.prop === "current") {
      ctx.strokeStyle = "#7df9ff"; ctx.lineWidth = 2.5; ctx.shadowColor = "#7df9ff"; ctx.shadowBlur = 8;
      for (let k = 0; k < 2; k++) {
        ctx.beginPath();
        let x = cx + af * p.w * .45, y = p.y + p.h * (.4 + k * .15);
        ctx.moveTo(x, y);
        for (let q = 0; q < 6; q++) { x += af * 10; y += (Math.random() - .5) * 14; ctx.lineTo(x, y); }
        ctx.stroke();
      }
    } else if (st.prop === "slide") {
      const sx = cx + af * 8, top = p.y - 34;
      ctx.strokeStyle = "#c0392b"; ctx.lineWidth = 4;
      ctx.beginPath(); ctx.moveTo(sx, top); ctx.lineTo(sx + af * 64, feet - 4); ctx.stroke();
      ctx.strokeStyle = "#7a8aa0"; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(sx - af * 6, top); ctx.lineTo(sx - af * 6, feet); ctx.stroke();
      for (let k = 1; k < 4; k++) { const yy = top + (feet - top) * k / 4; ctx.beginPath(); ctx.moveTo(sx - af * 10, yy); ctx.lineTo(sx - af * 2, yy); ctx.stroke(); }
      const mx = sx + af * 64 * t, my = top + (feet - 4 - top) * t;
      paintAvatarShaded(mx - 10, my - 24, 20, 24, GEORGIA_FIGHTER, GEORGIA_FIGHTER.color, af);
    } else if (st.prop === "bomber" && p.attackFrame >= m.startup - 2) {
      const r = 18 + 46 * Math.min(1, (p.attackFrame - m.startup + 3) / (m.active + 3));
      const g = ctx.createRadialGradient(cx, feet - 8, 2, cx, feet - 8, r);
      g.addColorStop(0, "rgba(255,245,180,.95)"); g.addColorStop(.5, "rgba(255,140,40,.75)"); g.addColorStop(1, "rgba(200,40,20,0)");
      ctx.fillStyle = g; ctx.beginPath(); ctx.arc(cx, feet - 8, r, 0, Math.PI * 2); ctx.fill();
      ctx.font = "bold 13px sans-serif"; ctx.textAlign = "center"; ctx.lineWidth = 3; ctx.strokeStyle = "#3a0a00";
      ctx.strokeText("ドーン！", cx, p.y - 10); ctx.fillStyle = "#ffe17a"; ctx.fillText("ドーン！", cx, p.y - 10);
    }
  }
  if (p.special) {
    const d = p.special.data;
    if (d.bicycle) {
      const spin = (p.special.frame || 0) * .5;
      ctx.strokeStyle = "#2b2f3a"; ctx.lineWidth = 2.2;
      for (const wx of [cx - 15, cx + 15]) {
        ctx.beginPath(); ctx.arc(wx, feet + 2, 9, 0, Math.PI * 2); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(wx + Math.cos(spin) * 9, feet + 2 + Math.sin(spin) * 9); ctx.lineTo(wx - Math.cos(spin) * 9, feet + 2 - Math.sin(spin) * 9); ctx.stroke();
      }
      ctx.strokeStyle = "#d4202c"; ctx.lineWidth = 2.5;
      ctx.beginPath(); ctx.moveTo(cx - 15, feet + 2); ctx.lineTo(cx, feet - 8); ctx.lineTo(cx + 15, feet + 2); ctx.moveTo(cx, feet - 8); ctx.lineTo(cx + f * 12, feet - 14); ctx.stroke();
      ctx.font = "bold 12px sans-serif"; ctx.textAlign = "center"; ctx.lineWidth = 3; ctx.strokeStyle = "#000";
      ctx.strokeText("ハピエネ〜！", cx, p.y - 12); ctx.fillStyle = "#ffe17a"; ctx.fillText("ハピエネ〜！", cx, p.y - 12);
    } else if (d.hapiene) {
      ctx.font = "bold 13px sans-serif"; ctx.textAlign = "center"; ctx.lineWidth = 3; ctx.strokeStyle = "#000";
      ctx.strokeText("ハピエネ！", cx, feet + 18); ctx.fillStyle = "#ffe17a"; ctx.fillText("ハピエネ！", cx, feet + 18);
    } else if (d.hopping) {
      ctx.strokeStyle = "#5a6070"; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.moveTo(cx, p.y + p.h * .35); ctx.lineTo(cx, feet + 16); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(cx - 10, feet - 2); ctx.lineTo(cx + 10, feet - 2); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(cx - 8, p.y + p.h * .35); ctx.lineTo(cx + 8, p.y + p.h * .35); ctx.stroke();
      ctx.strokeStyle = "#7df9ff"; ctx.lineWidth = 1.5;
      ctx.beginPath(); for (let k = 0; k < 4; k++) { ctx.moveTo(cx - 5, feet + 3 + k * 3); ctx.lineTo(cx + 5, feet + 4.5 + k * 3); } ctx.stroke();
    } else if (d.balloons) {
      const cols = ["#ff5a7a", "#ffd23f", "#5ab0ff", "#7be07b", "#ff9b3d"];
      const topY = p.y - 46, sway = Math.sin((p.special.frame || 0) * .15) * 4;
      ctx.lineWidth = 1;
      for (let k = 0; k < 5; k++) {
        const bx = cx + (k - 2) * 9 + sway, by = topY - Math.abs(k - 2) * 5;
        ctx.strokeStyle = "rgba(255,255,255,.75)";
        ctx.beginPath(); ctx.moveTo(cx + p.facing * 4, p.y + 6); ctx.lineTo(bx, by + 9); ctx.stroke();
        ctx.fillStyle = cols[k];
        ctx.beginPath(); ctx.ellipse(bx, by, 7, 9, 0, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = "rgba(255,255,255,.55)";
        ctx.beginPath(); ctx.arc(bx - 2.5, by - 3, 2, 0, Math.PI * 2); ctx.fill();
      }
    } else if (d.charlieDash) {
      // チャーリーダッシュ：スピード線と小さな相棒
      ctx.strokeStyle = "rgba(255, 210, 120, .85)"; ctx.lineWidth = 3; ctx.lineCap = "round";
      for (let k = 0; k < 4; k++) {
        const yy = p.y + 8 + k * 10;
        ctx.beginPath(); ctx.moveTo(cx - p.w * .7, yy); ctx.lineTo(cx - p.w * 1.1 - k * 4, yy); ctx.stroke();
      }
      ctx.fillStyle = "#ffe17a"; ctx.font = "bold 12px sans-serif"; ctx.textAlign = "center";
      ctx.lineWidth = 3; ctx.strokeStyle = "#3a2200";
      ctx.strokeText("チャーリー！", cx, p.y - 12); ctx.fillText("チャーリー！", cx, p.y - 12);
    } else if (d.slideDash && p.special.slideX !== undefined) {
      ctx.strokeStyle = "rgba(192,57,43,.8)"; ctx.lineWidth = 5;
      ctx.beginPath(); ctx.moveTo(p.special.slideX, p.special.slideY - 40); ctx.lineTo(cx, feet); ctx.stroke();
    }
  }
  ctx.restore();
}

// ---------- サンドバッグAI / CPU AI (第3回コード統合) ----------
function createSandbagInput(sb, target) {
  const ai = { pressed: Object.create(null) };
  if (!sb.alive) return ai;
  const k = sb.keys;
  const mode = sb.sandbagBehavior || 0;
  const cx = sb.x + sb.w / 2, cy = sb.y + sb.h / 2;
  const mp = mainPlatform;
  if (!mp) return ai;
  const stageCenter = mp.x + mp.w / 2;
  const offStage = cx < mp.x + 20 || cx > mp.x + mp.w - 20;
  if (offStage && !sb.onGround) {
    if (cx < stageCenter) ai[k.right] = true;
    else ai[k.left] = true;
    if (sb.vy > 1 && cy > mp.y - 20) {
      if (sb.jumpsLeft > 0) ai.pressed[k.up] = true;
      else if (!sb.upBUsed) {
        ai[k.up] = true;
        if (cx < stageCenter) ai[k.right] = true; else ai[k.left] = true;
        ai.pressed[k.special] = true;
      }
    }
    return ai;
  }
  if (mode === 1 && sb.onGround) {
    ai[k.shield] = true;
    if (!sb.shieldActive) ai.pressed[k.shield] = true;
  } else if (mode === 2 && sb.onGround) {
    ai.pressed[k.up] = true;
  } else if (mode === 3) {
    if (Math.abs((target.x + target.w / 2) - cx) < 70 && Math.random() < 0.08) {
      ai.pressed[k.weak] = true;
    }
  }
  return ai;
}

function getIncomingProjectileThreat(cpu, target) {
  const body = cpu.getBody();
  let best = null;
  for (const shot of projectiles) {
    if (!shot || shot.owner !== target || Math.abs(shot.vx) < .25) continue;
    const movingRight = shot.vx > 0;
    if (movingRight && shot.x - shot.size > body.x + body.w) continue;
    if (!movingRight && shot.x + shot.size < body.x) continue;

    const gap = movingRight
      ? Math.max(0, body.x - (shot.x + shot.size))
      : Math.max(0, shot.x - shot.size - (body.x + body.w));
    const frames = gap / Math.abs(shot.vx);
    if (frames > 30) continue;

    const projectileY = shot.y + shot.vy * frames + shot.grav * frames * (frames - 1) * .5;
    const playerY = cpu.y + (cpu.onGround ? 0 : cpu.vy * frames + GRAVITY * cpu.fighter.gravity * frames * (frames - 1) * .5);
    if (projectileY + shot.size < playerY - 5 || projectileY - shot.size > playerY + cpu.h + 5) continue;

    if (cpu.aiLearning) {
      if (!shot.aiSeenBy) shot.aiSeenBy = new Set();
      if (!shot.aiSeenBy.has(cpu)) {
        shot.aiSeenBy.add(cpu);
        cpu.aiLearning.projectilesSeen = (cpu.aiLearning.projectilesSeen || 0) + 1;
      }
    }
    if (!best || frames < best.frames) best = { projectile: shot, frames, y: projectileY };
  }
  return best;
}

function markProjectileDodge(cpu, shot) {
  if (!shot.aiAvoidedBy) shot.aiAvoidedBy = new Set();
  shot.aiAvoidedBy.add(cpu);
}

function createProjectileEvasion(cpu, threat, ai, level) {
  if (cpu.hitstun > 0 || cpu.attackTimer > 0 || cpu.special || cpu.specialEndlag > 0 || cpu.smashCharge || cpu.dodgeTimer > 0) return false;
  const memory = cpu.aiLearning || { projectileResponse: 0 };
  const baseChance = level === 1 ? .64 : (level === 2 ? .86 : .97);
  const reactChance = Math.min(.995, baseChance + (memory.projectileResponse || 0));
  if (Math.random() > reactChance) return false;

  const shot = threat.projectile;
  const body = cpu.getBody();
  const timeToImpact = threat.frames;
  if (cpu.onGround && cpu.jumpsLeft > 0 && timeToImpact > 5 && timeToImpact < 27 && Math.random() < (level === 1 ? .52 : .68)) {
    ai.pressed[cpu.keys.up] = true;
    markProjectileDodge(cpu, shot);
    return true;
  }

  if (!cpu.onGround && !cpu.airDodgeUsed && !cpu.shieldBroken) {
    const verticalKey = threat.y >= body.y + body.h / 2 ? cpu.keys.up : cpu.keys.down;
    ai[verticalKey] = true;
    ai.pressed[verticalKey] = true;
    ai[cpu.keys.shield] = true;
    ai.pressed[cpu.keys.shield] = true;
    markProjectileDodge(cpu, shot);
    return true;
  }

  if (cpu.onGround && cpu.dodgeCooldown <= 0 && !cpu.shieldBroken) {
    const edgeMargin = 92;
    let side = shot.vx > 0 ? 1 : -1;
    if (mainPlatform && body.x + body.w / 2 < mainPlatform.x + edgeMargin) side = 1;
    else if (mainPlatform && body.x + body.w / 2 > mainPlatform.x + mainPlatform.w - edgeMargin) side = -1;
    const moveKey = side < 0 ? cpu.keys.left : cpu.keys.right;
    ai[moveKey] = true;
    ai.pressed[moveKey] = true;
    ai[cpu.keys.shield] = true;
    ai.pressed[cpu.keys.shield] = true;
    markProjectileDodge(cpu, shot);
    return true;
  }

  if (cpu.onGround && !cpu.shieldBroken) {
    ai[cpu.keys.shield] = true;
    ai.pressed[cpu.keys.shield] = true;
    return true;
  }
  return false;
}

function createCPUInput(cpu, target) {
  if (cpu.isSandbag) return createSandbagInput(cpu, target);
  const ai = { pressed: Object.create(null) };
  if (!cpu.alive || !target.alive) return ai;
  const k = cpu.keys;
  const lv = cpu.cpuLevel || 2;
  const reactChance = lv === 1 ? 0.015 : (lv === 2 ? 0.065 : 0.11);
  const cx = cpu.x + cpu.w / 2, cy = cpu.y + cpu.h / 2;
  const tx = target.x + target.w / 2, ty = target.y + target.h / 2;
  const dx = tx - cx, dy = ty - cy;
  const absX = Math.abs(dx), absY = Math.abs(dy);
  if (cpu.special && cpu.special.data.limitCharge) {
    const incoming = getIncomingProjectileThreat(cpu, target);
    if (!incoming && absX > 110 && cpu.limit < 100) ai[k.special] = true;
    return ai;
  }
  if (cpu.ledgeGrab) {
    const ledgeChance = lv === 1 ? 0.03 : 0.08;
    if (Math.random() < ledgeChance) {
      const r = Math.random();
      if (r < 0.45) ai.pressed[k.up] = true;
      else if (r < 0.78) ai.pressed[k.shield] = true;
      else ai.pressed[k.weak] = true;
    }
    return ai;
  }
  if (cpu.holdingTarget) {
    if (lv > 1 && Math.random() < 0.14 && cpu.holdTimer > 30) {
      ai.pressed[k.weak] = true;
    } else if (Math.random() < (lv === 1 ? 0.06 : 0.15) || cpu.holdTimer <= 25) {
      if (target.damage < 45) ai.pressed[k.down] = true;
      else if (target.damage > 95 && Math.random() < 0.5) ai.pressed[cpu.facing === 1 ? k.left : k.right] = true;
      else ai.pressed[k.up] = true;
    }
    return ai;
  }
  if (cpu.smashCharge) {
    const incoming = getIncomingProjectileThreat(cpu, target);
    if (incoming && lv >= 2) {
      cpu.smashCharge = null;
    } else {
      const holdLimit = lv === 3 ? 14 : 7;
      if (cpu.smashCharge.frames < holdLimit && absX < 85 && Math.random() < 0.7) {
        ai[k.strong] = true;
      }
      return ai;
    }
  }
  const mp = mainPlatform;
  if (!mp) return ai;
  const stageLeft = mp.x + 25;
  const stageRight = mp.x + mp.w - 25;
  const offStage = cx < stageLeft || cx > stageRight || cy > mp.y + 10;
  if (offStage && !cpu.onGround) {
    const stageCenter = mp.x + mp.w / 2;
    if (cx < stageCenter - 15) ai[k.right] = true;
    else if (cx > stageCenter + 15) ai[k.left] = true;
    const recChance = lv === 1 ? 0.09 : 0.25;
    if (cpu.vy > 1.0 && cy > mp.y - 25) {
      if (cpu.jumpsLeft > 0 && Math.random() < recChance) {
        ai.pressed[k.up] = true;
      } else if (!cpu.upBUsed && cy > mp.y + 10 && Math.random() < recChance * 1.3) {
        ai[k.up] = true;
        if (cx < stageCenter) ai[k.right] = true; else ai[k.left] = true;
        ai.pressed[k.special] = true;
      }
    }
    return ai;
  }
  const projectileThreat = getIncomingProjectileThreat(cpu, target);
  if (projectileThreat && createProjectileEvasion(cpu, projectileThreat, ai, lv)) return ai;
  if (cpu.fighter.limitBreak && lv >= 2 && cpu.onGround && cpu.limit < 100 && absX > 220 &&
      cpu.specialCooldown <= 0 && cpu.specialEndlag <= 0 && Math.random() < 0.03) {
    ai[k.down] = true;
    ai[k.special] = true;
    ai.pressed[k.special] = true;
    return ai;
  }
  const opponentDoingBigMove =
    (target.special && (target.special.data.shockwave || target.special.data.warlockCharge || target.special.kind === "down" || target.special.kind === "side")) ||
    target.smashCharge;
  if (opponentDoingBigMove && absX < 135 && absY < 60 && lv >= 2) {
    if (cpu.onGround && Math.random() < (lv === 2 ? 0.18 : 0.32)) {
      if (Math.random() < 0.65 && cpu.jumpsLeft > 0) {
        ai.pressed[k.up] = true;
      } else {
        ai[k.shield] = true;
        ai.pressed[k.shield] = true;
      }
      return ai;
    }
  }
  if (lv >= 2 && (target.attackTimer > 0 || target.special) && absX < 85 && absY < 60) {
    if (Math.random() < reactChance * 0.85) {
      if (!cpu.onGround) {
        ai.pressed[k.shield] = true;
        return ai;
      } else {
        ai[k.shield] = true;
        ai.pressed[k.shield] = true;
        if (Math.random() < 0.4) {
          const dodgeKey = dx > 0 ? k.left : k.right;
          ai[dodgeKey] = true;
          ai.pressed[dodgeKey] = true;
        }
        return ai;
      }
    }
  }
  const moveProb = lv === 1 ? 0.54 : (lv === 2 ? 0.9 : 0.98);
  const stopDist = lv === 1 ? 48 : 34;
  if (Math.random() < moveProb) {
    if (dx > stopDist) ai[k.right] = true;
    else if (dx < -stopDist) ai[k.left] = true;
  }
  if (dy < -55 && cpu.onGround && Math.random() < (lv === 1 ? 0.02 : 0.05)) {
    ai.pressed[k.up] = true;
  }
  if (dy > 55 && cpu.onGround && cpu.standingPlatform && !cpu.standingPlatform.main && Math.random() < 0.07) {
    ai[k.down] = true;
    ai.pressed[k.down] = true;
    return ai;
  }
  if (cpu.aiCooldown <= 0 && Math.random() < reactChance) {
    if (absX < 62 && absY < 52) {
      if (lv >= 2 && cpu.onGround && target.shieldActive && Math.random() < 0.38) {
        ai.pressed[k.grab] = true;
        cpu.aiCooldown = lv === 2 ? 28 : 20;
      } else if (lv >= 2 && cpu.onGround && target.damage > 75 && Math.random() < 0.32) {
        if (dy < -18) { ai[k.up] = true; ai.pressed[k.strong] = true; }
        else if (Math.random() < 0.5) { ai[dx >= 0 ? k.right : k.left] = true; ai.pressed[k.strong] = true; }
        else { ai.pressed[k.strong] = true; }
        cpu.aiCooldown = 30;
      } else {
        if (dy < -20) ai[k.up] = true;
        else if (dy > 20 && !cpu.onGround) ai[k.down] = true;
        else if (absX > 28) ai[dx >= 0 ? k.right : k.left] = true;
        ai.pressed[k.weak] = true;
        cpu.aiCooldown = lv === 1 ? 45 : (lv === 2 ? 24 : 16);
      }
    } else if (absX >= 62 && absX < 190 && absY < 50 && Math.random() < (lv === 1 ? 0.15 : 0.32)) {
      if ((cpu.fighter.specials.neutral.projectile || cpu.fighter.specials.neutral.magicCycle) && Math.random() < 0.65) {
        ai[k.left] = false; ai[k.right] = false;
        ai.pressed[k.special] = true;
      } else if (cpu.onGround && lv >= 2 && !(cpu.fighter.specials.side.oncePerStock && cpu.stockSideBUsed)) {
        ai[dx >= 0 ? k.right : k.left] = true;
        ai.pressed[k.special] = true;
      }
      cpu.aiCooldown = lv === 1 ? 50 : 28;
    }
  }
  return ai;
}

// ---------- 友達とプレイ（WebRTC / PeerJS） ----------
let netMode = false;
let netRole = null; // "host" | "guest"
let netPeer = null;
let netConn = null;
let netRemoteHeld = Object.create(null);
let netRemotePressed = Object.create(null);
let netStageNotice = "";
let netPing = 0;
let netPingTimer = null;
let netConnectTimer = null;
let netGuestRetryTimer = null;
let netGuestRetryCount = 0;
let pwDisconnectReturnToTitle = false;

const pwModal = document.getElementById("pw-modal");
const pwInput = document.getElementById("pw-input");
const pwConnectBtn = document.getElementById("pw-submit-btn");
const pwCancelBtn = document.getElementById("pw-cancel-btn");
const pwNewRoomBtn = document.getElementById("pw-new-room-btn");
const pwCopyBtn = document.getElementById("pw-copy-btn");
const pwStatus = document.getElementById("pw-status");
const pwNameInput = document.getElementById("pw-name-input");
const ONLINE_NAME_STORAGE_KEY = "mbsp-online-name";
let onlineNames = ["", ""];
// ── オンライン軽量化：状態送信30Hz・入力をビットマスクに圧縮・ゲスト側は補間＆先行入力 ──
const NET_STATE_SEND_INTERVAL = 2;   // 60fpsのうち2フレームに1回（30Hz）
const NET_MAX_PROJECTILES = 28;
const NET_BUFFER_LIMIT = 96 * 1024;  // 送信バッファが溜まっていたら送らない
const NET_KEY_BITS = { left: 1, right: 2, up: 4, down: 8, jump: 16, weak: 32, strong: 64, special: 128, shield: 256, grab: 512 };
const NET_CANONICAL_KEYS = { left: "a", right: "d", up: "w", down: "s", jump: "Space", weak: "f", strong: "g", special: "e", shield: "r", grab: "q" };
let netFrameCounter = 0;

function onlineSendState(throttle = true) {
  if (!netMode || netRole !== "host" || !netConn || !netConn.open) return;
  if (throttle && netFrameCounter % NET_STATE_SEND_INTERVAL !== 0) return;
  const channel = netConn.dataChannel || netConn._dc || null;
  if (channel && typeof channel.bufferedAmount === "number" && channel.bufferedAmount > NET_BUFFER_LIMIT) return;
  try { netConn.send(serializeOnlineState()); } catch (e) {}
}

// 名前は画面に描画するだけ（HTMLとしては扱わない）。制御文字を除いて10文字までにそろえる
function sanitizeOnlineName(raw, fallback = "") {
  const clean = String(raw ?? "").replace(/[\u0000-\u001f\u007f-\u009f\u200b-\u200f\u2028-\u202e\u2066-\u2069]/g, "").replace(/\s+/g, " ").trim();
  return Array.from(clean).slice(0, 10).join("") || fallback;
}
function getMyOnlineName() {
  const typed = pwNameInput ? sanitizeOnlineName(pwNameInput.value) : "";
  if (typed) { try { localStorage.setItem(ONLINE_NAME_STORAGE_KEY, typed); } catch (e) {} }
  return typed || "名無しの挑戦者";
}
try { if (pwNameInput) pwNameInput.value = sanitizeOnlineName(localStorage.getItem(ONLINE_NAME_STORAGE_KEY) || ""); } catch (e) {}
if (pwNameInput && pwNameInput.addEventListener) pwNameInput.addEventListener("keydown", e => { e.stopPropagation(); });
const pwPickInfo = document.getElementById("pw-desc");

function setOnlineStatus(phase, message, showNewRoom = false, showCopy = false) {
  pwStatus.dataset.state = phase;
  const busy = ["connecting", "waiting", "retrying", "connected"].includes(phase);
  pwStatus.setAttribute("aria-busy", busy ? "true" : "false");
  pwStatus.textContent = message;
  pwConnectBtn.disabled = busy;
  pwConnectBtn.textContent = phase === "waiting" ? "相手を待っています…" : (phase === "connected" ? "接続成功…" : (busy ? "接続中…" : (phase === "error" ? "再接続する" : "接続する")));
  pwNewRoomBtn.hidden = !showNewRoom;
  pwNewRoomBtn.style.display = showNewRoom ? "inline-flex" : "none";
  pwCopyBtn.hidden = !showCopy;
  pwCopyBtn.style.display = showCopy ? "inline-flex" : "none";
}

function generateRoomPassword() {
  const alphabet = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
  const bytes = new Uint8Array(6);
  try { crypto.getRandomValues(bytes); }
  catch (e) { for (let i = 0; i < bytes.length; i++) bytes[i] = Math.floor(Math.random() * 256); }
  return Array.from(bytes, byte => alphabet[byte % alphabet.length]).join("");
}

function startFreshOnlineRoom() {
  pwInput.value = generateRoomPassword();
  startOnlineConnect();
}

async function copyRoomPassword() {
  try {
    await navigator.clipboard.writeText(pwInput.value);
    setOnlineStatus("waiting", `合言葉「${pwInput.value}」をコピーしました。友達が同じ合言葉を入力するまで待機中です。`, false, true);
  } catch (e) {
    pwInput.focus();
    pwInput.select();
    setOnlineStatus("waiting", "合言葉を選択しました。コピーして友達に送ってください。相手が接続するまで待機中です。", false, true);
  }
}

function roomIdFromPassword(pw) {
  const s = pw.trim().toLowerCase();
  let h1 = 0x811c9dc5, h2 = 0x1000193;
  for (let i = 0; i < s.length; i++) {
    const c = s.charCodeAt(i);
    h1 = Math.imul(h1 ^ c, 16777619) >>> 0;
    h2 = (Math.imul(h2 + c, 2654435761) ^ (h2 >>> 13)) >>> 0;
  }
  return "mbsp-room-" + h1.toString(36) + h2.toString(36);
}

// ステージ決定ルール：二人とも同じならそのステージ、違うなら二人が選んだどちらかをランダム
function decideOnlineStage(hostStageIdx, guestStageIdx) {
  const a = hostStageIdx === RANDOM_STAGE_INDEX ? Math.floor(Math.random() * STAGES.length) : hostStageIdx;
  const b = guestStageIdx === RANDOM_STAGE_INDEX ? Math.floor(Math.random() * STAGES.length) : guestStageIdx;
  if (a === b) {
    let notice;
    if (hostStageIdx === guestStageIdx && hostStageIdx !== RANDOM_STAGE_INDEX) {
      notice = `接続成功。P1・P2の希望が一致 →「${STAGES[a].name}」に決定！`;
    } else if (hostStageIdx === RANDOM_STAGE_INDEX && guestStageIdx !== RANDOM_STAGE_INDEX) {
      notice = `接続成功。P2の希望「${STAGES[b].name}」とランダム抽選が一致 → P2の希望を採用！`;
    } else if (guestStageIdx === RANDOM_STAGE_INDEX && hostStageIdx !== RANDOM_STAGE_INDEX) {
      notice = `接続成功。P1の希望「${STAGES[a].name}」とランダム抽選が一致 → P1の希望を採用！`;
    } else {
      notice = `接続成功。両者のランダム抽選が一致 →「${STAGES[a].name}」に決定！`;
    }
    return {
      stage: a,
      notice
    };
  }
  const picked = Math.random() < 0.5 ? a : b;
  const pickedBy = picked === a ? "P1" : "P2";
  const hostLabel = hostStageIdx === RANDOM_STAGE_INDEX ? `ランダム（${STAGES[a].name}）` : STAGES[a].name;
  const guestLabel = guestStageIdx === RANDOM_STAGE_INDEX ? `ランダム（${STAGES[b].name}）` : STAGES[b].name;
  return {
    stage: picked,
    notice: `接続成功。P1「${hostLabel}」× P2「${guestLabel}」→ 抽選で${pickedBy}の希望「${STAGES[picked].name}」を採用！`
  };
}

function closeNet() {
  if (netPingTimer) { clearInterval(netPingTimer); netPingTimer = null; }
  if (netConnectTimer) { clearTimeout(netConnectTimer); netConnectTimer = null; }
  if (netGuestRetryTimer) { clearTimeout(netGuestRetryTimer); netGuestRetryTimer = null; }
  const oldConn = netConn;
  const oldPeer = netPeer;
  netConn = null;
  netPeer = null;
  netRole = null;
  netRemoteHeld = Object.create(null);
  netRemotePressed = Object.create(null);
  netPing = 0;
  netGuestRetryCount = 0;
  try { if (oldConn) oldConn.close(); } catch (e) {}
  try { if (oldPeer) oldPeer.destroy(); } catch (e) {}
}

function setNetConnectTimeout(ms, message, expectedConn = null, expectedPeer = null) {
  if (netConnectTimer) clearTimeout(netConnectTimer);
  netConnectTimer = setTimeout(() => {
    netConnectTimer = null;
    if (screen !== "password" || pwModal.style.display !== "flex") return;
    if (expectedConn && netConn !== expectedConn) return;
    if (expectedPeer && netPeer !== expectedPeer) return;
    failOnlineConnection(message);
  }, ms);
}

function clearNetConnectTimeout() {
  if (netConnectTimer) { clearTimeout(netConnectTimer); netConnectTimer = null; }
}

function describePeerError(err, phase = "signal") {
  const type = err && err.type ? err.type : "unknown";
  if (type === "peer-unavailable") return "友達のルームが見つかりません。同じパスワードか、相手が接続待ち中か確認してください。";
  if (type === "network" || type === "socket-error" || type === "socket-closed") {
    return "PeerJS通信サーバーに接続できません。二人ともインターネットに接続し、443番ポートが使えるネットワークでお試しください。";
  }
  if (type === "browser-incompatible") return "このブラウザーはWebRTCに対応していません。最新版のChrome、Edge、Firefox、Safariでお試しください。";
  if (type === "webrtc" || phase === "data") return "端末同士の通信を確立できませんでした。VPNや学校・会社のネットワークでは接続できない場合があります。";
  if (type === "server-error") return "PeerJS通信サーバーでエラーが発生しました。少し待ってからもう一度お試しください。";
  if (type === "unavailable-id") return "同じパスワードのルームが見つかりました。参加を続けています…";
  return `通信エラー (${type})。二人が同じパスワードを使い、HTTPSまたはlocalhostで開いているか確認してください。`;
}

function failOnlineConnection(message) {
  closeNet();
  setOnlineStatus("error", `${message} 「再接続する」か、新しい合言葉の部屋を作れます。`, true);
}

function showOnlineDisconnect(message) {
  closeNet();
  netMode = true;
  pwDisconnectReturnToTitle = true;
  screen = "password";
  const myChar = selectedFighters[0] === RANDOM_INDEX ? "ランダム" : getFighterByIndex(selectedFighters[0]).name;
  const myStage = selectedStage === RANDOM_STAGE_INDEX ? "ランダム" : STAGES[selectedStage].name;
  pwPickInfo.textContent = `接続が切れた対戦：キャラ【${myChar}】 ／ 希望ステージ【${myStage}】`;
  pwModal.style.display = "flex";
  setOnlineStatus("error", `対戦中に切断されました。${message} 同じ合言葉で再接続するか、新しい部屋を作れます。`, true);
  setTimeout(() => pwInput.focus(), 30);
}

function openPasswordScreen() {
  screen = "password";
  pwDisconnectReturnToTitle = false;
  const myChar = selectedFighters[0] === RANDOM_INDEX ? "ランダム" : getFighterByIndex(selectedFighters[0]).name;
  const myStg = selectedStage === RANDOM_STAGE_INDEX ? "ランダム" : STAGES[selectedStage].name;
  pwPickInfo.textContent = `あなたの選択：キャラ【${myChar}】 ／ 希望ステージ【${myStg}】`;
  setOnlineStatus("idle", "合言葉を入力して接続してください。");
  pwModal.style.display = "flex";
  for (const k of Object.keys(input)) { if (k !== "pressed") input[k] = false; }
  setTimeout(() => pwInput.focus(), 30);
}

function hidePasswordModal() {
  pwModal.style.display = "none";
}

function startOnlineConnect() {
  const pw = pwInput.value.trim();
  if (!pw) {
    setOnlineStatus("error", "合言葉を入力してください。");
    return;
  }
  if ([...pw].length > 24) {
    setOnlineStatus("error", "合言葉は24文字以内で入力してください。");
    return;
  }
  if (typeof navigator !== "undefined" && navigator.onLine === false) {
    setOnlineStatus("error", "インターネットに接続されていません。接続を確認して再接続してください。");
    return;
  }
  if (window.isSecureContext === false) {
    setOnlineStatus("error", "オンライン対戦にはHTTPSが必要です。https://のURL、または開発時はlocalhostで開いてください。");
    return;
  }
  if (typeof RTCPeerConnection === "undefined") {
    setOnlineStatus("error", "このブラウザーではWebRTCが使えません。最新版のブラウザーで開いてください。");
    return;
  }
  if (typeof Peer === "undefined") {
    setOnlineStatus("error", "PeerJSを読み込めませんでした。接続を確認してページを再読み込みしてください。");
    return;
  }
  closeNet();
  setOnlineStatus("connecting", "PeerJSサーバーに接続し、同じ合言葉の部屋を探しています…");

  const roomId = roomIdFromPassword(pw);
  const myFighter = resolveFighterIndex(selectedFighters[0]);
  const myWasRandom = selectedFighters[0] === RANDOM_INDEX;
  const myStageChoice = selectedStage;
  netGuestRetryCount = 0;

  // 先に入った方が roomId でホストになり、既にホストがいればゲストとして接続
  let peer;
  try {
    peer = new Peer(roomId, {
      debug: 1,
      config: {
        iceServers: [
          { urls: "stun:stun.l.google.com:19302" },
          { urls: "stun:stun.cloudflare.com:3478" }
        ],
        sdpSemantics: "unified-plan"
      }
    });
  } catch (e) {
    failOnlineConnection("部屋を作成できませんでした。合言葉を変えて再試行してください。");
    return;
  }
  netPeer = peer;
  let becameHost = false;
  setNetConnectTimeout(20000, "通信サーバーへの接続がタイムアウトしました。インターネット接続と443番ポートを確認してください。", null, peer);

  peer.on("open", () => {
    if (netPeer !== peer) return;
    clearNetConnectTimeout();
    becameHost = true;
    netRole = "host";
    setOnlineStatus("waiting", `部屋を作成しました。相手待ち（合言葉: ${pw}）。友達に合言葉を伝えてください。60秒でタイムアウトします。`, false, true);
    setNetConnectTimeout(60000, "60秒以内に相手が来ませんでした。合言葉を確認して再接続するか、新しい部屋を作ってください。", null, peer);
  });

  peer.on("connection", conn => {
    if (netPeer !== peer) { try { conn.close(); } catch (e) {} return; }
    if (netConn && netConn.open) { try { conn.close(); } catch (e) {} return; }
    clearNetConnectTimeout();
    setOnlineStatus("connecting", "友達が見つかりました。対戦設定を交換しています…");
    netConn = conn;
    setupNetConnection(conn, myFighter, myWasRandom, myStageChoice);
  });

  peer.on("error", err => {
    if (netPeer !== peer) return;
    if (!becameHost && err && err.type === "unavailable-id") {
      // 既に同じパスワードのホストが待機中 → ゲストとして参加
      clearNetConnectTimeout();
      try { peer.destroy(); } catch (e) {}
      netPeer = null;
      connectAsGuest(roomId, myFighter, myWasRandom, myStageChoice);
      return;
    }
    failOnlineConnection(describePeerError(err));
  });

  peer.on("disconnected", () => {
    if (netPeer === peer && screen === "password") {
      failOnlineConnection("PeerJS通信サーバーから切断されました。ネットワークを確認して、もう一度接続してください。");
    }
  });
}

function connectAsGuest(roomId, myFighter, myWasRandom, myStageChoice) {
  setOnlineStatus("connecting", "同じ合言葉の部屋が見つかりました。友達へ接続しています…");
  netGuestRetryCount = 0;

  const scheduleRetry = (err, sourcePeer) => {
    if (sourcePeer && netPeer !== sourcePeer) return true;
    if (screen !== "password") return false;
    if (err && err.type !== "peer-unavailable") return false;
    if (netGuestRetryTimer) return true;
    if (netGuestRetryCount >= 3) return false;
    netGuestRetryCount++;
    const retryNo = netGuestRetryCount;
    setOnlineStatus("retrying", `相手を検索し直しています… (${retryNo}/3)`);
    const staleConn = netConn;
    const stalePeer = netPeer;
    netConn = null;
    netPeer = null;
    netRole = null;
    clearNetConnectTimeout();
    if (netPingTimer) { clearInterval(netPingTimer); netPingTimer = null; }
    try { if (staleConn) staleConn.close(); } catch (e) {}
    try { if (stalePeer) stalePeer.destroy(); } catch (e) {}
    netGuestRetryTimer = setTimeout(() => {
      netGuestRetryTimer = null;
      if (screen === "password") createGuestPeer();
    }, 900 * retryNo);
    return true;
  };

  const connectToHost = peer => {
    if (netPeer !== peer || peer.destroyed || screen !== "password") return;
    let conn;
    // JSON serialization avoids BinaryPack edge cases with key maps created for input state.
    try { conn = peer.connect(roomId, { reliable: true, serialization: "json" }); }
    catch (e) {
      if (!scheduleRetry({ type: "peer-unavailable" }, peer)) failOnlineConnection(describePeerError({ type: "peer-unavailable" }));
      return;
    }
    if (!conn) {
      if (!scheduleRetry({ type: "peer-unavailable" }, peer)) failOnlineConnection("友達のルームに接続できませんでした。同じパスワードを確認してください。");
      return;
    }
    netConn = conn;
    setNetConnectTimeout(18000, "友達のルームへの接続がタイムアウトしました。相手が同じパスワードで待機中か確認してください。", conn, peer);
    setupNetConnection(conn, myFighter, myWasRandom, myStageChoice, err => scheduleRetry(err, peer));
    conn.on("open", () => {
      if (netConn !== conn || netPeer !== peer) return;
      setOnlineStatus("connected", "接続成功。あなたと友達の希望ステージを確認しています…");
      setNetConnectTimeout(15000, "対戦設定の応答がありません。相手側で接続が完了しているか確認してください。", conn, peer);
      try {
        conn.send({ t: "join", fighter: myFighter, wasRandom: myWasRandom, stage: myStageChoice, name: getMyOnlineName() });
      } catch (e) {
        failOnlineConnection("対戦設定を送信できませんでした。もう一度接続してください。");
      }
    });
  };

  const createGuestPeer = () => {
    if (screen !== "password") return;
    let peer;
    try {
      peer = new Peer(undefined, {
        debug: 1,
        config: {
          iceServers: [
            { urls: "stun:stun.l.google.com:19302" },
            { urls: "stun:stun.cloudflare.com:3478" }
          ],
          sdpSemantics: "unified-plan"
        }
      });
    } catch (e) {
      failOnlineConnection("接続先を作成できませんでした。ネットワークを確認して再接続してください。");
      return;
    }
    netPeer = peer;
    netRole = "guest";
    setNetConnectTimeout(20000, "PeerJS通信サーバーへの接続がタイムアウトしました。インターネットと443番ポートを確認してください。", null, peer);
    peer.on("open", () => {
      if (netPeer !== peer) return;
      clearNetConnectTimeout();
      connectToHost(peer);
    });
    peer.on("error", err => {
      if (netPeer !== peer) return;
      if (scheduleRetry(err, peer)) return;
      failOnlineConnection(describePeerError(err, "data"));
    });
    peer.on("disconnected", () => {
      if (netPeer === peer && screen === "password") {
        failOnlineConnection("PeerJS通信サーバーから切断されました。ネットワークを確認して再接続してください。");
      }
    });
  };

  createGuestPeer();
}

function setupNetConnection(conn, myFighter, myWasRandom, myStageChoice, recoverConnection = null) {
  if (netPingTimer) clearInterval(netPingTimer);
  netPingTimer = setInterval(() => {
    if (conn && conn.open) {
      try { conn.send({ t: "ping", ts: performance.now() }); } catch (e) {}
    }
  }, 1000);

  conn.on("open", () => {
    if (netConn !== conn) return;
    if (netRole === "host" && screen === "password") {
      clearNetConnectTimeout();
      setOnlineStatus("connected", "接続成功。友達のステージ希望を確認しています…");
      setNetConnectTimeout(20000, "相手から対戦設定が届きませんでした。両方の端末で同じパスワードを入力してください。", conn, netPeer);
    }
  });

  conn.on("error", err => {
    if (netConn !== conn) return;
    if (recoverConnection && recoverConnection(err)) return;
    const message = describePeerError(err, "data");
    if (screen === "password") failOnlineConnection(message);
    else if (netMode && (screen === "fight" || screen === "results")) showOnlineDisconnect(message);
  });

  conn.on("close", () => {
    if (netConn !== conn) return;
    if (screen === "password") {
      if (recoverConnection && recoverConnection({ type: "peer-unavailable" })) return;
      failOnlineConnection("友達との通信が閉じられました。両方の端末で同じパスワードを入力してやり直してください。");
    } else if (netMode && (screen === "fight" || screen === "results")) {
      showOnlineDisconnect("友達との通信が切れました。ネットワークを確認して、もう一度対戦してください。");
    }
  });

  conn.on("data", msg => {
    if (!msg || !msg.t) return;
    if (msg.t === "ping") {
      try { conn.send({ t: "pong", ts: msg.ts }); } catch (e) {}
    } else if (msg.t === "pong") {
      netPing = Math.max(1, Math.round(performance.now() - msg.ts));
    } else if (msg.t === "join" && netRole === "host") {
      if (!Number.isInteger(msg.fighter) || msg.fighter < 0 || msg.fighter > GEORGIA_INDEX || msg.fighter === RANDOM_INDEX || !Number.isInteger(msg.stage) || msg.stage < 0 || msg.stage > RANDOM_STAGE_INDEX) {
        failOnlineConnection("相手から不正な対戦設定を受け取りました。両方の端末でページを再読み込みしてください。");
        return;
      }
      const res = decideOnlineStage(myStageChoice, msg.stage);
      const startInfo = {
        t: "start",
        p1: myFighter,
        p1Rand: myWasRandom,
        p2: msg.fighter,
        p2Rand: msg.wasRandom,
        p1Name: getMyOnlineName(),
        p2Name: sanitizeOnlineName(msg.name, "名無しの挑戦者"),
        stage: res.stage,
        notice: res.notice
      };
      try { conn.send(startInfo); }
      catch (e) { failOnlineConnection("対戦開始情報を送信できませんでした。もう一度接続してください。"); return; }
      beginOnlineMatch(startInfo);
    } else if (msg.t === "start" && netRole === "guest") {
      beginOnlineMatch(msg);
    } else if (msg.t === "in" && netRole === "host") {
      netRemoteHeld = Object.create(null);
      netRemotePressed = Object.create(null);
      if (typeof msg.tj === "number") netRemoteTapJump = !!msg.tj;
      if (typeof msg.hm === "number" || typeof msg.pm === "number") {
        // 軽量フォーマット（ビットマスク）
        const heldMask = msg.hm | 0, pressedMask = msg.pm | 0;
        for (const a of CONTROL_ACTIONS) {
          const bit = NET_KEY_BITS[a.key];
          if (!bit) continue;
          const ck = NET_CANONICAL_KEYS[a.key];
          if (heldMask & bit) netRemoteHeld[ck] = true;
          if (pressedMask & bit) netRemotePressed[ck] = true;
        }
      } else {
        // 旧フォーマット（キーマップ）との互換
        const guestKeys = ["ArrowLeft", "ArrowRight", "ArrowUp", "ArrowDown", "a", "d", "w", "s", "Space", ";", "Enter", "/", ",", ".", "Shift", "f", "g", "e", "r", "q"];
        for (const k of guestKeys) {
          if (msg.h && msg.h[k]) netRemoteHeld[k] = true;
          if (msg.p && msg.p[k]) netRemotePressed[k] = true;
        }
      }
    } else if (msg.t === "state" && netRole === "guest") {
      applyOnlineState(msg);
    } else if (msg.t === "rematch" && netRole === "guest") {
      beginOnlineMatch(msg.info);
    }
  });

}

let lastOnlineMatchInfo = null;
let netRemoteTapJump = true;

function beginOnlineMatch(info) {
  clearNetConnectTimeout();
  lastOnlineMatchInfo = info;
  pwDisconnectReturnToTitle = false;
  hidePasswordModal();
  pwConnectBtn.disabled = false;
  netStageNotice = info.notice || "";
  loadStage(info.stage);
  players = [
    new Player(280, info.p1, 0, !!info.p1Rand, false, 2, false),
    new Player(560, info.p2, 1, !!info.p2Rand, false, 2, false)
  ];
  // オンラインでも色を決める（未設定だと堕天使りかちゃんが白く表示され、名前の文字色も崩れていた）
  Player.updateColors(players);
  onlineNames = [sanitizeOnlineName(info.p1Name, "P1"), sanitizeOnlineName(info.p2Name, "P2")];
  for (const player of players) player.prepareForCountdown();
  effects = [];
  projectiles = [];
  netRemoteHeld = Object.create(null);
  netRemotePressed = Object.create(null);
  netRemoteTapJump = true;
  camX = 0;
  camY = 0;
  cameraShake = 0;
  hitZoom = null;
  countdownFrame = 0;
  tutorialActive = false;
  screen = "fight";
  registerMatchStarted(netRole === "guest" ? !!info.p2Rand : !!info.p1Rand, selectedStage === RANDOM_STAGE_INDEX);
}

function serializeOnlineState() {
  return {
    t: "state",
    cd: countdownFrame,
    st: stageTimer,
    res: screen === "results" ? 1 : 0,
    hz: hitZoom ? { x: hitZoom.x, y: hitZoom.y, fr: hitZoom.frames, mx: hitZoom.maxFrames, pw: hitZoom.strength } : null,
    p: players.map(p => ({
      x: Math.round(p.x * 10) / 10,
      y: Math.round(p.y * 10) / 10,
      vx: Math.round(p.vx * 10) / 10,
      vy: Math.round(p.vy * 10) / 10,
      og: p.onGround ? 1 : 0,
      pl: p.standingPlatform ? platforms.indexOf(p.standingPlatform) : -1,
      f: p.facing,
      af: p.attackFacing,
      d: Math.round(p.damage * 100) / 100,
      rh: p.rikaHappy > 0 ? p.rikaHappy : 0,
      fl: p.flying ? 1 : 0,
      fa: p.floatActive ? 1 : 0,
      mr: p.meatRaw || 0, mg: p.meatGrilled || 0, pz: p.poisonTimer || 0, bn: p.burnTimer || 0, et: p.eatTimer || 0,
      s: p.stocks,
      iv: p.invincible,
      dv: p.dodgeInvincible,
      dt: p.dodgeTimer,
      sh: p.shieldActive ? 1 : 0,
      sp2: Math.round(p.shieldHP),
      sb: p.shieldBroken ? 1 : 0,
      jg: p.justGuardActive ? 1 : 0,
      pf: p.parryFlash,
      hs: p.hitstun,
      hl: p.hitlag, hlt: p.hitlagTotal || 0, pr: p.proneTimer || 0, stg: p.staggerTimer || 0,
      tw: p.techWindow || 0,
      pp: p.pendingProne ? { d: p.pendingProne.duration || 38, w: p.pendingProne.techWindow || 16 } : null,
      cr: p.crouching ? 1 : 0,
      bs: Math.round((p.bodySquash || 0) * 100) / 100,
      lm: Math.round(p.limit || 0),
      mi: p.magicIndex,
      ssb: p.stockSideBUsed ? 1 : 0,
      eb: p.eyebrowFlash || 0,
      at: p.attackType,
      afr: p.attackFrame,
      atm: p.attackTimer,
      sc: p.smashCharge ? p.smashCharge.frames : -1,
      el: p.specialEndlag,
      lg: p.ledgeGrab ? 1 : 0,
      la: p.ledgeAction ? p.ledgeAction.type : null,
      laf: p.ledgeAction ? p.ledgeAction.frame : 0,
      lad: p.ledgeAction ? p.ledgeAction.duration : 0,
      ht: p.holdingTarget ? 1 : 0,
      ml: p.moveLabel,
      mlt: p.moveLabelTimer,
      sp: p.special ? {
        k: p.special.kind,
        fr: p.special.frame,
        st: p.special.startup,
        rv: p.special.reversed ? 1 : 0,
        gt: p.special.grabTarget ? 1 : 0,
        ad: p.special.airDive ? 1 : 0,
        aw: p.special.airWarlock ? 1 : 0,
        hf: p.special.holdFrames || 0,
        zd: p.special.zapsDone || 0
      } : null
    })),
    pr: projectiles.slice(0, NET_MAX_PROJECTILES).map(s => ({
      x: Math.round(s.x), y: Math.round(s.y), vx: s.vx,
      sz: s.size, c: s.color, lf: s.life, vy: Math.round((s.vy || 0) * 10) / 10, gv: s.grav || 0,
      bm: s.beam ? 1 : 0, st: s.star ? 1 : 0, cn: s.coin ? 1 : 0,
      ms: s.missile ? 1 : 0, ar: s.arrow ? 1 : 0, bb: s.bomb ? 1 : 0,
      wv: s.wave ? 1 : 0, fb: s.fireBreath ? 1 : 0, ch: s.charge ? 1 : 0,
      hm: s.hammer ? 1 : 0, gm: s.gum ? 1 : 0, bal: s.balance ? 1 : 0, hat: s.hatman ? 1 : 0, pl: s.peel ? (s.landed ? 2 : 1) : 0, vg: s.veggie ? 1 : 0, mt: s.meat ? (s.meatKind === "cooked" ? 2 : 1) : 0
    }))
  };
}

function applyOnlineState(msg) {
  countdownFrame = msg.cd;
  if (Object.prototype.hasOwnProperty.call(msg, "hz")) {
    hitZoom = (settings.screenEffects && msg.hz) ? { x: msg.hz.x, y: msg.hz.y, frames: msg.hz.fr, maxFrames: msg.hz.mx, strength: msg.hz.pw } : null;
  }
  if (typeof msg.st === "number") {
    stageTimer = msg.st - 1;
    updateStagePlatforms();
  }
  if (players.length === 2 && msg.p) {
    for (let i = 0; i < 2; i++) {
      const s = msg.p[i], p = players[i];
      if (!s || !p) continue;
      if (s.hs > p.hitstun && s.hs >= 12) {
        spawnHitEffect(s.x + p.w / 2, s.y + p.h / 2, s.hs >= 22);
        if (s.hs >= 20) {
          const power = Math.min(22, (s.hs - 10) / 1.35);
          spawnImpactEffect(s.x + p.w / 2, s.y + p.h / 2, power, "#ffd166", s.vx >= 0 ? 1 : -1);
          if (settings.screenEffects) cameraShake = Math.max(cameraShake, Math.min(9, power * .35));
          playSfx(power >= 10.5 ? "smash" : "hit", .45 + power / 16);
          if (settings.screenEffects && power >= 13) hitZoom = { x: s.x + p.w / 2, y: s.y + p.h / 2, frames: 20, maxFrames: 20, strength: Math.min(.4, .16 + power * .015) };
        }
      }
      if (s.s < p.stocks) {
        spawnBurstEffect(Math.max(30, Math.min(VIEW_W - 30, p.x + p.w / 2)), Math.max(30, Math.min(VIEW_H - 30, p.y + p.h / 2)), p.color);
        addAchievementProgress("stockLosses", 1, p);
      }
      if (i === 1) {
        // 自分のキャラ：先行入力の位置をなるべく保ち、ズレだけ少しずつ直す
        const errX = p.x - s.x, errY = p.y - s.y;
        const snap = Math.abs(errX) > 80 || Math.abs(errY) > 110 || s.hs > 0 || s.at || s.sp || s.lg || s.pr;
        if (snap) { p.x = s.x; p.y = s.y; p.vx = s.vx; p.vy = s.vy; p.netCorrX = 0; p.netCorrY = 0; }
        else { p.netCorrX = errX; p.netCorrY = errY; }
      } else {
        // 相手のキャラ：目標位置へ補間して、パケット抜けのカクつきを消す
        if (!p.netInit) { p.x = s.x; p.y = s.y; p.netInit = true; }
        p.netTargetX = s.x; p.netTargetY = s.y;
      }
      p.onGround = !!s.og;
      p.standingPlatform = Number.isInteger(s.pl) && s.pl >= 0 ? platforms[s.pl] || null : null;
      p.facing = s.f; p.attackFacing = s.af;

// ゲスト側：相手の補間・自分のズレ補正・自由行動の先行入力
function updateGuestOnlineFrame() {
  if (!netMode || netRole !== "guest" || players.length < 2) return;
  const opp = players[0], me = players[1];
  // 相手は目標位置へなめらかに寄せる（急なズレだけ即時）
  if (opp && opp.netTargetX !== undefined) {
    const dx = opp.netTargetX - opp.x, dy = opp.netTargetY - opp.y;
    if (Math.abs(dx) > 120 || Math.abs(dy) > 150) { opp.x = opp.netTargetX; opp.y = opp.netTargetY; }
    else { opp.x += dx * .42; opp.y += dy * .42; }
  }
  // 飛び道具も毎フレーム動かして滑らかにする
  for (const s of projectiles) { s.x += s.vx; s.y += s.vy; s.vy += s.grav; s.life--; }
  if (!me || !me.alive) return;
  // 自分の位置ズレを少しずつ戻す
  if (me.netCorrX || me.netCorrY) {
    me.x -= me.netCorrX * .22; me.y -= me.netCorrY * .22;
    me.netCorrX *= .78; me.netCorrY *= .78;
    if (Math.abs(me.netCorrX) < .2) me.netCorrX = 0;
    if (Math.abs(me.netCorrY) < .2) me.netCorrY = 0;
  }
  // 自由に動けるときだけ、その場で移動を先に反映（攻撃・被弾の判定はホストが正）
  if (me.hitstun > 0 || me.attackType || me.special || me.specialEndlag > 0 || me.smashCharge || me.proneTimer > 0 || me.shieldBroken || me.ledgeGrab || me.ledgeAction || me.grabbedBy || me.holdingTarget) return;
  const k = me.keys;
  const heldAction = action => [controls.p1[action], controls.p2[action]].some(key => key && input[key]);
  const pressedAction = action => [controls.p1[action], controls.p2[action]].some(key => key && input.pressed[key]);
  const l = heldAction("left"), r = heldAction("right");
  const jump = pressedAction("jump") || (settings.p1TapJump && pressedAction("up"));
  const speed = me.onGround ? me.fighter.speed : me.fighter.airSpeed;
  if (l && !r) { me.vx += (-speed - me.vx) * (me.onGround ? .36 : .2); me.facing = -1; }
  else if (r && !l) { me.vx += (speed - me.vx) * (me.onGround ? .36 : .2); me.facing = 1; }
  else if (me.onGround) me.vx *= .8; else me.vx *= .985;
  if (jump && me.jumpsLeft > 0) { me.vy = -me.fighter.jump; me.jumpsLeft--; me.onGround = false; me.standingPlatform = null; }
  me.vy += GRAVITY * me.fighter.gravity;
  me.x += me.vx; me.y += me.vy;
  if (mainPlatform) {
    const over = me.x + me.w > mainPlatform.x && me.x < mainPlatform.x + mainPlatform.w;
    if (over && me.y + me.h >= mainPlatform.y && me.vy >= 0) {
      me.y = mainPlatform.y - me.h; me.vy = 0; me.onGround = true; me.standingPlatform = mainPlatform;
      me.jumpsLeft = me.fighter.jumps; me.airDodgeUsed = false; me.upBUsed = false; me.sideBUsed = false;
    }
  }
  me.motionFrame = (me.motionFrame || 0) + 1;
}

// ゲスト側の入力（ゲスト側の設定キー／WASD／矢印をホストのP2キーへ変換）
function buildGuestP2Input() {
  const k2 = (players[1] && players[1].keys) || controls.p2;
  const map = [
    [k2.left, "ArrowLeft", "a"],
    [k2.right, "ArrowRight", "d"],
    [k2.up, "ArrowUp", "w"],
    [k2.down, "ArrowDown", "s"],
    [k2.jump, "Space", ";"],
    [k2.weak, "Enter", "f"],
    [k2.strong, "/", "g"],
    [k2.special, ",", "e"],
    [k2.shield, ".", "r"],
    [k2.grab, "Shift", "q"]
  ];
  const out = { pressed: Object.create(null) };
  for (const [targetKey, kA, kB] of map) {
    if (!targetKey) continue;
    if (netRemoteHeld[kA] || netRemoteHeld[kB]) out[targetKey] = true;
    if (netRemotePressed[kA] || netRemotePressed[kB]) out.pressed[targetKey] = true;
  }
  netRemotePressed = Object.create(null);
  return out;
}

function buildGuestWireInput() {
  // 押されているキーをビットマスクにまとめて送る（毎フレームのJSONを大幅に小さくする）
  let heldMask = 0, pressedMask = 0;
  for (const a of CONTROL_ACTIONS) {
    const bit = NET_KEY_BITS[a.key];
    if (!bit) continue;
    const p1k = controls.p1[a.key];
    const p2k = controls.p2[a.key];
    if ((p1k && input[p1k]) || (p2k && input[p2k])) heldMask |= bit;
    if ((p1k && input.pressed[p1k]) || (p2k && input.pressed[p2k])) pressedMask |= bit;
  }
  return { t: "in", hm: heldMask, pm: pressedMask, tj: settings.p1TapJump ? 1 : 0 };
}

// ---------- 入力・メニュー管理 ----------
const input = { pressed: Object.create(null) };
let rebindingTarget = null;
let settingsCursor = { col: 0, row: 0 };

function normalizeKey(k) {
  if (k === " " || k === "Space") return "Space";
  if (k.startsWith("Arrow") || k === "Enter" || k === "Shift" || k === "Control" || k === "Alt" || k === "Escape" || k === "Backspace" || k === "Tab") return k;
  return k.toLowerCase();
}

window.addEventListener("keydown", e => {
  if (pwModal.style.display === "flex" || isStoryLinkOpen()) return;
  getAudio(); // ユーザー操作のタイミングで効果音を有効化
  const k = normalizeKey(e.key);
  // 隠しキャラ解禁：キャラ選択画面でローマ字の名前を入力
  // リンゴの「r」「i」などが移動キー（WASD）と衝突しないよう、入力中はゲーム操作へ渡さない
  input.blockKeys = {};
  if (screen === "select" && anySecretCommandEligible() && /^[a-zー\-]$/i.test(e.key || "")) {
    const typedRevealed = recordRikaTypedChar(e.key);
    if (typedRevealed) return;
    // 名前を入力し始めた間だけ、メニュー移動キー（A/D/W/Sなど）と決定キーをブロックする
    if (isRikaTypingBuffered()) {
      input.blockKeys = { a: true, d: true, w: true, s: true, z: true, x: true, f: true };
      return;
    }
  }
  if (k === "Escape") {
    // Escape only leaves fullscreen and never navigates game menus.
    if (isFullscreenActive()) {
      fullscreenEscapeKeyPending = true;
      if (fullscreenEscapeResetTimer) clearTimeout(fullscreenEscapeResetTimer);
      fullscreenEscapeResetTimer = setTimeout(() => {
        fullscreenEscapeKeyPending = false;
        fullscreenEscapeResetTimer = null;
      }, 1200);
      e.preventDefault();
      if (e.stopImmediatePropagation) e.stopImmediatePropagation();
      exitFullscreen().catch(() => {});
    }
    return;
  }
  if (screen === "settings" && rebindingTarget) {
    e.preventDefault();
    if (e.stopImmediatePropagation) e.stopImmediatePropagation();
    if (k === "Backspace") {
      rebindingTarget = null;
      playSfx("shield", .5);
      return;
    }
    applyKeyRebind(rebindingTarget.side, rebindingTarget.action, k);
    rebindingTarget = null;
    return;
  }
  if (input.blockKeys && Object.prototype.hasOwnProperty.call(input.blockKeys, k)) return;
  if (!input[k]) input.pressed[k] = true;
  input[k] = true;
  if (k.startsWith("Arrow") || k === "Space" || k === "Enter" || k === "Tab" || k === "/") e.preventDefault();
});
window.addEventListener("keyup", e => {
  if (pwModal.style.display === "flex" || isStoryLinkOpen()) return;
  const k = normalizeKey(e.key);
  input[k] = false;
  if (k === "Escape" && fullscreenEscapeKeyPending) {
    fullscreenEscapeKeyPending = false;
    fullscreenEscapeGuardUntil = 0;
    if (fullscreenEscapeResetTimer) { clearTimeout(fullscreenEscapeResetTimer); fullscreenEscapeResetTimer = null; }
  }
});
window.addEventListener("blur", () => {
  for (const k of Object.keys(input)) { if (k !== "pressed") input[k] = false; }
  input.pressed = Object.create(null);
});

const ACHIEVEMENT_ID_SET = new Set(ACHIEVEMENTS.map(a => a.id));
const ACHIEVEMENT_STAT_SET = new Set(ACHIEVEMENTS.map(a => a.stat).filter(Boolean));

// 旧バージョンで削除・改名された実績ID（幽霊キー）を保存データから除去する
function sanitizeUnlockedMap(raw) {
  const clean = {};
  if (!raw || typeof raw !== "object") return clean;
  for (const id of Object.keys(raw)) {
    if (ACHIEVEMENT_ID_SET.has(id)) clean[id] = raw[id];
  }
  return clean;
}

function sanitizeProgressMap(raw) {
  const clean = {};
  if (!raw || typeof raw !== "object") return clean;
  for (const stat of Object.keys(raw)) {
    // "fighter:名前" のような動的ステータスも残す
    if (ACHIEVEMENT_STAT_SET.has(stat) || stat.startsWith("fighter:")) {
      const v = Number(raw[stat]);
      if (Number.isFinite(v) && v > 0) clean[stat] = v;
    }
  }
  return clean;
}

function loadAchievementProfile() {
  const base = { unlocked: {}, progress: {}, fightersUsed: [], fightersWon: [], stagesUsed: [], winStreak: 0 };
  try {
    const saved = JSON.parse(localStorage.getItem(ACHIEVEMENT_STORAGE_KEY) || "null");
    if (!saved || typeof saved !== "object") return base;
    const fightersWon = Array.isArray(saved.fightersWon)
      ? Array.from(new Set(saved.fightersWon.filter(name => STANDARD_FIGHTER_NAMES.has(name))))
      : [];
    const progress = sanitizeProgressMap(saved.progress);
    progress.fightersWon = fightersWon.length;
    const unlocked = sanitizeUnlockedMap(saved.unlocked);
    // 旧版では「全員を使う」だけで解禁されていたため、勝利記録がない旧解除はやり直しにする。
    if (!Array.isArray(saved.fightersWon)) {
      delete unlocked["hidden-boredom"];
    }
    return {
      unlocked,
      progress,
      fightersUsed: Array.isArray(saved.fightersUsed) ? saved.fightersUsed.filter(n => STANDARD_FIGHTER_NAMES.has(n)).slice(0, 64) : [],
      fightersWon,
      rikaFoundWithoutHint: !!saved.rikaFoundWithoutHint,
      noHintUnlocks: (saved.noHintUnlocks && typeof saved.noHintUnlocks === "object") ? Object.assign({}, saved.noHintUnlocks) : {},
      stagesUsed: Array.isArray(saved.stagesUsed) ? saved.stagesUsed.slice(0, 32) : [],
      winStreak: Math.max(0, Number(saved.winStreak) || 0)
    };
  } catch (e) { return base; }
}

// ---------- 隠しキャラ「りかちゃん」名前入力コマンド ----------
const SECRET_RIKA_ACHIEVEMENT_ID = "hidden-boredom";
// りかちゃん / rikachann / rikatyann / rikacyann / rikachyan / rika-chann など、
// ちゃ の綴り（cha・tya・cya・chya・ttya・tcha）と最後の ん（nn・n）の揺れをすべて許容する。
const RIKA_NAME_PATTERNS = [
  /rika(?:cha|tya|cya|chya|ttya|tcha)n{1,2}$/,
  /rika-?(?:cha|tya|cya|chya|ttya|tcha)n{1,2}$/
];
const RIKA_NAME_SPELLINGS = ["cha", "tya", "cya", "chya", "ttya", "tcha"]
  .flatMap(cha => ["rika" + cha + "n", "rika" + cha + "nn"]);
const RIKA_NAME_INPUT_LIMIT = 40;
const RIKA_NAME_TIMEOUT_MS = 9000;
const RIKA_TYPING_IDLE_MS = 2600;
let rikaRevealed = false;
let rikaTypedBuffer = "";
let rikaTypingLastAt = 0;
let rikaRevealPending = false;
let rikaCodeFlash = 0;
const RIKA_REVEAL_STORAGE_KEY = "mbsp-rika-revealed";
const DENZABURO_REVEAL_STORAGE_KEY = "mbsp-denzaburo-revealed";
const GEORGIA_REVEAL_STORAGE_KEY = "mbsp-georgia-revealed";
let denzaburoRevealed = false;
let georgiaRevealed = false;
try {
  denzaburoRevealed = localStorage.getItem(DENZABURO_REVEAL_STORAGE_KEY) === "1";
  georgiaRevealed = localStorage.getItem(GEORGIA_REVEAL_STORAGE_KEY) === "1";
} catch (e) {}
const HAPIENE_SPELLINGS = ["hapiene", "happiene", "hapienne"];
// 「ジョージア」：jo/jyo ＋ 長音（- / o / u / なし）＋ ji/zi ＋ a（z始まりは決定キーZと重なるので使わない）
const GEORGIA_SPELLINGS = ["jo", "jyo"].flatMap(jo => ["-", "o", "u", ""].flatMap(long => ["ji", "zi"].map(ji => jo + long + ji + "a")));

// 名前コマンドは誰でも入力可能。隠し実績はコマンドの「ヒント」を教えてくれるだけ。
function isRikaHintUnlocked() {
  // 隠し実績「そろそろ飽きてきたでしょ？」を実際に解除している場合のみ反応する
  return !!achievementProfile.unlocked[SECRET_RIKA_ACHIEVEMENT_ID];
}

function resetRikaTypedBuffer() {
  rikaTypedBuffer = "";
  rikaTypingLastAt = 0;
}

function getHelpExtraFighters() {
  const list = [];
  if (rikaRevealed) list.push(RIKA_FIGHTER);
  if (isFallenUnlocked()) list.push(PLAYABLE_FALLEN_FIGHTER);
  if (denzaburoRevealed) list.push(DENZABURO_FIGHTER);
  if (georgiaRevealed) list.push(GEORGIA_FIGHTER);
  return list;
}

function getHelpCharTotal() {
  return FIGHTERS.length + getHelpExtraFighters().length;
}

// 図鑑（キャラ説明）用の連続インデックス → ファイター解決
// 0..12 が通常キャラ、最後の枠（13）が解禁後のりかちゃん（実索引14）
function getFighterForHelpIndex(index) {
  if (index >= FIGHTERS.length) return getHelpExtraFighters()[index - FIGHTERS.length] || FIGHTERS[0];
  return FIGHTERS[index];
}

// 一度コマンドで出現させたら、以降はページを再読み込みしても隠しキャラが選択可能なまま
try {
  if (localStorage.getItem(RIKA_REVEAL_STORAGE_KEY) === "1") {
    rikaRevealed = true;
    if (!isRikaHintUnlocked() && !achievementProfile.rikaFoundWithoutHint) achievementProfile.rikaFoundWithoutHint = true;
  }
} catch (e) {}

function revealRika() {
  if (rikaRevealed) return;
  if (!isRikaHintUnlocked() && !achievementProfile.rikaFoundWithoutHint) {
    achievementProfile.rikaFoundWithoutHint = true;
    saveAchievementProfile();
  }
  rikaRevealed = true;
  rikaRevealPending = RIKA_INDEX;
  rikaCodeFlash = 90;
  resetRikaTypedBuffer();
  try { localStorage.setItem(RIKA_REVEAL_STORAGE_KEY, "1"); } catch (e) {}
  // 名前入力で無意識に決定・戻るが押されても、出現フレームでは処理しない
  rikaTypingLastAt = Date.now();
  if (typeof selectedFighters !== "undefined" && typeof selectTurn === "number") {
    // 1P側でコマンドを入力した場合は、そのままP1として選ばれた状態にする
    const revealOwner = selectTurn;
    if (revealOwner === 1 && !trainingMode && !netMode && selectedFighters[0] === RIKA_INDEX) {
      selectedFighters[0] = RANDOM_INDEX;
    }
    selectedFighters[revealOwner] = RIKA_INDEX;
  }
  uiNotice = "SECRET FIGHTER「りかちゃん」参戦！ (1柱)";
  uiNoticeTimer = 220;
  playSfx("chargeMax", 1);
  playSfx("parry", 1);
  spawnBurstEffect(VIEW_W / 2, VIEW_H / 2, "#ffffff");
}

// キー入力時に呼ばれる。ローマ字（半角小文字）だけを拾って名前コマンドを判定する。
// キャラ選択画面の隠しコマンド（りかちゃん／ハピエネ／ジョージア）
function getSecretCommands() {
  return [
    { spellings: RIKA_NAME_SPELLINGS, eligible: !rikaRevealed, reveal: () => revealRika() },
    { spellings: HAPIENE_SPELLINGS, eligible: !denzaburoRevealed && !!achievementProfile.unlocked["hidden-hapiene"], reveal: () => revealExtraSecret("denzaburo") },
    { spellings: GEORGIA_SPELLINGS, eligible: !georgiaRevealed && !!achievementProfile.unlocked["hidden-georgia"], reveal: () => revealExtraSecret("georgia") }
  ].filter(c => c.eligible);
}

function anySecretCommandEligible() {
  return getSecretCommands().length > 0;
}

function revealExtraSecret(which) {
  const isDen = which === "denzaburo";
  const index = isDen ? DENZABURO_INDEX : GEORGIA_INDEX;
  if (isDen) denzaburoRevealed = true; else georgiaRevealed = true;
  try { localStorage.setItem(isDen ? DENZABURO_REVEAL_STORAGE_KEY : GEORGIA_REVEAL_STORAGE_KEY, "1"); } catch (e) {}
  resetRikaTypedBuffer();
  rikaTypingLastAt = Date.now();
  rikaRevealPending = index;
  rikaCodeFlash = 90;
  if (typeof selectedFighters !== "undefined" && typeof selectTurn === "number") selectedFighters[selectTurn] = index;
  uiNotice = isDen ? "SECRET FIGHTER「電三郎先生」参戦！ ハピエネ〜！" : "SECRET FIGHTER「お去るのジョージア」参戦！";
  uiNoticeTimer = 220;
  playSfx("chargeMax", 1);
  playSfx("parry", 1);
  spawnBurstEffect(VIEW_W / 2, VIEW_H / 2, isDen ? "#7df9ff" : "#ffd27a");
}

function recordRikaTypedChar(rawKey) {
  if (screen !== "select") return false;
  if (typeof rawKey !== "string") return false;
  let key = rawKey.normalize ? rawKey.normalize("NFKC").toLowerCase() : rawKey.toLowerCase();
  key = key.replace(/[ー−‐]/g, "-");
  if (!/^[a-z-]$/.test(key)) return false;
  const commands = getSecretCommands();
  if (!commands.length) return false;
  const spellings = commands.flatMap(c => c.spellings);
  const now = Date.now();
  // 入力が途切れたらリセット。最初の一文字は各コマンドの頭文字だけ受け付ける（メニュー操作と衝突しない）
  if (now - rikaTypingLastAt > RIKA_TYPING_IDLE_MS) rikaTypedBuffer = "";
  if (rikaTypedBuffer === "" && !spellings.some(sp0 => sp0[0] === key)) return false;
  rikaTypingLastAt = now;
  rikaTypedBuffer = (rikaTypedBuffer + key).slice(-RIKA_NAME_INPUT_LIMIT);
  if (!spellings.some(sp0 => sp0.startsWith(rikaTypedBuffer))) {
    rikaTypedBuffer = spellings.some(sp0 => sp0[0] === key) ? key : "";
    return false;
  }
  const hit = commands.find(c => c.spellings.includes(rikaTypedBuffer));
  if (hit) { hit.reveal(); return true; }
  return false;
}

// 実績一覧でヒントを確認したあと、名前を半角ローマ字で叩くと解禁。
function isRikaTypingBuffered() {
  return rikaTypedBuffer.length > 0;
}

// 実在する実績だけを数える（幽霊キーで水増しされない）
// 「ヒントなしでのみ見える」実績：りかちゃんをヒントなしで見つけていた場合だけ実績欄に載る
function markNoHintUnlock(achievement) {
  if (!achievement.noHintOnly) return;
  if (!achievementProfile.noHintUnlocks) achievementProfile.noHintUnlocks = {};
  achievementProfile.noHintUnlocks[achievement.id] = !!(achievementProfile.rikaFoundWithoutHint || !achievementProfile.unlocked["hidden-boredom"]);
}

function isAchievementListed(a) {
  if (!a.noHintOnly) return true;
  return !!achievementProfile.unlocked[a.id] && !!(achievementProfile.noHintUnlocks || {})[a.id];
}

function getListedAchievements() {
  return ACHIEVEMENTS.filter(isAchievementListed);
}

function isStoryUnlocked() {
  return !!achievementProfile.unlocked["hidden-rika-victory"];
}

function countUnlockedAchievements() {
  let n = 0;
  for (const a of getListedAchievements()) if (achievementProfile.unlocked[a.id]) n++;
  return n;
}

function countUnlockedIn(list) {
  let n = 0;
  for (const a of list) if (achievementProfile.unlocked[a.id]) n++;
  return n;
}

// 既に条件を満たしているのに未解除の実績を洗い出して解除する。
// 実績が後から追加された場合、そのステータスが次回増えるまで永久に解除されない不具合を防ぐ。
// 全statを対象にする（viewedHiddenTab は進捗0のままでは解除されないので安全）。
function resyncAchievementUnlocks() {
  let changed = false;
  withAchievementSaveBatch(() => {
    // 幽霊キー（実在しない実績ID）の除去：カウント水増し防止
    for (const id of Object.keys(achievementProfile.unlocked)) {
      if (!ACHIEVEMENTS.some(a => a.id === id)) {
        delete achievementProfile.unlocked[id];
        changed = true;
      }
    }
    for (const a of ACHIEVEMENTS) {
      if (achievementProfile.unlocked[a.id]) continue;
      const stat = a.stat;
      if (!stat) continue;
      const value = Number(achievementProfile.progress[stat]) || 0;
      if (value >= a.goal) {
        if (unlockAchievementSilent(a)) changed = true;
      }
    }
  });
  return changed;
}

// トーストを出さずに解除する（起動時の一括同期用）
function unlockAchievementSilent(achievement) {
  if (achievementProfile.unlocked[achievement.id]) return false;
  markNoHintUnlock(achievement);
  achievementProfile.unlocked[achievement.id] = Date.now();
  saveAchievementProfile();
  return true;
}
let achievementSaveBatchDepth = 0;
let achievementSavePending = false;

function saveAchievementProfile() {
  if (achievementSaveBatchDepth > 0) { achievementSavePending = true; return; }
  try { localStorage.setItem(ACHIEVEMENT_STORAGE_KEY, JSON.stringify(achievementProfile)); } catch (e) {}
}

function withAchievementSaveBatch(callback) {
  achievementSaveBatchDepth++;
  try { callback(); }
  finally {
    achievementSaveBatchDepth--;
    if (achievementSaveBatchDepth === 0 && achievementSavePending) {
      achievementSavePending = false;
      saveAchievementProfile();
    }
  }
}

function achTabFiltered() {

  if (cat === null) return getListedAchievements().filter(a => !a.hidden);
  return getListedAchievements().filter(a => a.category === cat);

function unlockHiddenServiceIfViewed() {

    unlockAchievement("hidden-service");

    hiddenServiceUnlockedOnView = true;
  }
}

function achTabWidth(label) {
  return Math.max(74, label.length * 12 + 26);
}

function achTabX(i) {
  let x = 28 - achievementTabScroll;
  for (let j = 0; j < i; j++) x += achTabWidth(ACHIEVEMENT_TABS[j].label) + 6;
  return x;
}

function achTabAt(x, y) {
  for (let i = 0; i < ACHIEVEMENT_TABS.length; i++) {
    const tx = achTabX(i), tw = achTabWidth(ACHIEVEMENT_TABS[i].label);
    if (x >= tx && x <= tx + tw && y >= 50 && y <= 82) return i;
  }
  return -1;
}

function updateAchTabScroll() {
  const tw = achTabWidth(ACHIEVEMENT_TABS[achievementTab].label);
  const tx = achTabX(achievementTab);
  const maxScroll = Math.max(0, tx + tw - (VIEW_W - 28));
  achievementTabScroll = Math.max(0, Math.min(achievementTabScroll, maxScroll));
}

function pointInRect(point, rect) {

function placeTutorialOnLedge(p) {

function enterTutorialStep(index) {

  const id = TUTORIAL_STEPS[index].id;
  if (id === "ko" && sb) {

// 攻撃が当たったとき（applyHit から呼ばれる）
function onTutorialHit(attacker, target, stats) {
  if (!tutorialActive || attacker !== players[0] || target !== players[1]) return;
  tutorialData.hits++;
  if (stats && stats.smash) tutorialData.smashHit = true;
}

// 撃墜されたとき（場外判定から呼ばれる）
function onTutorialKO(player) {
  if (tutorialActive && player === players[1]) tutorialData.ko = true;
}

// 戻り値 true のフレームはゲームを止める（説明中・確認ダイアログ中）
function updateTutorial() {
  const step = TUTORIAL_STEPS[tutorialStep];
  tutorialStepFrame++;

  if (tutorialSkipConfirm) {
    const r = getTutorialConfirmRects();
    if (input.pressed["z"] || input.pressed["Enter"] || pointInRect(mouseClick, r.yes)) finishTutorial();
    else if (input.pressed["x"] || input.pressed["Backspace"] || pointInRect(mouseClick, r.no)) tutorialSkipConfirm = false;
    return true;
  }
  if (input.pressed["Backspace"] || pointInRect(mouseClick, TUTORIAL_SKIP_RECT)) {
    tutorialSkipConfirm = true;
    return true;
  }

  if (step.pause) {
    const advance = input.pressed["z"] || input.pressed["Enter"] || input.pressed["Space"] || !!mouseClick;
    if (tutorialStepFrame > 14 && advance) {
      if (step.id === "finish") finishTutorial();
      else enterTutorialStep(tutorialStep + 1);
    }
    return true;
  }

  if (tutorialData.done) {
    if (tutorialStepFrame - tutorialData.doneAt > 55) enterTutorialStep(tutorialStep + 1);
    return false;
  }

  const p = players[0];
  if (!p) return false;
  switch (step.id) {
    case "move":
      if (Math.abs(p.x - tutorialData.startX) > 70) completeTutorialStep();
      break;
    case "jump":
      if (!p.onGround && p.jumpsLeft < p.fighter.jumps) completeTutorialStep();
      break;
    case "attack":
      if (tutorialData.hits >= (step.goal || 3)) completeTutorialStep();
      break;
    case "smash":
      if (tutorialData.smashHit) completeTutorialStep();
      break;
    case "special":
      if (p.special || p.specialEndlag > 0) completeTutorialStep();
      break;
    case "shield":
      if (p.shieldActive) completeTutorialStep();
      break;
    case "ko":
      if (tutorialData.ko) completeTutorialStep();
      break;
    case "ledge":
      if (p.ledgeAction && p.ledgeAction.type === "roll") completeTutorialStep();
      else if (!p.ledgeGrab && !p.ledgeAction) {
        // 回避上がり以外で崖を離れたら、少し待ってからもう一度崖につかまらせる
        tutorialData.retry++;
        if (tutorialData.retry > 50) {
          tutorialData.retry = 0;
          tutorialData.hint = true;
          placeTutorialOnLedge(p);
        }
      }
      break;
    default:
      break;
  }
  return false;
}

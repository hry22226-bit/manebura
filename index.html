  ctx.fillText(
    netMode
      ? "希望が違う場合はP1/P2のどちらかを抽選で採用。採用された側とステージ名を開始画面に表示します。"
      : "戦うステージを選択してください（浮いている床は下入力ですり抜け可能）",
    VIEW_W / 2, 76
  );

  for (let i = 0; i <= RANDOM_STAGE_INDEX; i++) {
    const c = stageCardPosition(i);
    const isSel = selectedStage === i;

    ctx.save();
    ctx.fillStyle = isSel ? "rgba(32,42,82,.92)" : "rgba(12,14,31,.78)";
    drawRoundRect(c.x, c.y, c.w, c.h, 11); ctx.fill();
    ctx.strokeStyle = isSel ? "#ffe38a" : "#555a7a";
    ctx.lineWidth = isSel ? 3 : 1.5;
    drawRoundRect(c.x, c.y, c.w, c.h, 11); ctx.stroke();

    if (i === RANDOM_STAGE_INDEX) {
      ctx.fillStyle = "#ffe38a"; ctx.font = "bold 22px sans-serif";
      ctx.fillText("？ ランダムステージ", c.x + c.w / 2, c.y + 56);
      ctx.fillStyle = "#cfd6e6"; ctx.font = "12px sans-serif";
      ctx.fillText("全ステージからランダム選出", c.x + c.w / 2, c.y + 84);
      ctx.restore();
      continue;
    }

    const st = STAGES[i];
    const px = c.x + 12, py = c.y + 14, pw = 92, ph = 66;
    const g = ctx.createLinearGradient(px, py, px, py + ph);
    g.addColorStop(0, st.skyTop); g.addColorStop(1, st.skyBot);
    ctx.fillStyle = g;
    drawRoundRect(px, py, pw, ph, 6); ctx.fill();

    for (const pl of st.platforms) {
      ctx.fillStyle = pl.main ? st.mainColor1 : st.platColor;
      const rx = px + (pl.x / 900) * pw;
      const ry = py + (pl.y / 500) * ph;
      const rw = Math.max(4, (pl.w / 900) * pw);
      const rh = pl.main ? 6 : 3;
      ctx.fillRect(rx, ry, rw, rh);
    }

    ctx.textAlign = "left";
    ctx.fillStyle = "#fff"; ctx.font = "bold 14.5px sans-serif";
    ctx.fillText(st.name, c.x + 114, c.y + 34, c.w - 122);
    ctx.fillStyle = "#cfd6e6"; ctx.font = "11px sans-serif";
    ctx.fillText(st.desc.slice(0, 13), c.x + 114, c.y + 58);
    ctx.fillText(st.desc.slice(13), c.x + 114, c.y + 74);
    ctx.restore();
  }

  ctx.fillStyle = "#fff"; ctx.font = "13px sans-serif";
  ctx.fillText(
    netMode
      ? "WASD / 矢印キーで選択、Z（または Enter・クリック）で次へ → パスワード入力！"
      : "WASD / 矢印キーで選択、Z（または Enter・クリック）でバトル開始！",
    VIEW_W / 2, 438
  );
  ctx.fillStyle = "#cdd1e2"; ctx.font = "12px sans-serif";
  ctx.fillText("Xでキャラクター選択へ戻る", VIEW_W / 2, 460);
  ctx.restore();
}

function drawCountdown() {
  if (countdownFrame >= COUNTDOWN_END_FRAME) return;
  let text = "", color = "#fff", prog = 0;
  if (countdownFrame < 60) { text = "3"; color = "#ff5b5b"; prog = countdownFrame; }
  else if (countdownFrame < 120) { text = "2"; color = "#ffb02e"; prog = countdownFrame - 60; }
  else if (countdownFrame < COUNTDOWN_GO_FRAME) { text = "1"; color = "#ffe93a"; prog = countdownFrame - 120; }
  else { text = "GO!"; color = "#51ff7a"; prog = countdownFrame - COUNTDOWN_GO_FRAME; }

  const scale = text === "GO!"
    ? 1.15 + Math.sin((prog / 60) * Math.PI) * 0.2
    : 1 + Math.sin((prog / 60) * Math.PI) * 0.35;

  ctx.save();
  const hasStageNotice = netMode && netStageNotice;
  const objectiveY = hasStageNotice ? 307 : 284;
  ctx.fillStyle = "rgba(0,0,0,.52)";
  ctx.fillRect(0, 145, VIEW_W, objectiveY + 16 - 145);
  ctx.textAlign = "center";
  ctx.font = `bold ${Math.round(88 * scale)}px sans-serif`;
  ctx.lineWidth = 10;
  ctx.strokeStyle = "rgba(0,0,0,.75)";
  ctx.strokeText(text, VIEW_W / 2, 232);
  ctx.fillStyle = color;
  ctx.fillText(text, VIEW_W / 2, 232);
  ctx.font = "bold 15px sans-serif";
  ctx.fillStyle = "#fff";
  ctx.fillText(countdownFrame < COUNTDOWN_GO_FRAME ? "GO! で動けるようになります" : "バトル開始！", VIEW_W / 2, 260);
  if (hasStageNotice) {
    ctx.font = "bold 13px sans-serif";
    ctx.fillStyle = "#6ee7b7";
    ctx.fillText(netStageNotice, VIEW_W / 2, 282, VIEW_W - 28);
  }
  ctx.font = "bold 12.5px sans-serif";
  ctx.fillStyle = "#fff3c4";
  ctx.fillText(
    storyBattle
      ? storyBattle.objective
      : trainingMode
      ? "目標：サンドバッグに攻撃を当て、ダメージ表示と技の距離を試そう"
      : "勝利条件：相手のストックをすべて奪おう。攻撃で%を上げて、場外へふっとばす！",
    VIEW_W / 2, objectiveY, VIEW_W - 36
  );
  ctx.restore();
}

function getResultsActionRects() {
  const y = VIEW_H / 2 + 80;
  return {
    rematch: { x: VIEW_W / 2 - 275, y, w: 255, h: 42 },
    next: { x: VIEW_W / 2 + 20, y, w: 255, h: 42 }
  };
}

function resultNextStepHint(local, won) {
  if (trainingMode) return "次はサンドバッグに技を当て、ダメージ%と届く距離を試そう。";
  if (!local) return "相手を場外へふっとばし、ストックをすべて奪おう。";
  return won
    ? `次は ${formatKeyLabel(local.keys.strong)} を長押しして、溜めスマッシュを試そう。`
    : `次は ${formatKeyLabel(local.keys.jump)} でジャンプして、${formatKeyLabel(local.keys.weak)} の弱攻撃を当ててみよう。`;
}

function drawResultsButton(rect, label, disabled = false) {
  ctx.save();
  ctx.fillStyle = disabled ? "rgba(45, 49, 67, .82)" : "rgba(45, 65, 105, .96)";
  drawRoundRect(rect.x, rect.y, rect.w, rect.h, 8); ctx.fill();
  ctx.strokeStyle = disabled ? "rgba(170,180,205,.3)" : "#9ecbff";
  ctx.lineWidth = 1.5;
  drawRoundRect(rect.x, rect.y, rect.w, rect.h, 8); ctx.stroke();
  ctx.fillStyle = disabled ? "#9ea5b8" : "#ffffff";
  ctx.font = "bold 13px sans-serif";
  ctx.textAlign = "center";
  ctx.fillText(label, rect.x + rect.w / 2, rect.y + rect.h / 2 + 4.5);
  ctx.restore();
}

function drawResultsOverlay() {
  ctx.save();
  ctx.fillStyle = "rgba(5,7,18,.76)";
  ctx.fillRect(0, 0, VIEW_W, VIEW_H);
  ctx.textAlign = "center";
  ctx.fillStyle = "#ffe17a"; ctx.font = "bold 46px sans-serif";
  ctx.fillText("GAME SET", VIEW_W / 2, VIEW_H / 2 - 48);

  let win = "DRAW";
  const p2Title = netMode ? "P2" : (players[1]?.isCPU ? "CPU" : "P2");
  if (players[0].alive && !players[1].alive) win = (netMode ? onlineNames[0] || "P1" : "P1") + " (" + players[0].fighter.name + ") WIN!";
  if (players[1].alive && !players[0].alive) win = (netMode ? onlineNames[1] || "P2" : p2Title) + " (" + players[1].fighter.name + ") WIN!";

  ctx.fillStyle = "#fff"; ctx.font = "bold 30px sans-serif";
  ctx.fillText(win, VIEW_W / 2, VIEW_H / 2 + 2);
  if (netMode && netStageNotice) {
    ctx.fillStyle = "#6ee7b7"; ctx.font = "13px sans-serif";
    ctx.fillText(netStageNotice, VIEW_W / 2, VIEW_H / 2 + 27, VIEW_W - 56);
  }
  const local = getLocalAchievementPlayer();
  const opponent = local ? players[1 - local.side] : null;
  const won = !!(local && local.alive && opponent && !opponent.alive);
  ctx.fillStyle = "#e7ecfb"; ctx.font = "bold 13px sans-serif";
  ctx.fillText(resultNextStepHint(local, won), VIEW_W / 2, VIEW_H / 2 + 51, VIEW_W - 70);

  const buttons = getResultsActionRects();
  const rematchLabel = netMode
    ? (netRole === "host" ? "R　友達とすぐ再戦" : "ホストの再戦を待っています")
    : "R　すぐ再戦";
  drawResultsButton(buttons.rematch, rematchLabel, netMode && netRole === "guest");
  drawResultsButton(buttons.next, netMode ? "タイトルへ戻る" : "キャラ選択へ", false);
  ctx.fillStyle = "#cdd5e9"; ctx.font = "11px sans-serif";
  ctx.fillText(netMode ? "ホスト：Rで再戦 ／ Z・Xでタイトルへ" : "R：同じ設定ですぐ再戦 ／ Z：キャラ選択 ／ X：タイトル", VIEW_W / 2, buttons.next.y + 61);
  ctx.restore();
}

function handleTrainingShortcuts() {
  if (!trainingMode || players.length < 2) return false;
  const xFree = !isKeyBoundForPlayer("p1", "x");
  const backClicked = mouseClick && mouseClick.x >= VIEW_W / 2 + 150 && mouseClick.x <= VIEW_W / 2 + 252 && mouseClick.y >= VIEW_H - 36 && mouseClick.y <= VIEW_H - 8;
  if ((xFree && input.pressed["x"]) || input.pressed["Backspace"] || backClicked) {
    startCharacterSelect();
    return true;
  }
  if (input.pressed["1"]) {
    const sbMode = players[1].sandbagBehavior;
    players[0].respawn();
    players[1].respawn();
    players[1].sandbagBehavior = sbMode;
  }
  if (input.pressed["2"]) {
    players[1].damage = Math.min(999, players[1].damage + 25);
  }
  if (input.pressed["3"]) {
    players[1].sandbagBehavior = (players[1].sandbagBehavior + 1) % 4;
    players[1].shieldActive = false;
  }
  return false;
}

function gameLoop() {
  const mBoundInFight = screen === "fight" && (isKeyBoundForPlayer("p1", "m") || isKeyBoundForPlayer("p2", "m"));
  if (input.pressed["m"] && screen !== "password" && screen !== "storyMini" && !rebindingTarget && !mBoundInFight) toggleSfx();
  if (screen === "fight") {
    if (netMode) {
      if (netRole === "host") {
        if (countdownFrame < COUNTDOWN_END_FRAME) countdownFrame++;
        if (countdownFrame >= COUNTDOWN_GO_FRAME) {
          updateStagePlatforms();
          players[0].update(input, players[1]);
          const p2In = buildGuestP2Input();
          players[1].update(p2In, players[0]);
          updateProjectiles(players);
          if (!players[0].alive || !players[1].alive) {
            finishMatchAchievements();
            screen = "results";
          }
        }
        onlineSendState(true);
      } else if (netRole === "guest") {
        updateGuestOnlineFrame();
        if (netConn && netConn.open) {
          const channel = netConn.dataChannel || netConn._dc || null;
          if (!channel || typeof channel.bufferedAmount !== "number" || channel.bufferedAmount < NET_BUFFER_LIMIT) {
            try { netConn.send(buildGuestWireInput()); }
            catch (e) { console.warn("Online input send failed:", e); }
          }
        }
      }
    } else if (storyBattle) {
      if (countdownFrame < COUNTDOWN_END_FRAME) countdownFrame++;
      if (input.pressed["Backspace"]) endStoryBattle(false, "リタイア");
      else if (countdownFrame >= COUNTDOWN_GO_FRAME && players.length === 2) {
        updateStagePlatforms();
        if (storyBattle.rule === "hundred") {
          // 先に wave スポーン・players[1] の整合を確定させてからキャラ更新を行う
          // （逆順だと storyCrowd が空のとき players[1] が無効なまま p.update() へ到達し固まる）
          updateStoryBattle();
          updateStoryCrowdFrame();
        } else {
          players[0].update(input, players[1]);
          players[1].update(createCPUInput(players[1], players[0]), players[0]);
          updateProjectiles(players);
        }
      }
    } else if (tutorialActive) {
      const tutorialPaused = updateTutorial();
      if (screen === "fight" && tutorialActive && !tutorialPaused && players.length === 2) {
        updateStagePlatforms();
        players[0].update(input, players[1]);
        players[1].update(createCPUInput(players[1], players[0]), players[0]);
        updateProjectiles(players);
      }
    } else {
      if (countdownFrame < COUNTDOWN_END_FRAME) countdownFrame++;
      if (countdownFrame >= COUNTDOWN_GO_FRAME && !handleTrainingShortcuts()) {
        updateStagePlatforms();
        players[0].update(input, players[1]);
        const p2Input = (players[1].isCPU || players[1].isSandbag) ? createCPUInput(players[1], players[0]) : input;
        players[1].update(p2Input, players[0]);
        updateProjectiles(players);
        if (!trainingMode && (!players[0].alive || !players[1].alive)) {
          finishMatchAchievements();
          screen = "results";
        }
      }
    }
  } else {
    updateMenus();
  }

  if (screen === "title") drawTitleScreen();
  else if (screen === "settings") drawSettingsScreen();
  else if (screen === "select") drawCharacterSelect();
  else if (screen === "stage" || screen === "password") drawStageSelect();
  else if (screen === "helpMenu") drawHelpMenu();
  else if (screen === "helpControls") drawHelpControls();
  else if (screen === "helpChars") drawHelpChars();
  else if (screen === "achievements") drawAchievementsScreen();
  else if (screen === "credits") drawCreditsScreen();
  else if (screen === "storyMenu") drawStoryMenu();
  else if (screen === "storyScene") drawStoryScene();
  else if (screen === "storyLink") drawStoryLinkBackdrop();
  else if (screen === "storyMini") drawMiniGame();
  else if (screen === "storyResult") { drawBattle(false); drawStoryResult(); }
  else if (screen === "fight") {
    drawBattle(countdownFrame >= COUNTDOWN_GO_FRAME);
    drawCountdown();
    drawTutorialOverlay();
  } else if (screen === "results") {
    drawBattle(false);
    drawResultsOverlay();
  }

  if (uiNoticeTimer > 0) {
    ctx.save();
    ctx.setTransform(canvasPixelScale, 0, 0, canvasPixelScale, 0, 0);
    ctx.globalAlpha = Math.min(1, uiNoticeTimer / 20);
    ctx.font = "bold 11px sans-serif";
    const nw = Math.max(190, Math.ceil(ctx.measureText(uiNotice).width) + 24);
    ctx.fillStyle = "rgba(10, 14, 30, .88)";
    drawRoundRect(12, VIEW_H - 34, nw, 24, 6); ctx.fill();
    ctx.strokeStyle = "rgba(255, 227, 138, .4)"; ctx.lineWidth = 1;
    drawRoundRect(12, VIEW_H - 34, nw, 24, 6); ctx.stroke();
    ctx.fillStyle = "#ffe38a"; ctx.textAlign = "left";
    ctx.fillText(uiNotice, 22, VIEW_H - 18);
    ctx.restore();
    uiNoticeTimer--;
  }

  netFrameCounter++;
  syncStoryPage();
  if (achievementToastTimer > 0) achievementToastTimer--;
  input.pressed = Object.create(null);
  mouseClick = null;
  requestAnimationFrame(gameLoop);
}

// 開発・デバッグ用（ポータル連携からキャラクター情報を参照するためのフック）
try {
  window.__MB_DEBUG__ = {
    getFighterByIndex,
    RIKA_FIGHTER,
    RIKA_INDEX,
    RIKA_NAME_PATTERNS,
    getPlayers: () => players,
    getScreen: () => screen,
    getSelectedFighters: () => selectedFighters,
    openHelpChars: () => { screen = "helpChars"; helpCharIndex = 0; },
    tutorialData: () => ({ step: tutorialStep, ...tutorialData }),
    tutorialGoto: index => enterTutorialStep(index),
    getProjectiles: () => projectiles,
    getStoryCrowd: () => storyCrowd,
    getStoryCheckpoints: () => Object.assign({}, storyCheckpoints),
    KARUBI_INDEX: FIGHTERS.length - 1,
    netDebug: {
      setRole: (mode, role) => { netMode = !!mode; netRole = role; },
      applyState: msg => applyOnlineState(msg),
      guestFrame: () => updateGuestOnlineFrame(),
      serialize: () => serializeOnlineState(),
      wireInput: () => buildGuestWireInput(),
      getRemoteHeld: () => Object.assign({}, netRemoteHeld),
      getNetFrame: () => netFrameCounter
    },
    DENZABURO_INDEX, GEORGIA_INDEX,
    getSelectSlots: () => getSelectSlots(),
    getSelectCardLayout: () => getSelectCardLayout(),
    getSettings: () => settings,
    saveSettings,
    setSettingsCursor: c => { settingsCursor.col = c.col; settingsCursor.row = c.row; },
    getMini: () => miniGame,
    typingKey: k => typingKey(miniGame, k),
    getStory: () => ({ battle: storyBattle, chapter: storyChapterIndex, result: storyResultState, scene: storyScene, cleared: Array.from(storyCleared), chapters: STORY_CHAPTERS.map(c => c.id) }),
    storyStart: i => startStoryChapter(i),
    isStoryUnlocked,
    isFallenUnlocked,
    BLACK_RIKA_INDEX,
    getListedAchievementIds: () => getListedAchievements().map(a => a.id),
    recordRikaTypedChar,
    isRikaHintUnlocked,
    drawAvatar,
    paintAvatarShaded
  };
} catch (e) {}

applyStoryReturnParam();
gameLoop();

}

startMoneyBrothers();

    </script>

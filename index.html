    <style>
* {
  box-sizing: border-box;
  font-family: sans-serif;
  user-select: none;
}

body {
  margin: 0;
  min-height: 100vh;
  padding: 10px 0 20px;
  background: #10101a;
  color: #fff;
  display: flex;
  flex-direction: column;
  align-items: center;
  text-align: center;
}

#root {
  width: 100%;
  display: flex;
  flex-direction: column;
  align-items: center;
  text-align: center;
}

h1 {

}

.game-wrap {
  position: relative;
  width: min(900px, 96vw);
}

canvas {

  width: 100%;
  height: auto;
  border: 3px solid #33334f;
  border-radius: 8px;
  background: #303c72;
  cursor: pointer;
}

#fullscreen-btn {
  position: absolute;
  top: 10px;
  right: 10px;
  z-index: 30;

  height: 42px;
  border-radius: 10px;
  display: flex;
  align-items: center;

  color: #ffe38a;
  border: 1px solid rgba(255, 227, 138, 0.45);
  font-size: 19px;

  box-shadow: 0 3px 12px rgba(0, 0, 0, 0.35);
  transition: background 0.16s, transform 0.12s, color 0.16s;
}

#fullscreen-btn:hover {
  background: rgba(38, 50, 92, 0.92);
  color: #fff;
  transform: scale(1.07);
}

#fullscreen-btn:active {
  transform: scale(0.96);
}

.game-wrap:fullscreen {
  display: flex;
  align-items: center;
  justify-content: center;
  background: #05070f;
  width: 100%;
  height: 100%;
  overflow: hidden;
}

.game-wrap:fullscreen canvas {

  max-width: 100vw;
  max-height: 100vh;

  background: #303c72;
}

.game-wrap:-webkit-full-screen {

  justify-content: center;
  background: #05070f;

  height: 100%;
}

}

.game-wrap:fullscreen #fullscreen-btn,

}

.game-wrap:fullscreen #fullscreen-btn:hover,
.game-wrap:-webkit-full-screen #fullscreen-btn:hover {
  opacity: 1;
}

#pw-modal {
  display: none;

  inset: 0;
  z-index: 20;

.pw-rules {

}

.pw-label {

  font-size: 12px;
  font-weight: 700;
  text-align: left;
}

.pw-row {
  display: flex;

}

#pw-input,
#pw-name-input {

}

#pw-submit-btn:hover {

}

#pw-submit-btn:active {

}

#pw-status {

}

#pw-status[data-state="waiting"],
#pw-status[data-state="retrying"] {

}

#pw-status[data-state="connected"] {
  color: #6ee7b7;
}

#pw-status[data-state="error"] {

}

#pw-new-room-btn,
#pw-copy-btn {

#pw-new-room-btn[hidden],
#pw-copy-btn[hidden] {

}

#pw-new-room-btn:hover,

}

#pw-new-room-btn {

}

#pw-cancel-btn {

  color: #ddd;
  font-size: 12px;

}

@media (max-width: 520px) {

#story-link-modal {

/* ===== ストーリー：マネブラのページそのものが舞台になる ===== */
body {

}

#story-page-banner {

    <h1 id="page-title">大出費MoneyBrothersSP</h1>
    <div id="story-page-banner" hidden>
      <span id="story-page-chapter"></span>

        <span id="story-page-hp-text"></span>

          <div id="story-page-hp-fill"></div>
        </div>
      </div>
    </div>
    <div class="game-wrap">
      <canvas id="game" width="900" height="500"></canvas>

      <div id="pw-modal">
        <h2>友達とオンライン対戦</h2>
        <p id="pw-desc" aria-live="polite">

          <br />
          <span class="pw-rules">合言葉は1〜24文字。大文字・小文字は区別しません（前後の空白は無視）。HTTPSまたはlocalhostが必要です。</span>

          <input type="text" id="pw-name-input" maxlength="10" placeholder="例: りかファン" autocomplete="nickname" />
        </div>

        <div class="pw-row">
          <input type="text" id="pw-input" maxlength="24" placeholder="例: friends2026" autocomplete="off" aria-describedby="pw-desc pw-status" />

    <div id="story-feathers" aria-hidden="true"></div>
    <script>
// 大出費MoneyBrothersSP - 完全移植ゲームエンジン
// このファイル内のキャラクターデータ、技フレーム、ステージデータなどを直接編集して修正・拡張できます。

let isGameRunning = false;

function startMoneyBrothers() {
  if (isGameRunning) return;
  isGameRunning = true;


"use strict";

const canvas = document.getElementById("game");
if (!canvas) {
  isGameRunning = false;
  return;
}
let ctx = canvas.getContext("2d");

const VIEW_W = 900;
const VIEW_H = 500;
let canvasPixelScale = 1;
let avatarRenderScale = 1;
let fullscreenEscapeGuardUntil = 0;
let fullscreenEscapeKeyPending = false;
let fullscreenEscapeResetTimer = null;
let wasFullscreen = false;
const GRAVITY = 0.55;
const BLAST_X = 260;
const BLAST_Y = 180;
const TOP_BLAST_Y = -BLAST_Y * 1.6;

// ---------- ステージデータ ----------
const STAGES = [
  {
    name: "戦場 (バトルフィールド)",
    desc: "3つのすり抜け床があるスタンダードなステージ",
    skyTop: "#7ca6ff", skyMid: "#5269b6", skyBot: "#171b35",
    mainColor1: "#84ce5d", mainColor2: "#527b35", pillarColor: "#49311d", platColor: "#f0ab4c",
    platforms: [
      { x: 100, y: 400, w: 700, h: 20, main: true },
      { x: 200, y: 300, w: 150, h: 12 },
      { x: 550, y: 300, w: 150, h: 12 },
      { x: 375, y: 205, w: 150, h: 12 }
    ]
  },
  {
    name: "終点 (ファイナルステージ)",
    desc: "浮いている床がないガチンコ平面ステージ",
    skyTop: "#2b1d52", skyMid: "#4b2d7f", skyBot: "#0c071b",
    mainColor1: "#c7a4ff", mainColor2: "#6b47b8", pillarColor: "#26174a", platColor: "#ffd27a",
    platforms: [
      { x: 110, y: 400, w: 680, h: 22, main: true }
    ]
  },
  {
    name: "すま村ステージ",
    desc: "左右に動くすり抜け床が1つあるステージ",
    skyTop: "#f9b872", skyMid: "#d97762", skyBot: "#2c1d38",
    mainColor1: "#92d36e", mainColor2: "#558c3b", pillarColor: "#543b28", platColor: "#ffe08a",
    platforms: [
      { x: 140, y: 400, w: 620, h: 20, main: true },
      { x: 360, y: 275, w: 180, h: 12, moveRange: 170, moveSpeed: 0.022 }
    ]
  },
  {
    name: "スカイタワー",
    desc: "左右の低い床と中央の高い床がある立体ステージ",
    skyTop: "#67d8e8", skyMid: "#3c8dbc", skyBot: "#13293d",
    mainColor1: "#8de0c6", mainColor2: "#449982", pillarColor: "#2b4a4f", platColor: "#ffd166",
    platforms: [
      { x: 80,  y: 410, w: 740, h: 20, main: true },
      { x: 140, y: 325, w: 180, h: 12 },
      { x: 580, y: 325, w: 180, h: 12 },
      { x: 340, y: 185, w: 220, h: 12 }
    ]
  },
  {
    name: "トレーニングルーム (練習場)",
    desc: "距離メモリとグリッド線が付いた広めの練習用ステージ",
    trainingGrid: true,
    skyTop: "#1d2b44", skyMid: "#162035", skyBot: "#0d1322",
    mainColor1: "#d8e2ef", mainColor2: "#8fa3bf", pillarColor: "#28364a", platColor: "#70c1ff",
    platforms: [
      { x: 50,  y: 405, w: 800, h: 22, main: true },
      { x: 200, y: 295, w: 150, h: 12 },
      { x: 550, y: 295, w: 150, h: 12 }
    ]
  }
];
const RANDOM_STAGE_INDEX = STAGES.length;

let currentStage = STAGES[0];
let platforms = [];
let mainPlatform = null;
let stageTimer = 0;

function loadStage(stageIndex) {
  const idx = stageIndex === RANDOM_STAGE_INDEX ? Math.floor(Math.random() * STAGES.length) : stageIndex;
  currentStage = STAGES[idx];
  stageTimer = 0;
  platforms = currentStage.platforms.map(p => Object.assign({}, p, { baseX: p.x, dx: 0 }));
  mainPlatform = platforms[0];
  return idx;
}
loadStage(0);

function updateStagePlatforms() {
  stageTimer++;
  for (const p of platforms) {
    if (p.moveRange) {
      const prevX = p.x;
      p.x = p.baseX + Math.sin(stageTimer * p.moveSpeed) * p.moveRange;
      p.dx = p.x - prevX;
    } else p.dx = 0;
  }
}

// ---------- 攻撃フレーム＆性能（ベース） ----------

];

};

const settings = {
  p1TapJump: true,
  p2TapJump: true,
  screenEffects: true,
  showHitboxes: false,
  p1PresetIndex: 0
};

function formatKeyLabel(k) {
  if (!k) return "なし";
  const map = {
    ArrowLeft: "←", ArrowRight: "→", ArrowUp: "↑", ArrowDown: "↓",
    Space: "Space", Enter: "Enter", Shift: "Shift", Control: "Ctrl", Alt: "Alt", Tab: "Tab", Backspace: "BS"
  };
  if (map[k]) return map[k];
  return k.length === 1 ? k.toUpperCase() : k;
}

function saveSettings() {
  try {
    localStorage.setItem(SETTINGS_STORAGE_KEY, JSON.stringify({
      p1: controls.p1,
      p2: controls.p2,
      p1TapJump: settings.p1TapJump,
      p2TapJump: settings.p2TapJump,
      screenEffects: settings.screenEffects,
      showHitboxes: settings.showHitboxes,
      p1PresetIndex: settings.p1PresetIndex
    }));
  } catch (e) {}
}

function loadSettings() {
  try {
    const raw = JSON.parse(localStorage.getItem(SETTINGS_STORAGE_KEY) || "null");
    if (!raw || typeof raw !== "object") return;
    for (const side of ["p1", "p2"]) {
      if (raw[side] && typeof raw[side] === "object") {
        for (const a of CONTROL_ACTIONS) {
          const val = raw[side][a.key];
          if (typeof val === "string" && val.length > 0 && val !== "Escape") {
            controls[side][a.key] = val;
          }
        }
      }
    }
    if (typeof raw.p1TapJump === "boolean") settings.p1TapJump = raw.p1TapJump;
    if (typeof raw.p2TapJump === "boolean") settings.p2TapJump = raw.p2TapJump;
    if (typeof raw.screenEffects === "boolean") settings.screenEffects = raw.screenEffects;
    if (typeof raw.showHitboxes === "boolean") settings.showHitboxes = raw.showHitboxes;
    if (Number.isInteger(raw.p1PresetIndex) && raw.p1PresetIndex >= 0 && raw.p1PresetIndex < P1_PRESETS.length) {
      settings.p1PresetIndex = raw.p1PresetIndex;
    }
  } catch (e) {}
}
loadSettings();

function isKeyBoundForPlayer(side, key) {
  const map = controls[side];
  if (!map) return false;
  for (const a of CONTROL_ACTIONS) {
    if (map[a.key] === key) return true;
  }
  return false;
}

function applyKeyRebind(side, action, newKey) {
  const map = controls[side];
  if (!map || !newKey || newKey === "Escape") return;
  const oldKey = map[action];
  if (oldKey === newKey) {
    playSfx("hit", .45);
    return;
  }
  // ジャンプに上入力と同じキーを入れた場合は上入力を上書きせず上キーでジャンプをONにする
  if (action === "jump" && newKey === map.up) {
    map.jump = newKey;
    if (side === "p1") settings.p1TapJump = true;
    else settings.p2TapJump = true;
    saveSettings();
    playSfx("hit", .55);
    uiNotice = `${side.toUpperCase()} ジャンプを ${formatKeyLabel(newKey)} に設定しました`;
    uiNoticeTimer = 110;
    return;
  }
  let swappedLabel = "";
  for (const a of CONTROL_ACTIONS) {
    if (a.key !== action && map[a.key] === newKey) {
      map[a.key] = oldKey;
      swappedLabel = a.label;
      break;
    }
  }
  map[action] = newKey;
  saveSettings();
  playSfx("hit", .6);
  uiNotice = swappedLabel
    ? `${formatKeyLabel(newKey)} を設定（${swappedLabel} と入れ替え）`
    : `${side.toUpperCase()} を ${formatKeyLabel(newKey)} に変更しました`;
  uiNoticeTimer = 110;
}

function resetPlayerControls(side) {
  Object.assign(controls[side], DEFAULT_CONTROLS[side]);
  if (side === "p1") { settings.p1TapJump = true; settings.p1PresetIndex = 0; }
  else settings.p2TapJump = true;
  saveSettings();
  playSfx("parry", .6);
  uiNotice = `${side.toUpperCase()} のボタン配置を初期設定に戻しました`;
  uiNoticeTimer = 110;
}

function resetAllSettings() {
  Object.assign(controls.p1, DEFAULT_CONTROLS.p1);
  Object.assign(controls.p2, DEFAULT_CONTROLS.p2);
  settings.p1TapJump = true;
  settings.p2TapJump = true;
  settings.screenEffects = true;
  settings.showHitboxes = false;
  settings.p1PresetIndex = 0;
  sfxMuted = false;
  try { localStorage.setItem("mbsp-sfx", "on"); } catch (e) {}
  saveSettings();
  playSfx("parry", .7);
  uiNotice = "すべての設定を初期値に戻しました";
  uiNoticeTimer = 120;
}

function cycleP1Preset() {
  settings.p1PresetIndex = (settings.p1PresetIndex + 1) % P1_PRESETS.length;
  const preset = P1_PRESETS[settings.p1PresetIndex];
  Object.assign(controls.p1, preset.keys);
  saveSettings();
  playSfx("hit", .6);
  uiNotice = `P1プリセット: ${preset.name}`;
  uiNoticeTimer = 120;
}

let audioCtx = null;
let sfxMuted = false;
try { sfxMuted = localStorage.getItem("mbsp-sfx") === "off"; } catch (e) {}
function getAudio() {
  if (sfxMuted) return null;
  try {
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return null;
    if (!audioCtx) audioCtx = new AC();
    if (audioCtx.state === "suspended") audioCtx.resume();
    return audioCtx;
  } catch (e) { return null; }
}
function playSfx(kind, power = 1) {
  const ac = getAudio();
  if (!ac || ac.state !== "running") return;
  try {
    const now = ac.currentTime;
    const vol = Math.max(.35, Math.min(1.25, power));
    const master = ac.createGain();
    master.gain.value = .9;
    master.connect(ac.destination);
    const tone = (f0, f1, dur, gain, type = "sine", delay = 0) => {
      const osc = ac.createOscillator(), g = ac.createGain();
      osc.type = type;
      osc.frequency.setValueAtTime(f0, now + delay);
      osc.frequency.exponentialRampToValueAtTime(Math.max(20, f1), now + delay + dur);
      g.gain.setValueAtTime(gain * vol, now + delay);
      g.gain.exponentialRampToValueAtTime(.0008, now + delay + dur);
      osc.connect(g); g.connect(master);
      osc.start(now + delay); osc.stop(now + delay + dur + .02);
    };
    const noise = (dur, gain, freq, delay = 0, type = "lowpass") => {
      const len = Math.max(1, Math.floor(ac.sampleRate * dur));
      const buf = ac.createBuffer(1, len, ac.sampleRate);
      const data = buf.getChannelData(0);
      for (let i = 0; i < len; i++) data[i] = (Math.random() * 2 - 1) * (1 - i / len);
      const src = ac.createBufferSource(), flt = ac.createBiquadFilter(), g = ac.createGain();
      src.buffer = buf; flt.type = type; flt.frequency.value = freq; flt.Q.value = .8;
      g.gain.setValueAtTime(gain * vol, now + delay);
      g.gain.exponentialRampToValueAtTime(.0008, now + delay + dur);
      src.connect(flt); flt.connect(g); g.connect(master);
      src.start(now + delay);
    };
    switch (kind) {
      case "hit": noise(.07, .22, 1600); tone(190, 70, .11, .3); break;
      case "smash": noise(.17, .42, 850); tone(150, 38, .32, .62); tone(820, 240, .07, .18, "square"); break;
      case "slam": noise(.26, .5, 480); tone(95, 28, .48, .7); noise(.12, .2, 2600, .02, "highpass"); break;
      case "zap": for (let i = 0; i < 3; i++) tone(1300 + Math.random() * 900, 380, .05, .11, "sawtooth", i * .035); break;
      case "charge": tone(200 + power * 520, 240 + power * 560, .05, .07, "triangle"); break;
      case "chargeMax": tone(520, 1250, .2, .22, "triangle"); noise(.1, .14, 3200, 0, "highpass"); break;
      case "ko": noise(.55, .6, 380); tone(70, 22, .9, .8); tone(400, 60, .35, .25, "square"); break;
      case "parry": tone(880, 1500, .09, .22, "triangle"); tone(1320, 1800, .07, .12, "sine", .03); break;
      case "shield": noise(.05, .12, 2200, 0, "bandpass"); tone(420, 300, .06, .1, "triangle"); break;
      case "swing": noise(.09, .1, 1400, 0, "bandpass"); break;
      case "jump": tone(260, 520, .09, .07, "triangle"); break;
      default: break;
    }
  } catch (e) {}
}

const CPU_LEARNING_KEY = "money-brothers-cpu-learning-v1";
function loadCPULearning() {
  const data = {
    1: { projectileHits: 0, projectileResponse: 0, projectileEvasions: 0 },
    2: { projectileHits: 0, projectileResponse: 0, projectileEvasions: 0 },
    3: { projectileHits: 0, projectileResponse: 0, projectileEvasions: 0 }
  };
  try {
    const saved = JSON.parse(localStorage.getItem(CPU_LEARNING_KEY) || "null");
    for (const level of [1, 2, 3]) {
      if (!saved || !saved[level]) continue;
      data[level].projectileHits = Math.max(0, Number(saved[level].projectileHits) || 0);
      data[level].projectileResponse = Math.max(0, Math.min(.42, Number(saved[level].projectileResponse) || 0));
      data[level].projectileEvasions = Math.max(0, Number(saved[level].projectileEvasions) || 0);
    }
  } catch (e) {}
  return data;
}
let cpuLearning = loadCPULearning();

function saveCPULearning() {
  try { localStorage.setItem(CPU_LEARNING_KEY, JSON.stringify(cpuLearning)); } catch (e) {}
}

function teachCPUAboutProjectile(cpu) {
  if (!cpu || !cpu.isCPU || cpu.isSandbag) return;
  const level = cpu.cpuLevel || 1;
  const memory = cpuLearning[level];
  memory.projectileHits++;
  memory.projectileResponse = Math.min(.42, memory.projectileResponse + .12);
  cpu.aiLearning = memory;
  saveCPULearning();
}

function rectOverlap(a, b) { return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y; }
function circleIntersectsRect(cx, cy, radius, box) {
  const x = Math.max(box.x, Math.min(cx, box.x + box.w));
  const y = Math.max(box.y, Math.min(cy, box.y + box.h));
  return Math.hypot(cx - x, cy - y) <= radius;
}
function drawRoundRect(x, y, w, h, r) {
  const rad = Math.min(r, w / 2, h / 2);
  ctx.beginPath();
  ctx.moveTo(x + rad, y); ctx.lineTo(x + w - rad, y);
  ctx.quadraticCurveTo(x + w, y, x + w, y + rad);
  ctx.lineTo(x + w, y + h - rad);
  ctx.quadraticCurveTo(x + w, y + h, x + w - rad, y + h);
  ctx.lineTo(x + rad, y + h);
  ctx.quadraticCurveTo(x, y + h, x, y + h - rad);
  ctx.lineTo(x, y + rad);
  ctx.quadraticCurveTo(x, y, x + rad, y);
  ctx.closePath();
}

function spawnCoinGroundExplosion(s, point, players) {
  const radius = s.blastRadius || 58;
  const hitbox = { x: point.x - radius, y: point.y - radius, w: radius * 2, h: radius * 2 };
  effects.push({ type: "ring", x: point.x, y: point.y, vx: 0, vy: 0, life: 16, maxLife: 16, radius, color: s.color });
  spawnParticles(point.x, point.y, s.color, 24, 6.5, 5, .06);

  for (const p of players) {
    if (!p.alive || p === s.owner || p.invincible > 0 || p.dodgeInvincible > 0) continue;
    if (!circleIntersectsRect(point.x, point.y, radius, p.getBody())) continue;
    const dir = p.x + p.w / 2 >= point.x ? 1 : -1;
    applyHit(s.owner, p, hitbox, {
      damage: s.blastDamage || 8,
      kbBase: s.blastKbBase || 3,
      kbScale: s.blastKbScale || .055,
      maxKnockback: s.blastMaxKnockback || 11.5,
      verticalScale: .62,
      horizontalScale: .9,
      direction: dir,
      strongEffect: true,
      projectile: true,
      special: true,
      coinExplosion: true
    });
  }
}

function updateProjectiles(players) {
  for (let i = projectiles.length - 1; i >= 0; i--) {
    const s = projectiles[i];
    const prevX = s.x, prevY = s.y;
    s.x += s.vx; s.y += s.vy; s.vy += s.grav; s.life--;
    if (s.bounce && s.vy >= 0) {
      for (const pl of platforms) {
        if (s.x + s.size >= pl.x && s.x - s.size <= pl.x + pl.w && s.y + s.size >= pl.y && prevY + s.size <= pl.y + 8) {
          s.y = pl.y - s.size; s.vy = -4.2;
          spawnParticles(s.x, s.y, s.color, 3, 2, 2, .05);
          break;
        }
      }
    }
    if (s.peel && !s.landed && s.vy >= 0) {
      // バナナの皮：床に落ちたらその場に残る（踏んだ相手がすべって転ぶ）
      for (const pl of platforms) {
        if (s.x + s.size * .5 >= pl.x && s.x - s.size * .5 <= pl.x + pl.w && s.y + s.size >= pl.y && prevY + s.size <= pl.y + 10) {
          s.y = pl.y - s.size * .4; s.vx = 0; s.vy = 0; s.grav = 0; s.landed = true; s.restPlatform = pl;
          break;
        }
      }
    }
    if (s.landed && s.restPlatform && s.restPlatform.dx) s.x += s.restPlatform.dx;
    let groundContact = null;
    if (s.groundBurst && s.vy >= 0) {
      for (const pl of platforms) {
        const crossedTop = prevY + s.size <= pl.y + 3 && s.y + s.size >= pl.y;
        const overlapsPlatform = s.x + s.size > pl.x && s.x - s.size < pl.x + pl.w;
        if (crossedTop && overlapsPlatform) {
          s.y = pl.y - s.size;
          groundContact = { x: Math.max(pl.x, Math.min(pl.x + pl.w, s.x)), y: pl.y };
          break;
        }
      }
    }
    let dead = s.life <= 0 || s.x < -BLAST_X || s.x > VIEW_W + BLAST_X || s.y > VIEW_H + BLAST_Y || s.y < TOP_BLAST_Y;
    if (groundContact) {
      spawnCoinGroundExplosion(s, groundContact, players);
      dead = true;
    } else if (!dead) {
      for (const p of players) {
        if (!p.alive || p === s.owner) continue;
        if (s.owner && s.owner.storyTeam && s.owner.storyTeam === p.storyTeam) continue;
        if (p.invincible > 0 || p.dodgeInvincible > 0) continue;
        const box = { x: s.x - s.size, y: s.y - s.size, w: s.size * 2, h: s.size * 2 };
        const godReflectBox = hasGodBuff(p) ? (p.getHitbox() || p.getSpecialHitbox(false) || p.getLedgeAttackHitbox()) : null;
        if ((p.special && p.special.data.reflect && rectOverlap(box, p.getBody())) || (godReflectBox && rectOverlap(box, godReflectBox))) {
          addAchievementProgress("reflections", 1, p);
          s.owner = p; s.vx = -s.vx * 1.25; s.damage *= 1.2; s.life = 90;
          spawnParryEffect(s.x, s.y);
          continue;
        }
        if (rectOverlap(box, p.getBody())) {
          if (s.meat) {
            const cooked = s.meatKind === "cooked";
            applyHit(s.owner, p, box, { damage: s.damage, kbBase: s.kbBase, kbScale: s.kbScale, maxKnockback: s.maxKnockback, verticalScale: .35, horizontalScale: .7, strongEffect: !cooked, projectile: true, special: true, direction: s.vx >= 0 ? 1 : -1 });
            if (p.alive) {
              if (cooked) {
                // 焼きカルビ: 火傷の継続ダメージ＋食べられて少し拘束
                p.hitstun = Math.max(p.hitstun, 34);
                p.burnTimer = Math.max(p.burnTimer || 0, 120); p.burnTick = 0;
                p.eatTimer = 34;
                p.showMoveLabel && p.showMoveLabel("もぐもぐ… 火傷した！");
                spawnParticles(p.x + p.w / 2, p.y + p.h * .4, "#ff9a3a", 10, 3.5, 3, -.04);
              } else {
                // 生カルビ: 食中毒の継続ダメージ＋短い拘束
                p.hitstun = Math.max(p.hitstun, 18);
                p.poisonTimer = Math.max(p.poisonTimer || 0, 240); p.poisonTick = 0;
                p.showMoveLabel && p.showMoveLabel("生焼け… 食中毒になった");
                spawnParticles(p.x + p.w / 2, p.y + p.h * .4, "#7ed957", 10, 3.5, 3, -.03);
              }
            }
          } else if (s.peel) {
            // すべって転ぶ：ふっとばさずにその場でダウン
            applyHit(s.owner, p, box, { damage: s.damage, kbBase: s.kbBase, kbScale: s.kbScale, maxKnockback: s.maxKnockback, verticalScale: .2, horizontalScale: .5, vySign: 1, knockdown: 46, strongEffect: false, projectile: true, special: true, direction: (p.x + p.w / 2) >= s.x ? 1 : -1 });
            if (p.alive) p.showMoveLabel && p.showMoveLabel("ツルッ！");
          } else
          applyHit(s.owner, p, box, { damage: s.damage, kbBase: s.kbBase, kbScale: s.kbScale, maxKnockback: s.maxKnockback, strongEffect: false, projectile: true, special: !!s.special, direction: s.vx >= 0 ? 1 : -1 });
          dead = true; break;
        }
      }
    }
    if (s.aiAvoidedBy && s.vx !== 0) {
      for (const cpu of s.aiAvoidedBy) {
        const passed = s.vx > 0 ? s.x - s.size > cpu.x + cpu.w : s.x + s.size < cpu.x;
        if (passed && cpu.aiLearning) {
          cpu.aiLearning.projectileEvasions++;
          if (cpu.aiLearning.projectileEvasions % 4 === 0) saveCPULearning();
          s.aiAvoidedBy.delete(cpu);
        }
      }
    }
    if (dead) {
      if (!groundContact) spawnParticles(s.x, s.y, s.color, s.bomb ? 16 : 6, s.bomb ? 5 : 3, 3, .05);
      projectiles.splice(i, 1);
    }
  }
}
function updateEffects() {
  for (let i = effects.length - 1; i >= 0; i--) {
    const e = effects[i];
    e.x += e.vx; e.y += e.vy; e.vy += e.gravity; e.vx *= 0.98; e.life--;
    if (e.life <= 0) effects.splice(i, 1);
  }
}

function applyHit(attacker, target, hitbox, stats) {
  if (!target.alive || target.invincible > 0 || target.dodgeInvincible > 0) return false;
  if (target.special && target.special.data.stoneForm && target.special.frame >= 5) {
    spawnParryEffect(target.x + target.w / 2, target.y + target.h / 2);
    return false;
  }
  const isSmash = !!stats.smash, charge = isSmash ? (attacker.smashChargeScale || 1) : 1;
  const noKnockback = !!stats.noKnockback;
  const damage = stats.damage * attacker.fighter.damageScale * charge;
  const piercesDivine = !!(attacker && attacker.fighter && attacker.fighter.fallen && !target.fighter.fallen);
  if (hasGodBuff(target) && !piercesDivine && !(target.shieldActive && !stats.ignoreShield)) {
    // りかちゃんは常時：あらゆる攻撃に耐性（ふっとばない・投げられない）＋被ダメージ90%カット
    // 堕天使りかちゃん（ボス）はふっとばないが、体力制なので被ダメは80%
    const reduced = damage * (target.fighter.fallen ? 0.8 : 0.1);
    target.damage += reduced;
    target.lastHitBy = attacker;
    target.lastHitAge = 0;
    registerAchievementHit(attacker, target, reduced, stats);
    spawnParticles(target.x + target.w / 2, target.y + target.h / 2, "#fff4cf", 10, 4, 4, -.02);
    playSfx("shield", .55);
    return true;
  }
  if (!stats.ignoreShield && target.shieldActive) {
    const r = target.handleShieldHit(damage, attacker, stats);
    if (r === "block") {
      addAchievementProgress("shieldBlocks", 1, target);
      // ガード時も短いヒットストップでガツンとした手応えを出す
      const guardLag = Math.min(8, 2 + Math.floor(damage * .3));
      target.hitlag = Math.max(target.hitlag, guardLag); target.hitlagTotal = Math.max(target.hitlagTotal || 0, guardLag); target.hitlagShake = 3;
      if (!stats.projectile) { attacker.hitlag = Math.max(attacker.hitlag, guardLag); attacker.hitlagTotal = Math.max(attacker.hitlagTotal || 0, guardLag); }
      playSfx("shield", .8);
    }
    if (r === "break") addAchievementProgress("enemyShieldBreaks", 1, attacker);
    if (r !== "break") return false;
  }
  if (target.special && target.special.data.superArmor && !stats.ignoreShield) {
    const absorbedDamage = damage * 0.65;
    target.damage += absorbedDamage;
    target.lastHitBy = attacker;
    target.lastHitAge = 0;
    if (attacker.fighter && attacker.fighter.isGod) attacker.rikaHappy = Math.max(attacker.rikaHappy || 0, 45);
    if (target.isCPU && stats.projectile) teachCPUAboutProjectile(target);
    registerAchievementHit(attacker, target, absorbedDamage, stats);
    spawnParticles(target.x + target.w / 2, target.y + target.h / 2, "#b84dff", 8, 4, 4, .06);
    return true;
  }
  if (target.holdingTarget) { target.holdingTarget.grabbedBy = null; target.holdingTarget = null; target.throwState = null; }
  if (target.grabbedBy) { target.grabbedBy.holdingTarget = null; target.grabbedBy.throwState = null; target.grabbedBy = null; }
  if (target.commandGrabParent) { target.commandGrabParent.special = null; target.commandGrabParent = null; }
  target.damage += damage;
  target.lastHitBy = attacker;
  target.lastHitAge = 0;
  if (attacker.fighter && attacker.fighter.isGod) attacker.rikaHappy = Math.max(attacker.rikaHappy || 0, 45);
  if (target.isCPU && stats.projectile) teachCPUAboutProjectile(target);
  registerAchievementHit(attacker, target, damage, stats);
  onTutorialHit(attacker, target, stats);
  if (attacker.fighter.limitBreak) attacker.limit = Math.min(100, (attacker.limit || 0) + damage * 1.1);
  if (target.fighter.limitBreak) target.limit = Math.min(100, (target.limit || 0) + damage * 0.9);
  const dir = stats.direction ?? attacker.attackFacing ?? attacker.facing;
  const weight = Math.max(.65, target.fighter.weight);
  let kb = (stats.kbBase + target.damage * stats.kbScale) * attacker.fighter.powerScale * charge / weight;
  const maxKb = (stats.maxKnockback || 15) * attacker.fighter.powerScale / weight;
  const percentBoost = 1 + Math.min(.5, Math.max(0, target.damage - 35) * .0034);
  const crouchResistance = target.crouching ? .68 : 1;
  kb = Math.min(kb, maxKb) * percentBoost * crouchResistance;
  target.bodySquash = Math.max(target.bodySquash || 0, Math.min(.9, .18 + kb * .045));
  if (settings.screenEffects && (isSmash || kb > 9)) cameraShake = Math.max(cameraShake, Math.min(6, kb * .24));

  // ---- ヒットストップ（原作の「ヒットラグ」）: ダメージに応じて両者が一瞬静止する ----
  const hitlagFrames = noKnockback
    ? 3
    : Math.min(22, Math.floor((3 + damage * .5 + (isSmash ? 4 : 0) + (stats.slam ? 5 : 0)) * (stats.electric ? 1.4 : 1)));
  target.hitlag = Math.max(target.hitlag, hitlagFrames);
  target.hitlagTotal = Math.max(target.hitlagTotal || 0, hitlagFrames);
  target.hitlagShake = Math.max(target.hitlagShake || 0, Math.min(5, 1.5 + kb * .22));
  if (!stats.projectile && !stats.throw && !stats.coinExplosion) {
    attacker.hitlag = Math.max(attacker.hitlag, hitlagFrames);
    attacker.hitlagTotal = Math.max(attacker.hitlagTotal || 0, hitlagFrames);
  }

  // ---- インパクト演出: 放射状のヒット線 / 強打時のズーム / 効果音 ----
  const impactX = hitbox.x + hitbox.w / 2, impactY = hitbox.y + hitbox.h / 2;
  let impactColor = isSmash ? "#ffd166" : "#fff3b0";
  if (stats.electric) impactColor = "#9df6ff";
  else if (stats.fire) impactColor = "#ff8a3a";
  else if (stats.sword) impactColor = "#ffffff";
  else if (stats.coinBurst || stats.coinExplosion) impactColor = "#ffd700";
  else if (stats.dark || (attacker.fighter.weapon === "dark" && stats.special)) impactColor = "#c63dff";
  if (!noKnockback && (stats.strongEffect || isSmash || kb > 6.5)) spawnImpactEffect(impactX, impactY, kb, impactColor, dir);
  const dramatic = settings.screenEffects && !noKnockback && ((isSmash && kb >= 10) || kb >= 13.5 || stats.slam);
  if (dramatic) {
    hitZoom = { x: impactX, y: impactY, frames: hitlagFrames + 10, maxFrames: hitlagFrames + 10, strength: Math.min(.45, .16 + kb * .017) };
    cameraShake = Math.max(cameraShake, Math.min(11, 3 + kb * .42));
  }
  if (!noKnockback) playSfx(stats.slam ? "slam" : ((isSmash || kb >= 10.5) ? "smash" : "hit"), .45 + kb / 16);

  target.proneTimer = 0;
  target.pendingProne = null;
  target.techWindow = 0;
  target.crouching = false;
  if (noKnockback) {
    target.hitstun = Math.max(target.hitstun, stats.noKnockbackStun || 6);
  } else {
    target.vx = dir * kb * (stats.horizontalScale ?? 1);
    target.vy = (stats.vySign ?? -1) * kb * (stats.verticalScale ?? .62);
    target.hitstun = Math.max(target.hitstun, Math.min(58, Math.floor(10 + kb * 1.35)));
    target.onGround = false; target.standingPlatform = null;
    target.ledgeGrab = false; target.ledgeAction = null; target.ledgeSide = 0; target.ledgeCooldown = 16;
    // 攻撃を食らったら崖無敵リセット（再度崖を掴んでも判定なしになる）
    target.hasLedgeInvincible = false;
    if (stats.knockdown) {
      // 叩きつけ技: ふっとばさずに地面へ倒れ込む「ダウン状態」にする
      target.proneTimer = stats.knockdown;
      target.techWindow = 16;
      target.hitstun = Math.min(target.hitstun, 8);
    } else if (damage > 0 && kb <= 5.5 && (stats.verticalScale ?? .62) <= .78) {
      // 弱いふっとばしは、着地したら受け身可能なダウン状態にする
      target.pendingProne = { duration: 38, techWindow: 16 };
    }
  }
  if (target.shieldBroken) target.hitstun = Math.max(target.hitstun, 40);
  target.attackTimer = 0; target.attackType = null; target.attackFrame = 0;
  target.hitRegistered = false; target.lastHitFrame = -99; target.smashCharge = null;
  target.special = null; target.specialEndlag = 0; target.grabTimer = 0;
  target.shieldActive = false; target.justGuardActive = false; target.dodgeTimer = 0; target.dodgeType = null;
  spawnHitEffect(hitbox.x + hitbox.w / 2, hitbox.y + hitbox.h / 2, stats.strongEffect || isSmash);
  if (stats.fire) spawnParticles(hitbox.x + hitbox.w / 2, hitbox.y + hitbox.h / 2, "#ff5a1f", 10, 5, 4, .08);
  if (stats.electric) spawnParticles(hitbox.x + hitbox.w / 2, hitbox.y + hitbox.h / 2, "#7df9ff", 10, 6, 3, .02);
  if (stats.sword) spawnParticles(hitbox.x + hitbox.w / 2, hitbox.y + hitbox.h / 2, "#ffffff", 8, 5, 3, .05);
  if (stats.coinBurst) spawnParticles(hitbox.x + hitbox.w / 2, hitbox.y + hitbox.h / 2, "#ffd700", 12, 5, 4, .15);
  return true;
}

// ---------- キャラの質感描画（オフスクリーンでシェーディング＋輪郭＋リムライト） ----------
const avatarBuffer = document.createElement("canvas");
const avatarBufferCtx = avatarBuffer.getContext("2d");
const avatarSilhouette = document.createElement("canvas");
const avatarSilhouetteCtx = avatarSilhouette.getContext("2d");

function paintAvatarShaded(x, y, w, h, fighter, color, facing = 1, isStone = false, eyebrowUp = false, faceState = null) {
  const pad = Math.max(3, Math.max(w, h) * .16);
  const rs = Math.max(1, avatarRenderScale || 1);
  const bw = Math.max(16, Math.ceil((w + pad * 2) * rs)), bh = Math.max(16, Math.ceil((h + pad * 2) * rs));
  const logicalBufferW = bw / rs, logicalBufferH = bh / rs;
  if (avatarBuffer.width !== bw || avatarBuffer.height !== bh) {
    avatarBuffer.width = bw; avatarBuffer.height = bh;
    avatarSilhouette.width = bw; avatarSilhouette.height = bh;
  }
  const c = avatarBufferCtx;
  c.setTransform(1, 0, 0, 1, 0, 0);
  c.globalAlpha = 1;
  c.globalCompositeOperation = "source-over";
  c.clearRect(0, 0, bw, bh);

  // 一時的に描画先をバッファへ切り替えてキャラを描く
  const prevCtx = ctx;
  ctx = c;
  try { drawAvatar(pad * rs, pad * rs, w * rs, h * rs, fighter, color, facing, isStone, eyebrowUp, faceState); }
  finally { ctx = prevCtx; }

  // 形状を保ったまま重ねる陰影（上からの環境光＋下の落ち込み）
  c.globalCompositeOperation = "source-atop";
  const amb = c.createLinearGradient(0, 0, 0, bh);
  amb.addColorStop(0, "rgba(255,255,255,0.30)");
  amb.addColorStop(.4, "rgba(255,255,255,0.05)");
  amb.addColorStop(.74, "rgba(0,0,0,0.10)");
  amb.addColorStop(1, "rgba(0,0,0,0.45)");
  c.fillStyle = amb; c.fillRect(0, 0, bw, bh);

  // 正面側からのリムライト（ふちを光らせて立体化）
  const rim = c.createLinearGradient(facing > 0 ? 0 : bw, 0, facing > 0 ? bw : 0, 0);
  rim.addColorStop(0, "rgba(255,255,255,0.34)");
  rim.addColorStop(.5, "rgba(255,255,255,0)");
  c.fillStyle = rim; c.fillRect(0, 0, bw, bh);

  // 頭上のハイライト
  const hl = c.createRadialGradient(bw / 2, (pad + h * .2) * rs, 1.5 * rs, bw / 2, (pad + h * .2) * rs, Math.max(w, h) * .52 * rs);
  hl.addColorStop(0, "rgba(255,255,255,0.22)");
  hl.addColorStop(1, "rgba(255,255,255,0)");
  c.fillStyle = hl; c.fillRect(0, 0, bw, bh);
  c.globalCompositeOperation = "source-over";

  // 輪郭用のシルエットを作る
  const s = avatarSilhouetteCtx;
  s.setTransform(1, 0, 0, 1, 0, 0);
  s.globalAlpha = 1;
  s.globalCompositeOperation = "source-over";
  s.clearRect(0, 0, bw, bh);
  s.drawImage(avatarBuffer, 0, 0);
  s.globalCompositeOperation = "source-in";
  s.fillStyle = "rgba(8, 10, 20, 0.9)";
  s.fillRect(0, 0, bw, bh);
  s.globalCompositeOperation = "source-over";

  // シルエットを8方向にずらして輪郭にし、その上に本体を重ねる
  const ox = x - pad, oy = y - pad;
  const lw = Math.max(.9, Math.min(2.4, w * .05));
  for (let i = 0; i < 8; i++) {
    const ang = (i / 8) * Math.PI * 2;
    ctx.drawImage(avatarSilhouette, 0, 0, bw, bh, ox + Math.cos(ang) * lw, oy + Math.sin(ang) * lw, logicalBufferW, logicalBufferH);
  }
  ctx.drawImage(avatarBuffer, 0, 0, bw, bh, ox, oy, logicalBufferW, logicalBufferH);
}

function drawAvatar(x, y, w, h, fighter, color, facing = 1, isStone = false, eyebrowUp = false, faceState = null) {
  ctx.save();
  ctx.translate(x + w / 2, y + h / 2);
  ctx.scale(facing, 1);
  const lx = -w / 2, ly = -h / 2;
  if (isStone) {
    ctx.fillStyle = "#6e737b";
    drawRoundRect(lx - 2, ly + 4, w + 4, h - 4, 8); ctx.fill();
    ctx.strokeStyle = "#393c42"; ctx.lineWidth = 3; ctx.stroke();
    ctx.fillStyle = "#9aa0a8"; ctx.fillRect(lx + 4, ly + 10, w - 12, 8);
    ctx.restore(); return;
  }
  if (fighter.style === "otaku") {
    // ズボン・靴（ダークグレーの太めパンツ＋白底黒スニーカー）
    ctx.fillStyle = "#2d313d";
    drawRoundRect(lx + w * .18, ly + h * .76, w * .28, h * .20, 4); ctx.fill();
    drawRoundRect(lx + w * .54, ly + h * .76, w * .28, h * .20, 4); ctx.fill();
    ctx.fillStyle = "#14161d";
    drawRoundRect(lx + w * .15, ly + h * .91, w * .34, h * .09, 4); ctx.fill();
    drawRoundRect(lx + w * .52, ly + h * .91, w * .36, h * .09, 4); ctx.fill();
    ctx.fillStyle = "#e5e9f0";
    ctx.fillRect(lx + w * .16, ly + h * .97, w * .32, h * .025);
    ctx.fillRect(lx + w * .53, ly + h * .97, w * .34, h * .025);

    // 背中の黒リュック
    ctx.fillStyle = "#151821";
    drawRoundRect(lx - w * .10, ly + h * .38, w * .24, h * .34, 6); ctx.fill();
    ctx.strokeStyle = "#3a4052"; ctx.lineWidth = 1.5; ctx.stroke();

    // 少し小太りでお腹がぽっこり出た黒い服の胴体
    ctx.fillStyle = color;
    ctx.beginPath();
    ctx.ellipse(lx + w * .52, ly + h * .60, w * .48, h * .26, 0, 0, Math.PI * 2);
    ctx.fill();
    drawRoundRect(lx + w * .12, ly + h * .36, w * .78, h * .44, 12);
    ctx.fill();
    // 黒Tシャツの裾リブと胸の控えめなプリント＆リュック肩紐
    ctx.fillStyle = "#12141b";
    ctx.fillRect(lx + w * .12, ly + h * .75, w * .80, h * .05);
    ctx.strokeStyle = "#3c4254"; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(lx + w * .26, ly + h * .37); ctx.lineTo(lx + w * .24, ly + h * .68); ctx.stroke();
    ctx.fillStyle = "rgba(255,255,255,.16)";
    ctx.fillRect(lx + w * .54, ly + h * .46, w * .26, h * .05);
    ctx.fillRect(lx + w * .58, ly + h * .53, w * .18, h * .035);

    // ぽっちゃりした半袖の腕と肌色の手
    ctx.fillStyle = color;
    ctx.beginPath(); ctx.ellipse(lx + w * .10, ly + h * .50, w * .16, h * .11, -.2, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = "#f2ccb0";
    ctx.beginPath(); ctx.arc(lx + w * .06, ly + h * .60, w * .10, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(lx + w * .92, ly + h * .58, w * .10, 0, Math.PI * 2); ctx.fill();

    // 太めの首と少し丸顔・二重あご気味の成人男性の顔
    ctx.fillStyle = "#e6be9f";
    ctx.fillRect(lx + w * .34, ly + h * .28, w * .34, h * .12);
    ctx.fillStyle = "#f4cfb4";
    ctx.beginPath();
    ctx.ellipse(lx + w * .51, ly + h * .21, w * .31, h * .17, 0, 0, Math.PI * 2);

  startAttack(type, charge = 0, facing = this.facing) {

    const st = getMoveStats(this.fighter, this.attackType);

      case "sideTilt": return fwd(46 * sc, this.y + 7, this.h - 12);

  updateAttack(op) {

            if (since < st.cleanHit.frames) {

              hitStats.kbBase = st.kbBase * st.cleanHit.kbMul;

  resetLandingJumps() {

  landOnPlatform(platform, wasGround, impactSpeed) {

    const impact = Math.max(0, Math.min(1.35, impactSpeed / 10));

  // ★修正: メイン台は固体 (下面・側面すり抜け禁止)。すり抜け床は従来通り一方通行
  moveAndCollide(gf = 1) {
    // 浮遊中に必殺技を出しても下がらない（上昇技の勢いは重力で減速させ、下向きの速度は0に固定）
    const floatNoSink = !!(this.floatActive && this.special);

      if (pl.main) {

        const overH = this.x + this.w > pl.x + 2 && this.x < pl.x + pl.w - 2;
        const oldF = prevY + this.h, newF = this.y + this.h;
        if (this.vy >= 0 && overH && oldF <= pl.y + 12 && newF >= pl.y) {
          const impactSpeed = this.vy;
          this.y = pl.y - this.h;
          this.landOnPlatform(pl, wasGround, impactSpeed);

        }
        // --- 固体めり込み解消 (下面・側面) ---
        const overlap = this.x + this.w > pl.x && this.x < pl.x + pl.w && this.y + this.h > pl.y && this.y < pl.y + pl.h;
        if (overlap) {
          const landHere = () => {
            this.y = pl.y - this.h;

            const impactSpeed = this.vy;
            this.landOnPlatform(pl, wasGround, impactSpeed);
          };
          const bumpHead = () => {
            // ★真下からの上昇は頭ぶつけで止める (すり抜け禁止)
            this.y = pl.y + pl.h + 1;

          const pushOutLeft = () => { this.x = pl.x - this.w - 0.5; if (this.vx > 0) this.vx = 0; };
          const pushOutRight = () => { this.x = pl.x + pl.w + 0.5; if (this.vx < 0) this.vx = 0; };

          if (prevY + this.h <= pl.y + 8) landHere();            // 上からめり込んだ
          else if (prevY >= pl.y + pl.h - 8) bumpHead();         // 真下から上昇してきた
          else if (prevX + this.w <= pl.x + 10) pushOutLeft();   // 左側面にぶつかった
          else if (prevX >= pl.x + pl.w - 10) pushOutRight();    // 右側面にぶつかった
          else {
            // 投げ直後などで最初からめり込んでいた: いちばん浅い方向へ押し出す
            const up = (this.y + this.h) - pl.y;
            const down = (pl.y + pl.h) - this.y;
            const left = (this.x + this.w) - pl.x;
            const right = (pl.x + pl.w) - this.x;
            const m = Math.min(up, down, left, right);
            if (m === up) landHere();
            else if (m === down) bumpHead();
            else if (m === left) pushOutLeft();

      if (this.lastHitBy && this.lastHitAge <= 240) addAchievementProgress("kos", 1, this.lastHitBy);

  }

  tryGrabLedge() {

    const ey = mainPlatform.y, nearH = this.y <= ey + 62 && this.y + this.h >= ey - 6;

    const le = mainPlatform.x, re = mainPlatform.x + mainPlatform.w;

  grabLedge(side, ex) {

    this.facing = -side; this.vx = 0; this.vy = 0; this.onGround = false; this.standingPlatform = null;

    this.ledgeLockTimer = 16;
    this.ledgeHoldTimer = 0;
    // 崖無敵はその掴みにつき一度だけ。一度離してもう一度掴んでも無敵はつかない
    if (!this.hasLedgeInvincible) {
      this.hasLedgeInvincible = true;
      this.ledgeInvincibleTimer = 50;

  releaseLedge(fallSpeed = 2.6) {

    this.hasLedgeInvincible = true;
    this.ledgeInvincibleTimer = 0;
    spawnParticles(this.x + this.w / 2, this.y + this.h / 2, "#b8f2ff", 5, 2.5, 2.5, .03);
  }
  updateLedge(input) {
    // 掴んで少しの間はどの行動もとれない（誤って即座に上がるのを防ぐ）
    if (this.ledgeLockTimer > 0) return;
    this.ledgeHoldTimer++;
    const away = this.ledgeSide < 0 ? this.keys.left : this.keys.right;
    const toward = this.ledgeSide < 0 ? this.keys.right : this.keys.left;
    if (input.pressed[this.keys.weak] || input.pressed[this.keys.strong]) { this.startLedgeAction("attack"); return; }
    // 回避キー（シールド）で回避上がり
    if (input.pressed[this.keys.shield]) { this.startLedgeAction("roll"); return; }
    // 反対方向・下で崖を離す（長押し不要・誤った上がりを防ぐ）
    if (input.pressed[away] || input.pressed[this.keys.down]) {
      this.releaseLedge();
      return;
    }
    if (input.pressed[this.keys.up] || (this.keys.jump && input.pressed[this.keys.jump])) { this.startLedgeAction("jump"); return; }
    if (input.pressed[toward]) { this.startLedgeAction("climb"); }

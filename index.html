function saveStoryCheckpoints() {
  try { localStorage.setItem(STORY_CHECKPOINT_KEY, JSON.stringify(storyCheckpoints)); } catch (e) {}
}
function getStoryCheckpoint(i) {
  const ch = STORY_CHAPTERS[i];
  if (!ch || !ch.checkpoints) return 0;
  const v = storyCheckpoints[ch.id] || 0;
  return ch.checkpoints.includes(v) ? v : 0;
}
function clearStoryCheckpoint(i) {
  const ch = STORY_CHAPTERS[i];
  if (ch && storyCheckpoints[ch.id]) { delete storyCheckpoints[ch.id]; saveStoryCheckpoints(); }
}
function describeStoryCheckpoint(i, v = getStoryCheckpoint(i)) {
  const ch = STORY_CHAPTERS[i];
  if (!v || !ch) return "";
  return ch.rule === "boss" ? `堕天使の残りHP ${STORY_BOSS_HP - v} / ${STORY_BOSS_HP}` : `撃破 ${v} / ${ch.goal}`;
}
// バトル中に区切りを越えたら記録する
function checkStoryCheckpoint(sb) {
  const ch = STORY_CHAPTERS[sb.chapter];
  if (!ch.checkpoints) return;
  const progress = sb.rule === "boss" ? sb.bossDamage : sb.kos;
  let reached = 0;
  for (const c of ch.checkpoints) if (progress >= c) reached = c;
  if (reached && reached > (storyCheckpoints[ch.id] || 0)) {
    storyCheckpoints[ch.id] = reached;
    saveStoryCheckpoints();
    sb.cpFlash = 120;
    const text = describeStoryCheckpoint(sb.chapter, reached);
    uiNotice = `CHECKPOINT！ ${text}（ここから再開できます）`;
    uiNoticeTimer = 160;
    playSfx("parry", .8);
    appendStoryLog("system", "", `チェックポイント到達：${ch.title}　${text}`);
  }
}

function loadStoryProgress() {
  try {
    const saved = JSON.parse(localStorage.getItem(STORY_STORAGE_KEY) || "null");
    if (saved && Array.isArray(saved.cleared)) return new Set(saved.cleared.filter(id => typeof id === "string"));
  } catch (e) {}
  return new Set();
}
function saveStoryProgress() {
  try { localStorage.setItem(STORY_STORAGE_KEY, JSON.stringify({ cleared: Array.from(storyCleared) })); } catch (e) {}
}
function markStoryCleared(id) {
  if (storyCleared.has(id)) return;
  storyCleared.add(id);
  saveStoryProgress();
}
function isStoryChapterUnlocked(i) {
  return i === 0 || storyCleared.has(STORY_CHAPTERS[i - 1].id);
}
function getStoryFighterIndex() {
  return RIKA_INDEX;
}

// 別次元のゲームからの戻り（?mbsp_story_clear=<id>）
function applyStoryReturnParam() {
  try {
    const search = (window.location && window.location.search) || "";
    const id = new URLSearchParams(search).get("mbsp_story_clear");
    if (!id) return;
    const ch = STORY_CHAPTERS.find(c => c.type === "link" && c.game.id === id);
    if (ch) {
      markStoryCleared(ch.id);
      uiNotice = `「${ch.game.name}」クリア！ ストーリーの続きへ進めます`;
      uiNoticeTimer = 300;
    }
    if (window.history && window.history.replaceState) window.history.replaceState(null, "", window.location.pathname);
  } catch (e) {}
}

function showStoryScene(lines, onDone, title = "") {

function startStoryChapter(i) {
  storyChapterIndex = i;
  const ch = STORY_CHAPTERS[i];
  if (ch.intro && ch.intro.length) showStoryScene(ch.intro, () => runStoryChapterMain(i), ch.title);
  else runStoryChapterMain(i);
}

function runStoryChapterMain(i) {
  const ch = STORY_CHAPTERS[i];
  if (ch.type === "battle") startStoryBattle(i);
  else if (ch.type === "link") startMiniGame(i);
  else completeStoryChapter(i);
}

function completeStoryChapter(i) {
  const ch = STORY_CHAPTERS[i];
  markStoryCleared(ch.id);
  clearStoryCheckpoint(i);
  const next = () => {
    if (i + 1 < STORY_CHAPTERS.length) startStoryChapter(i + 1);
    else {
      openStoryMenu();
      storyCursor = i;
      appendStoryLog("system", "", "― さよなら、別次元。マネブラのページに、いつもの色がもどってきた ―");
      appendStoryLog("system", "", "★ 堕天使りかちゃんが使えるようになった！（キャラ選択の右下）");
      rikaRevealed = true;
      try { localStorage.setItem(RIKA_REVEAL_STORAGE_KEY, "1"); } catch (e) {}
      uiNotice = "ストーリー クリア！ 堕天使りかちゃんが使えるようになった！";
      uiNoticeTimer = 360;
    }
  };
  if (ch.outro && ch.outro.length) showStoryScene(ch.outro, next, ch.title);
  else next();
}

function loadCustomStage(stage) {

function makeStoryOpponent(ch, spawnX) {
  if (ch.rule === "boss") {
    const boss = new Player(spawnX, 0, 1, false, true, ch.enemyLevel || 3, false);
    boss.fighter = BLACK_RIKA_FIGHTER;
    boss.stocks = 99;
    boss.respawn();
    return boss;
  }
  const idx = Math.floor(Math.random() * FIGHTERS.length);
  const base = FIGHTERS[idx];
  const e = new Player(spawnX, idx, 1, false, true, ch.enemyLevel || 2, false);
  e.fighter = Object.assign({}, base, {
    name: base.name + (ch.rule === "hundred" ? "（組手兵）" : "（強化）"),
    weight: ch.rule === "hundred" ? .55 : base.weight * 1.25,
    powerScale: base.powerScale * (ch.enemyPower || 1),
    damageScale: base.damageScale * (ch.enemyPower || 1)
  });
  e.stocks = 1;
  e.respawn();
  return e;
}

function startStoryBattle(i, fromCheckpoint = false) {
  const ch = STORY_CHAPTERS[i];
  const cp = fromCheckpoint ? getStoryCheckpoint(i) : 0;
  storyChapterIndex = i;
  netMode = false;
  closeNet();
  tutorialActive = false;
  trainingMode = false;

  else loadStage(ch.stage);
  const p1 = new Player(260, getStoryFighterIndex(), 0, false, false, 1, false);
  p1.stocks = ch.playerStocks || 1;
  players = [p1, makeStoryOpponent(ch, 640)];
  Player.updateColors(players);
  for (const player of players) player.prepareForCountdown();
  players[1].damage = ch.enemyStartDamage || 0;
  effects = [];
  projectiles = [];
  camX = 0; camY = 0;
  cameraShake = 0;
  hitZoom = null;
  countdownFrame = 0;
  storyBattle = { serial: ++storySceneUid, chapter: i, rule: ch.rule, goal: ch.goal || 1, kos: 0, spawned: 0, objective: ch.objective, title: ch.title, bossHP: STORY_BOSS_HP, bossDamage: 0, lastBossDamage: 0, cpFlash: 0, resumedFrom: cp };
  if (cp) {
    if (ch.rule === "boss") storyBattle.bossDamage = cp;
    else { storyBattle.kos = cp; storyBattle.spawned = cp; }
    storyBattle.objective = `${ch.objective}　【チェックポイントから再開：${describeStoryCheckpoint(i, cp)}】`;
  }
  storyCrowd = [];
  if (ch.rule === "hundred") {
    spawnStoryWave(ch, true);
    players[1] = storyCrowd[0];
  }
  screen = "fight";
}

// 100人組手：一度に3〜4人の組手兵が押し寄せる
function spawnStoryWave(ch, atStart = false) {
  const sb = storyBattle;
  const remaining = sb.goal - sb.spawned;
  if (remaining <= 0) return;
  const count = Math.min(remaining, 3 + (Math.random() < .5 ? 1 : 0));
  const px = players[0] ? players[0].x + players[0].w / 2 : VIEW_W / 2;
  const slots = [170, 300, 600, 730, 450].filter(x => Math.abs(x - px) > 90);
  if (!slots.length) slots.push(VIEW_W / 2);
  for (let k = 0; k < count; k++) {
    const x = slots[k % slots.length] + (Math.random() - .5) * 40;
    const e = makeStoryOpponent(ch, x);
    e.storyTeam = "enemy";
    e.damage = ch.enemyStartDamage || 0;
    if (atStart) e.prepareForCountdown();
    else e.invincible = 40;
    storyCrowd.push(e);
  }
  sb.spawned += count;
  sb.wave = (sb.wave || 0) + 1;
  if (!atStart) { uiNotice = `組手兵が ${count} 人あらわれた！`; uiNoticeTimer = 90; }
}

function nearestStoryEnemy() {
  const p = players[0];
  let best = null, bestD = Infinity;
  for (const e of storyCrowd) {
    if (!e.alive) continue;
    const d = Math.abs((e.x + e.w / 2) - (p.x + p.w / 2)) + Math.abs((e.y + e.h / 2) - (p.y + p.h / 2)) * .6;
    if (d < bestD) { bestD = d; best = e; }
  }
  return best;
}

// 1つの攻撃が近くの組手兵全員に当たるようにする（主ターゲット以外への判定）
function hitStoryCrowdExtras(attacker, mainTarget) {
  const others = storyCrowd.filter(e => e !== mainTarget && e.alive);
  if (!others.length) return;
  let box = null, stats = null, tag = null;
  if (attacker.attackType) {
    const st = getMoveStats(attacker.fighter, attacker.attackType);
    box = st.projectileOnly ? null : attacker.getHitbox();
    if (box) { stats = Object.assign({}, st, { direction: attacker.attackType === "airBack" ? -attacker.attackFacing : attacker.attackFacing }); tag = "a" + attacker.attackSerial; }
  }
  if (!box && attacker.special && !attacker.special.data.grab && !attacker.special.data.projectile) {
    box = attacker.getSpecialHitbox(false);
    if (box) {
      const d = attacker.special.data, mul = attacker.special.powerMul || 1;
      stats = { damage: d.damage * mul, kbBase: d.kbBase * mul, kbScale: d.kbScale * mul, maxKnockback: d.maxKnockback * mul, verticalScale: d.verticalScale, horizontalScale: d.horizontalScale, vySign: d.vySign ?? -1, strongEffect: d.strongEffect, special: true };
      tag = "s" + attacker.special.serial;
    }
  }
  if (!box) return;
  for (const e of others) {
    if (e._crowdHitTag === tag || e.invincible > 0 || e.dodgeInvincible > 0) continue;
    if (!rectOverlap(box, e.getBody())) continue;
    e._crowdHitTag = tag;
    const dir = stats.direction ?? ((e.x + e.w / 2) >= (attacker.x + attacker.w / 2) ? 1 : -1);
    applyHit(attacker, e, box, Object.assign({}, stats, { direction: dir }));
  }
}

function updateStoryCrowdFrame() {
  const p = players[0];
  if (!storyCrowd.length || !p || !p.alive) return;
  let target = players[1];
  if (!target || !target.alive || storyCrowd.indexOf(target) < 0 || (!p.attackType && !p.special)) target = nearestStoryEnemy() || target;
  if (target) players[1] = target;
  p.update(input, players[1]);
  hitStoryCrowdExtras(p, players[1]);
  for (const e of storyCrowd) e.update(createCPUInput(e, p), p);
  updateProjectiles([p].concat(storyCrowd));
}

function updateStoryBattle() {
  const sb = storyBattle;
  if (!sb) return;
  const ch = STORY_CHAPTERS[sb.chapter];
  const p = players[0], e = players[1];
  if (!p.alive) { endStoryBattle(false, "力尽きた……"); return; }
  if (sb.rule === "boss") {
    if (e.damage > sb.lastBossDamage) sb.bossDamage += e.damage - sb.lastBossDamage;
    sb.lastBossDamage = e.damage;
    if (e.stocks < 99) e.stocks = 99;
    if (sb.bossDamage >= sb.bossHP) { endStoryBattle(true); return; }
    checkStoryCheckpoint(sb);
    return;
  }
  if (sb.rule === "hundred") {
    const before = storyCrowd.length;
    storyCrowd = storyCrowd.filter(x => x.alive);
    sb.kos += before - storyCrowd.length;
    if (sb.kos >= sb.goal) { endStoryBattle(true); return; }
    checkStoryCheckpoint(sb);
    if (!storyCrowd.length) spawnStoryWave(ch);
    if (!players[1] || !players[1].alive) players[1] = nearestStoryEnemy() || players[1];
    return;
  }
  if (!e.alive) {
    sb.kos++;
    if (sb.kos >= sb.goal) { endStoryBattle(true); return; }
    checkStoryCheckpoint(sb);
    const spawnX = p.x + p.w / 2 < VIEW_W / 2 ? 640 : 260;
    const next = makeStoryOpponent(ch, spawnX);
    next.invincible = 30;
    next.damage = ch.enemyStartDamage || 0;
    players[1] = next;
    Player.updateColors(players);
  }
}

function endStoryBattle(win, reason = "") {
  const sb = storyBattle;
  storyResultState = { serial: ++storySceneUid, win, chapter: sb ? sb.chapter : storyChapterIndex, kos: sb ? sb.kos : 0, goal: sb ? sb.goal : 0, rule: sb ? sb.rule : "", bossLeft: sb ? Math.max(0, sb.bossHP - sb.bossDamage) : 0, reason, frame: 0 };
  storyBattle = null;
  storyCrowd = [];
  screen = "storyResult";
  playSfx(win ? "chargeMax" : "ko", 1);
}

// 話が終わった瞬間（キー/クリック直後＝ユーザー操作の直後）に新しいタブでゲームを開く
function tryOpenDimensionGame(url) {
  if (typeof window === "undefined" || typeof window.open !== "function") return false;
  let w = null;
  try { w = window.open(url, "_blank"); } catch (e) { w = null; }
  if (!w) return false;
  try { w.opener = null; } catch (e) {}
  return true;
}

function openStoryLink(i, autoOpen = false, miniCleared = false) {
  const ch = STORY_CHAPTERS[i];
  storyChapterIndex = i;
  screen = "storyLink";
  storyLinkOpened = false;
  for (const k of Object.keys(input)) { if (k !== "pressed") input[k] = false; }
  if (!storyLinkModal) return;
  const hasUrl = !!(ch.game.url && /^https?:\/\//i.test(ch.game.url));
  storyLinkChapter.textContent = ch.title;
  storyLinkTitle.textContent = `${ch.game.name}「${ch.game.title}」`;
  storyLinkDesc.textContent = miniCleared
    ? `マネブラの中で「${ch.game.title}」の一部をクリアした！ 次の次元への道がひらけた。本編のゲームも遊んでみよう。`
    : "この次元では神の力が使えない。堕天使りかちゃんの気配が残るこのゲームをクリアして、次の次元への道をひらこう！";
  if (hasUrl) {
    storyLinkOpen.href = ch.game.url;
    storyLinkOpen.style.display = "inline-flex";
    storyLinkOpen.textContent = "この次元のゲームへ行く ↗";
    storyLinkNote.textContent = "ボタンを押すと新しいタブでゲームが開きます。クリアしたらこのタブに戻ってきてください。";

    storyLinkClear.textContent = "クリアして戻ってきた！";
    if (miniCleared) {
      storyLinkClear.disabled = false;
      storyLinkClear.textContent = "次の次元へ進む";
    }
    if (autoOpen) {
      if (tryOpenDimensionGame(ch.game.url)) {
        storyLinkOpened = true;
        storyLinkClear.disabled = false;
        storyLinkOpen.textContent = "もう一度開く ↗";
        storyLinkNote.textContent = miniCleared
          ? `別のタブで本編「${ch.game.title}」を開きました。遊び終わったら戻って「次の次元へ進む」を押してください。`
          : `別のタブで「${ch.game.title}」を開きました。クリアしたらこのタブに戻って「クリアして戻ってきた！」を押してください。`;
      } else {
        storyLinkNote.textContent = miniCleared

    storyLinkClear.textContent = "次へ進む";

  storyLinkModal.style.display = "flex";
}

const STORY_PAGE_THEMES = {

  story: { h1: "大出費MoneyBrothersSP ― ストーリー：堕天の次元", doc: "ストーリー｜大出費MoneyBrothersSP" },

};

function setPageText(el, text) { if (el && el.textContent !== text) el.textContent = text; }

function appendStoryLog(kind, speaker, text) {
  if (!storyPageLog || typeof document.createElement !== "function") return;
  const row = document.createElement("div");
  row.className = kind === "head" ? "log-head" : (kind === "system" ? "log-system" : (kind === "fallen" ? "log-fallen" : "log-line"));
  if (speaker) {
    const sp = document.createElement("span");
    sp.className = "log-speaker";
    sp.textContent = speaker;
    row.appendChild(sp);
  }
  const tx = document.createElement("span");
  tx.textContent = text;
  row.appendChild(tx);
  storyPageLog.appendChild(row);
  while (storyPageLog.childElementCount > 120 && storyPageLog.firstChild) storyPageLog.removeChild(storyPageLog.firstChild);
  storyPageLog.scrollTop = storyPageLog.scrollHeight;
}

function ensureFeathers() {
  if (!storyFeathers || storyFeathers.childElementCount || typeof document.createElement !== "function") return;
  for (let i = 0; i < 16; i++) {
    const f = document.createElement("span");
    f.style.left = `${(i * 6.3 + 3) % 100}%`;
    f.style.animationDuration = `${7 + (i % 5) * 1.7}s`;
    f.style.animationDelay = `${-(i * 1.3)}s`;
    storyFeathers.appendChild(f);
  }
}

function syncStoryPage() {
  const inStory = !!storyBattle || ["storyMenu", "storyScene", "storyLink", "storyResult", "storyMini"].includes(screen);
  let theme = "";
  let ch = null;
  if (inStory) {
    theme = "story";
    const chIdx = storyBattle ? storyBattle.chapter : (screen === "storyResult" && storyResultState ? storyResultState.chapter : storyChapterIndex);
    ch = screen === "storyMenu" ? null : STORY_CHAPTERS[chIdx];
    const line = screen === "storyScene" && storyScene ? storyScene.lines[storyScene.index] : null;
    const fallenLine = !!(line && (line.s === "堕天使りかちゃん" || line.s === "？？？"));
    const inDimension = !!(ch && ch.type === "link" && (screen === "storyLink" || screen === "storyScene" || screen === "storyMini"));
    const boss = !!(ch && ch.rule === "boss" && (storyBattle || screen === "storyResult"));
    if (boss) theme = "boss";
    else if (fallenLine || inDimension) theme = "fallen";
  }
  if (theme !== storyPageTheme) {
    storyPageTheme = theme;
    const t = STORY_PAGE_THEMES[theme];
    setPageText(pageTitleEl, t.h1);
    if (document.title !== t.doc) document.title = t.doc;
    if (document.body && document.body.classList) {
      document.body.classList.toggle("story-page", inStory);
      document.body.classList.toggle("story-fallen", theme === "fallen");
      document.body.classList.toggle("story-boss", theme === "boss");
    }
    if (storyPageBanner) storyPageBanner.hidden = !inStory;
    if (storyPagePanel) storyPagePanel.hidden = !inStory;
    if (theme === "fallen" || theme === "boss") ensureFeathers();
  }
  if (!inStory) return;

  // 章の地図
  const mapKey = STORY_CHAPTERS.map((c, i) => (storyCleared.has(c.id) ? "c" : (isStoryChapterUnlocked(i) ? "o" : "l"))).join("") + "|" + (ch ? ch.id : "");
  if (mapKey !== storyPageMapKey && storyPageMap && typeof document.createElement === "function") {
    storyPageMapKey = mapKey;
    while (storyPageMap.firstChild) storyPageMap.removeChild(storyPageMap.firstChild);
    STORY_CHAPTERS.forEach((c, i) => {
      const li = document.createElement("li");
      const cleared = storyCleared.has(c.id), open = isStoryChapterUnlocked(i);
      li.className = (cleared ? "cleared " : "") + (ch && ch.id === c.id ? "current" : "");
      li.textContent = (cleared ? "✔ " : (open ? "▶ " : "🔒 ")) + (open ? c.title : "？？？");
      storyPageMap.appendChild(li);
    });
  }

  // ページ上部の章表示
  const bannerText = ch ? (storyBattle ? `${ch.title}　―　${storyBattle.objective || ""}` : ch.title) : "ストーリー：堕天の次元";
  if (bannerText !== storyPageBannerKey) { storyPageBannerKey = bannerText; setPageText(storyPageChapter, bannerText); }

  // ボスのHPはページ上にも表示
  const bossFight = !!(storyBattle && storyBattle.rule === "boss");
  if (storyPageHp) storyPageHp.hidden = !bossFight;
  if (bossFight) {
    const hp = Math.max(0, storyBattle.bossHP - storyBattle.bossDamage);
    setPageText(storyPageHpText, `堕天使りかちゃん　HP ${Math.ceil(hp)} / ${storyBattle.bossHP}`);
    if (storyPageHpFill) {
      const w = `${Math.max(0, Math.min(100, hp / storyBattle.bossHP * 100)).toFixed(1)}%`;
      if (storyPageHpFill.style.width !== w) storyPageHpFill.style.width = w;
    }
  }

  // ストーリーの記録（読んだ台詞がページに残る）
  let logKey = "";
  if (screen === "storyScene" && storyScene) logKey = `scene:${storyScene.uid}:${storyScene.index}`;
  else if (screen === "storyResult" && storyResultState) logKey = `result:${storyResultState.chapter}:${storyResultState.win}:${storyResultState.serial}`;
  else if (storyBattle) logKey = `battle:${storyBattle.chapter}:${storyBattle.serial}`;
  if (logKey && logKey !== storyPageLogKey) {
    storyPageLogKey = logKey;
    if (screen === "storyScene") {
      if (storyScene.index === 0 && storyScene.title) appendStoryLog("head", "", storyScene.title);
      const line = storyScene.lines[storyScene.index];
      const fallen = line.s === "堕天使りかちゃん" || line.s === "？？？";
      appendStoryLog(fallen ? "fallen" : "line", line.s, line.t);
    } else if (screen === "storyResult") {
      appendStoryLog("system", "", `${STORY_CHAPTERS[storyResultState.chapter].title}：${storyResultState.win ? "クリア！" : "GAME OVER"}`);
    } else if (storyBattle) {
      appendStoryLog("system", "", `${storyBattle.title} 開始 ― ${storyBattle.objective || ""}`);
    }
  }
}

// ---------- 入力 ----------
function getStoryRowRect(i) {
  const step = Math.min(36, Math.floor(300 / Math.max(1, STORY_CHAPTERS.length)));
  return { x: 150, y: 166 + i * step, w: 600, h: step - 4 };
}
function getStoryFighterRect() { return { x: 250, y: 92, w: 400, h: 62 }; }
function getStoryRestartRect() { return { x: 672, y: 104, w: 168, h: 38 }; }

// チェックポイントがある章は「途中から」、ない章は最初から
function startStoryFromMenu(i, fromStart = false) {
  if (!fromStart && getStoryCheckpoint(i)) { startStoryBattle(i, true); return; }
  if (fromStart) clearStoryCheckpoint(i);
  startStoryChapter(i);
}

function updateStoryMenu() {
  if (input.pressed["x"] || input.pressed["Backspace"] || (mouseClick && mouseClick.x >= 24 && mouseClick.x <= 148 && mouseClick.y >= 20 && mouseClick.y <= 54)) {
    screen = "title"; return;
  }
  const move = dir => {
    let c = storyCursor;
    for (let k = 0; k < STORY_CHAPTERS.length; k++) {
      c = (c + dir + STORY_CHAPTERS.length) % STORY_CHAPTERS.length;
      if (isStoryChapterUnlocked(c)) { storyCursor = c; return; }
    }
  };
  if (input.pressed["w"] || input.pressed["ArrowUp"]) move(-1);
  if (input.pressed["s"] || input.pressed["ArrowDown"]) move(1);
  if (mouseClick) {
    if (getStoryCheckpoint(storyCursor) && pointInRect(mouseClick, getStoryRestartRect())) { startStoryFromMenu(storyCursor, true); return; }
    for (let i = 0; i < STORY_CHAPTERS.length; i++) {
      if (pointInRect(mouseClick, getStoryRowRect(i)) && isStoryChapterUnlocked(i)) { storyCursor = i; startStoryFromMenu(i); return; }
    }
  }
  if (input.pressed["c"] && isStoryChapterUnlocked(storyCursor) && getStoryCheckpoint(storyCursor)) { startStoryFromMenu(storyCursor, true); return; }
  if (input.pressed["z"] || input.pressed["Enter"] || input.pressed["Space"]) {
    if (isStoryChapterUnlocked(storyCursor)) startStoryFromMenu(storyCursor);
  }
}

function updateStoryScene() {
  const sc = storyScene;
  if (!sc) { openStoryMenu(); return; }
  sc.frame++;
  if (input.pressed["x"]) { openStoryMenu(); storyCursor = storyChapterIndex; return; }
  const finish = () => { const done = sc.onDone; storyScene = null; if (done) done(); };
  if (input.pressed["Backspace"]) { finish(); return; }
  const advance = input.pressed["z"] || input.pressed["Enter"] || input.pressed["Space"] || !!mouseClick;
  if (advance && sc.frame > 8) {
    if (sc.index + 1 >= sc.lines.length) finish();
    else { sc.index++; sc.frame = 0; }
  }
}

function updateStoryResult() {
  const r = storyResultState;
  if (!r) { openStoryMenu(); return; }
  r.frame++;
  if (r.frame < 20) return;
  if (input.pressed["x"]) { openStoryMenu(); storyCursor = r.chapter; return; }
  if (!r.win && input.pressed["c"]) {
    storyResultState = null;
    clearStoryCheckpoint(r.chapter);
    startStoryBattle(r.chapter);
    return;
  }
  if (input.pressed["z"] || input.pressed["Enter"] || input.pressed["Space"] || mouseClick) {
    storyResultState = null;
    if (r.win) completeStoryChapter(r.chapter);
    else startStoryBattle(r.chapter, true);
  }
}

// ---------- 描画 ----------
function drawStoryBackdrop(t) {
  const g = ctx.createLinearGradient(0, 0, 0, VIEW_H);
  g.addColorStop(0, "#0c0718"); g.addColorStop(.6, "#22102f"); g.addColorStop(1, "#05030a");
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, VIEW_W, VIEW_H);
  for (let i = 0; i < 60; i++) {
    const x = (i * 149) % VIEW_W, y = (i * 83) % (VIEW_H - 120);
    ctx.globalAlpha = .25 + .55 * Math.abs(Math.sin(t * 1.3 + i));
    ctx.fillStyle = i % 4 === 0 ? "#ff8fbf" : "#dcd6ff";
    ctx.fillRect(x, y, 2, 2);
  }
  ctx.globalAlpha = 1;
  // 空の裂け目
  ctx.save();
  ctx.strokeStyle = "rgba(255, 79, 139, .35)";
  ctx.lineWidth = 3;
  ctx.beginPath();
  ctx.moveTo(610, 30); ctx.lineTo(640, 80); ctx.lineTo(620, 120); ctx.lineTo(660, 170); ctx.lineTo(645, 210);
  ctx.stroke();
  ctx.restore();
}

    const cpv = unlocked ? getStoryCheckpoint(i) : 0;
    if (cpv) {

  if (cpCursor) {

  ctx.restore();
}

function drawStoryScene() {

function drawStoryBattleBanner() {

// ===================== 別次元ミニゲーム（各ゲームの一部をマネブラの中でプレイ） =====================
// それぞれ元のゲームの核となる遊び（リズム／短剣ワープ／ダンドリ運搬／次元スリップ／タイピング弾幕）を短く遊べる形にしたもの。
const MINI_GAME_BY_DIMENSION = {
  "dimension-1": "bath",
  "dimension-2": "dagger",
  "dimension-3": "dandori",
  "dimension-4": "slip",
  "dimension-5": "typing"
};
const MINI_INFO = {
  bath: { title: "風呂アンドMoney ― お風呂場ステージ", goal: "落ちてくる湯玉を D F J K でたたこう！ 命中率70%以上でクリア", keys: "D F J K（またはレーンをクリック）　Backspace：リタイア" },
  dagger: { title: "短剣ワープ ― DAGGER WARP", goal: "鉄鬼の背中の炉心を斬れ！ 45秒で8体撃破", keys: "←→ / A D：移動　SPACE：ジャンプ　Z：短剣ワープ（炉心をクリックでも可）" },
  dandori: { title: "ダンドリ・ラッシュ", goal: "仲間を投げてお宝を拠点へ！ 60秒で総価値300点", keys: "矢印 / WASD：移動　Z（またはお宝をクリック）：仲間を投げる　SPACE：笛" },
  slip: { title: "次元スリップ ― DIMENSION SLIP", goal: "ネオン回路を40秒走りきれ！（ライフ3）", keys: "←→ / A D：レーン移動　SPACE：ジャンプ　SHIFT / S 長押し：2D化（スリットを抜ける）" },
  typing: { title: "TYPE弾幕 ― 放課後弾幕詠唱", goal: "言葉を詠唱（タイピング）して会計魔女・帳簿ミコを倒せ！", keys: "ローマ字入力：攻撃　矢印キー：移動（弾は消えない）　Backspace：リタイア" }
};
let miniGame = null;

function startMiniGame(chapterIndex) {
  const ch = STORY_CHAPTERS[chapterIndex];
  const kind = MINI_GAME_BY_DIMENSION[ch.game.id] || "bath";
  storyChapterIndex = chapterIndex;
  hideStoryLink();
  miniGame = { kind, chapter: chapterIndex, frame: 0, intro: 120, result: null, flash: 0, msg: "", msgTimer: 0 };
  if (kind === "bath") initBathMini(miniGame);
  else if (kind === "dagger") initDaggerMini(miniGame);
  else if (kind === "dandori") initDandoriMini(miniGame);
  else if (kind === "slip") initSlipMini(miniGame);
  else initTypingMini(miniGame);
  for (const k of Object.keys(input)) { if (k !== "pressed") input[k] = false; }
  screen = "storyMini";
}

function miniMessage(m, text, frames = 70) { m.msg = text; m.msgTimer = frames; }

function endMiniGame(win, detail = "") {
  if (!miniGame || miniGame.result) return;
  miniGame.result = { win, detail, frame: 0 };
  playSfx(win ? "chargeMax" : "ko", 1);
}

function updateMiniGame() {
  const m = miniGame;
  if (!m) { openStoryMenu(); return; }
  if (m.result) {
    m.result.frame++;
    if (m.result.frame < 20) return;
    if (input.pressed["x"]) { miniGame = null; openStoryMenu(); storyCursor = m.chapter; return; }
    if (input.pressed["z"] || input.pressed["Enter"] || input.pressed["Space"] || mouseClick) {
      if (m.result.win) { miniGame = null; openStoryLink(m.chapter, true, true); }
      else startMiniGame(m.chapter);
    }
    return;
  }
  if (input.pressed["Backspace"]) { endMiniGame(false, "リタイア"); return; }
  if (m.intro > 0) {
    m.intro--;
    if (input.pressed["z"] || input.pressed["Enter"] || mouseClick) m.intro = 0;
    return;
  }
  m.frame++;
  if (m.msgTimer > 0) m.msgTimer--;
  if (m.flash > 0) m.flash--;
  if (m.kind === "bath") updateBathMini(m);
  else if (m.kind === "dagger") updateDaggerMini(m);
  else if (m.kind === "dandori") updateDandoriMini(m);
  else if (m.kind === "slip") updateSlipMini(m);
  else updateTypingMini(m);
}

function drawMiniGame() {
  const m = miniGame;
  if (!m) return;
  ctx.save();
  if (m.kind === "bath") drawBathMini(m);
  else if (m.kind === "dagger") drawDaggerMini(m);
  else if (m.kind === "dandori") drawDandoriMini(m);
  else if (m.kind === "slip") drawSlipMini(m);
  else drawTypingMini(m);
  ctx.restore();
  const info = MINI_INFO[m.kind];
  ctx.save();

// ---------- 1) 風呂アンドMoney：4レーンのリズム ----------
const BATH_LANE_KEYS = ["d", "f", "j", "k"];

function bathLaneX(i) { return 270 + i * 90; }
function initBathMini(m) {
  const notes = [];
  const pattern = [0, 1, 2, 3, 3, 2, 1, 0, 0, 2, 1, 3, 1, 3, 0, 2];
  let t = 60;
  for (let i = 0; i < 44; i++) {
    const lane = (pattern[i % pattern.length] + Math.floor(i / 16)) % 4;
    notes.push({ lane, time: t, hit: null });
    if (i % 8 === 7) { notes.push({ lane: (lane + 2) % 4, time: t, hit: null }); }
    t += i % 4 === 3 ? 30 : 22;

function bathHitLane(m, lane) {

  }
  if (!best || bestD > 12) return;

}
function updateBathMini(m) {

  if (mouseClick && mouseClick.y > 120) {

  }
  for (const n of m.notes) {
    if (!n.hit && m.frame - n.time > 12) { n.hit = "MISS"; m.miss++; m.combo = 0; m.judge.push({ text: "MISS", lane: n.lane, life: 30 }); }
  }
  for (const j of m.judge) j.life--;
  m.judge = m.judge.filter(j => j.life > 0);
  for (let i = 0; i < 4; i++) if (m.laneFlash[i] > 0) m.laneFlash[i]--;
  if (m.frame >= m.endTime) {
    const acc = (m.perfect + m.good) / m.notes.length;
    const detail = `命中率 ${(acc * 100).toFixed(0)}%（PERFECT ${m.perfect} / GOOD ${m.good} / MISS ${m.miss}）最大コンボ ${m.maxCombo}`;

}
function drawBathMini(m) {

  ctx.fillStyle = "#fff"; ctx.font = "bold 24px sans-serif"; ctx.textAlign = "center";
  ctx.fillText("ゆ", 120, 72); ctx.fillText("ゆ", VIEW_W - 120, 72);
  ctx.fillStyle = "#5fb3d6"; ctx.fillRect(0, VIEW_H - 50, VIEW_W, 50);

  ctx.fillStyle = "#ffd23f"; ctx.beginPath(); ctx.ellipse(120, VIEW_H - 50 + bob, 26, 16, 0, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.arc(140, VIEW_H - 66 + bob, 12, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = "#ff8a00"; ctx.beginPath(); ctx.moveTo(150, VIEW_H - 66 + bob); ctx.lineTo(162, VIEW_H - 63 + bob); ctx.lineTo(150, VIEW_H - 60 + bob); ctx.fill();
  // レーン

  drawMiniBar(660, 116, 220, Math.min(1, m.frame / m.endTime), "#e85a4f", "曲の進行");
}

// ---------- 2) 短剣ワープ：背中の炉心を斬る ----------
const DAGGER_GROUND = 430;
function initDaggerMini(m) {

function spawnDaggerOgre(m) {

  m.ogres.push({ x, w: 70, h: 96, facing: -side, turnTimer: 60 + Math.random() * 80, speed: .7 + Math.random() * .5, dead: 0 });

function daggerCore(o) { return { x: o.x - o.facing * (o.w / 2 - 6), y: DAGGER_GROUND - o.h * .62, r: 12 }; }

}
function updateDaggerMini(m) {

  const left = input["ArrowLeft"] || input["a"], right = input["ArrowRight"] || input["d"];

  }

  if (m.py >= DAGGER_GROUND) { m.py = DAGGER_GROUND; m.vy = 0; m.onGround = true; }

  if (m.stun <= 0) {
    if (mouseClick) {

        const c = daggerCore(o);
        if (Math.hypot(mouseClick.x - c.x, mouseClick.y - c.y) < 26) { daggerWarpTo(m, o, true); break; }
        if (Math.abs(mouseClick.x - o.x) < o.w / 2 && mouseClick.y > DAGGER_GROUND - o.h) { daggerWarpTo(m, o, false); break; }
      }
    } else if (input.pressed["z"] && alive.length) {
      const target = alive.slice().sort((a, b) => Math.abs(a.x - m.px) - Math.abs(b.x - m.px))[0];

function drawDaggerMini(m) {

// ---------- 3) ダンドリ・ラッシュ：仲間を投げてお宝を運ぶ ----------
const DANDORI_BASE = { x: 450, y: 440 };
const DANDORI_ITEMS = [
  { name: "チビペレット", weight: 1, value: 10, color: "#ff5a5a" }, { name: "ペレット", weight: 3, value: 30, color: "#ffd23f" },
  { name: "歯車時計", weight: 5, value: 60, color: "#c9a26b" }, { name: "巨大イチゴ", weight: 8, value: 80, color: "#ff3b6b" },
  { name: "王者のフタ", weight: 10, value: 120, color: "#9fb0c8" }, { name: "エンペラー王冠", weight: 14, value: 200, color: "#ffcf4a" }

function initDandoriMini(m) {
  const items = [];
  const spots = [[150, 150], [300, 110], [600, 120], [760, 170], [180, 300], [720, 300], [450, 200], [380, 320], [560, 290]];
  spots.forEach(([x, y], i) => { const d = DANDORI_ITEMS[[0, 1, 2, 3, 1, 4, 5, 0, 2][i]]; items.push(Object.assign({ x, y, carriers: 0, delivered: false }, d)); });
  Object.assign(m, { lx: 450, ly: 380, squad: 12, score: 0, goal: 300, time: 60 * 60, items, throwCd: 0, pops: [] });
}
function dandoriNearest(m) {
  let best = null, bd = 130;
  for (const it of m.items) { if (it.delivered) continue; const d = Math.hypot(it.x - m.lx, it.y - m.ly); if (d < bd) { bd = d; best = it; } }

}
function updateDandoriMini(m) {
  m.time--;

  if (input["ArrowLeft"] || input["a"]) m.lx -= sp;
  if (input["ArrowRight"] || input["d"]) m.lx += sp;

  let target = null;
  if (mouseClick) {
    for (const it of m.items) if (!it.delivered && Math.hypot(it.x - mouseClick.x, it.y - mouseClick.y) < 34) target = it;
    if (target && Math.hypot(target.x - m.lx, target.y - m.ly) > 220) { miniMessage(m, "遠すぎる！ もう少し近づこう", 40); target = null; }
  } else if (input["z"] && m.throwCd <= 0) target = dandoriNearest(m);

    m.squad--; target.carriers++; m.throwCd = 5;

  } else if (input.pressed["z"] && m.squad <= 0) miniMessage(m, "仲間がいない！ SPACE の笛で呼び戻そう", 50);
  if (input.pressed["Space"]) {
    let back = 0;
    for (const it of m.items) if (!it.delivered && it.carriers < it.weight && it.carriers > 0) { back += it.carriers; it.carriers = 0; }
    if (back) { m.squad += back; miniMessage(m, `笛で ${back} 匹を呼び戻した！`, 45); }
  }
  for (const it of m.items) {
    if (it.delivered || it.carriers < it.weight) continue;
    const dx = DANDORI_BASE.x - it.x, dy = DANDORI_BASE.y - it.y, d = Math.hypot(dx, dy);
    const speed = 1.1 + Math.min(1.2, it.carriers / 10);
    if (d < 18) {
      it.delivered = true; m.score += it.value; m.squad += it.carriers + Math.ceil(it.value / 20);
      miniMessage(m, `${it.name} を回収！ +${it.value}点／仲間+${Math.ceil(it.value / 20)}`, 55);
      playSfx("chargeMax", .5);
    } else { it.x += dx / d * speed; it.y += dy / d * speed; }
  }
  for (const p of m.pops) p.life--;
  m.pops = m.pops.filter(p => p.life > 0);
  if (m.score >= m.goal) endMiniGame(true, `総価値 ${m.score} 点！ 見事な采配！`);
  else if (m.time <= 0) endMiniGame(false, `時間切れ（総価値 ${m.score} / ${m.goal} 点）`);
  else if (m.items.every(it => it.delivered)) endMiniGame(m.score >= m.goal, `お宝を回収しきった（${m.score} 点）`);

function drawDandoriMini(m) {
  ctx.fillStyle = "#5f8f3e"; ctx.fillRect(0, 0, VIEW_W, VIEW_H);
  ctx.fillStyle = "rgba(255,255,255,.06)"; for (let i = 0; i < 40; i++) ctx.fillRect((i * 97) % VIEW_W, (i * 53) % VIEW_H, 30, 8);
  ctx.fillStyle = "#c0392b"; ctx.beginPath(); ctx.ellipse(DANDORI_BASE.x, DANDORI_BASE.y, 44, 26, 0, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = "#fff"; ctx.font = "bold 12px sans-serif"; ctx.textAlign = "center"; ctx.fillText("拠点", DANDORI_BASE.x, DANDORI_BASE.y + 4);

function slipLaneX(i) { return 330 + i * 120; }

function updateSlipMini(m) {

const TYPING_WORDS = [
  ["ほうかご", ["ho", "u", "ka", "go"]], ["しゅくだい", ["shu", "ku", "da", "i"]], ["よさん", ["yo", "sa", "n"]],
  ["ぶひ", ["bu", "hi"]], ["ぷりんと", ["pu", "ri", "n", "to"]], ["かいけい", ["ka", "i", "ke", "i"]],
  ["ちゃいむ", ["cha", "i", "mu"]], ["しんぶん", ["shi", "n", "bu", "n"]], ["れんらく", ["re", "n", "ra", "ku"]],
  ["てすと", ["te", "su", "to"]], ["ぶかつ", ["bu", "ka", "tsu"]], ["せいと", ["se", "i", "to"]],
  ["ちこく", ["chi", "ko", "ku"]], ["ぶちょう", ["bu", "cho", "u"]], ["たいかい", ["ta", "i", "ka", "i"]],
  ["なかま", ["na", "ka", "ma"]], ["じゅんび", ["ju", "n", "bi"]], ["けいさん", ["ke", "i", "sa", "n"]],
  ["ぼうけん", ["bo", "u", "ke", "n"]], ["しあい", ["shi", "a", "i"]], ["よてい", ["yo", "te", "i"]]
];
const TYPING_ALTS = {
  shi: ["shi", "si", "ci"], chi: ["chi", "ti"], tsu: ["tsu", "tu"], shu: ["shu", "syu"], cho: ["cho", "tyo", "cyo"],
  cha: ["cha", "tya", "cya"], ju: ["ju", "jyu", "zyu"], fu: ["fu", "hu"], n: ["nn", "n", "xn"]
};
function typingAlts(token) { return TYPING_ALTS[token] || [token]; }
function typingDisplayRomaji(tokens) { return tokens.join(""); }
function initTypingMini(m) {
  Object.assign(m, { sx: 450, sy: 400, lives: 3, inv: 0, bossHP: 100, bossMax: 100, bullets: [], word: null, tokenIdx: 0, tokenTyped: "", typedShown: "", phase: 0, pattern: 0, shots: [], misses: 0, words: 0, order: TYPING_WORDS.map((_, i) => i).sort(() => Math.random() - .5), orderIdx: 0 });
  nextTypingWord(m);
}
function nextTypingWord(m) {
  const w = TYPING_WORDS[m.order[m.orderIdx % m.order.length]];
  m.orderIdx++;
  m.word = { kana: w[0], tokens: w[1] };
  m.tokenIdx = 0; m.tokenTyped = ""; m.typedShown = "";
}
function typingKey(m, key) {
  const tokens = m.word.tokens;
  let tries = 0;
  while (tries++ < 2) {
    const tok = tokens[m.tokenIdx];
    const alts = typingAlts(tok);
    const cand = m.tokenTyped + key;
    if (alts.some(a => a.startsWith(cand))) {
      m.tokenTyped = cand; m.typedShown += key;
      const exact = alts.includes(cand);
      const longer = alts.some(a => a.length > cand.length && a.startsWith(cand));
      if (exact && (!longer || m.tokenIdx === tokens.length - 1)) {
        m.tokenIdx++; m.tokenTyped = "";
        if (m.tokenIdx >= tokens.length) { completeTypingWord(m); }
      }
      return true;
    }
    // 「n」1文字で「ん」が確定していて、次の文字が別の音のときは、ここで「ん」を確定して次の音として読む
    if (alts.includes(m.tokenTyped) && m.tokenTyped) {
      m.tokenIdx++; m.tokenTyped = "";
      if (m.tokenIdx >= tokens.length) { completeTypingWord(m); return false; }
      continue;
    }
    break;
  }
  m.misses++;
  m.flash = 4;
  return false;
}
function completeTypingWord(m) {
  const dmg = 8 + m.word.kana.length * 2;
  m.bossHP = Math.max(0, m.bossHP - dmg);
  m.words++;
  m.shots.push({ x: m.sx, y: m.sy, life: 18, text: m.word.kana });
  miniMessage(m, `詠唱「${m.word.kana}」！ ${dmg}ダメージ`, 40);
  playSfx("smash", .7);
  nextTypingWord(m);
}
function updateTypingMini(m) {
  if (m.inv > 0) m.inv--;
  for (const k of Object.keys(input.pressed)) if (/^[a-z]$/.test(k)) typingKey(m, k);
  const sp = 3.6;
  if (input["ArrowLeft"]) m.sx -= sp;
  if (input["ArrowRight"]) m.sx += sp;
  if (input["ArrowUp"]) m.sy -= sp;
  if (input["ArrowDown"]) m.sy += sp;
  m.sx = Math.max(240, Math.min(660, m.sx)); m.sy = Math.max(220, Math.min(460, m.sy));
  // ボスの弾幕（弾は消えない）
  const bx = 450 + Math.sin(m.frame / 70) * 120, by = 110;
  m.bossX = bx;
  const rage = 1 - m.bossHP / m.bossMax;
  if (m.frame % Math.max(26, 46 - Math.floor(rage * 20)) === 0) {
    const n = 10 + Math.floor(rage * 8), off = m.frame / 30;
    for (let i = 0; i < n; i++) { const a = off + i / n * Math.PI * 2; m.bullets.push({ x: bx, y: by, vx: Math.cos(a) * 1.9, vy: Math.sin(a) * 1.9 + .5, r: 6, c: "#ff6fb5" }); }
  }
  if (m.frame % 70 === 35) {
    const a = Math.atan2(m.sy - by, m.sx - bx);
    for (let k = -1; k <= 1; k++) m.bullets.push({ x: bx, y: by, vx: Math.cos(a + k * .18) * 3.2, vy: Math.sin(a + k * .18) * 3.2, r: 5, c: "#ffe17a" });
  }
  for (const b of m.bullets) { b.x += b.vx; b.y += b.vy; }
  m.bullets = m.bullets.filter(b => b.x > 200 && b.x < 700 && b.y > 40 && b.y < VIEW_H + 10);
  if (m.inv <= 0) {
    for (const b of m.bullets) {

        m.lives--; m.inv = 80; m.flash = 10;
        miniMessage(m, `被弾！ 残りライフ ${m.lives}`, 50);
        playSfx("hit", 1);
        break;
      }
    }
  }
  for (const s of m.shots) s.life--;
  m.shots = m.shots.filter(s => s.life > 0);
  if (m.bossHP <= 0) endMiniGame(true, `会計魔女・帳簿ミコを撃破！ 詠唱 ${m.words} 語・ミスタイプ ${m.misses}`);
  else if (m.lives <= 0) endMiniGame(false, "弾幕に呑まれた……（矢印キーで避けながら詠唱しよう）");
}
function drawTypingMini(m) {

}

  const value = Number(achievementProfile.progress[stat]) || 0;
  for (const achievement of ACHIEVEMENTS) {
    if (achievement.stat === stat && value >= achievement.goal) unlockAchievement(achievement.id);
  }
}

function addAchievementProgress(stat, amount = 1, player = null) {
  if (tutorialActive || storyBattle) return;
  if (player && !isAchievementPlayer(player)) return;
  const value = (Number(achievementProfile.progress[stat]) || 0) + amount;
  achievementProfile.progress[stat] = value;
  checkAchievementProgress(stat);
  saveAchievementProfile();
}

function setAchievementProgress(stat, value, player = null) {
  if (tutorialActive || storyBattle) return;
  if (player && !isAchievementPlayer(player)) return;
  achievementProfile.progress[stat] = Math.max(0, value);
  checkAchievementProgress(stat);
  saveAchievementProfile();
}

function registerAchievementHit(attacker, target, damage, stats) {
  withAchievementSaveBatch(() => {
    if (isAchievementPlayer(target)) {
      addAchievementProgress("damageTaken", damage, target);
      // 進捗も記録して解除（再同期による救済対象にするため直接解除は使わない）
      if (target.damage >= 200) setAchievementProgress("reached200", 1, target);
    }
    if (!isAchievementPlayer(attacker)) return;
    addAchievementProgress("hits", 1, attacker);
    addAchievementProgress("damageDealt", damage, attacker);
    if (stats.projectile) addAchievementProgress("projectileHits", 1, attacker);
    if (stats.special) addAchievementProgress("specialHits", 1, attacker);
    if (stats.smash) addAchievementProgress("smashHits", 1, attacker);
    if (stats.isClean) addAchievementProgress("cleanHits", 1, attacker);
    if (stats.coinExplosion) addAchievementProgress("coinBlastHits", 1, attacker);
    if (stats.throw) addAchievementProgress("throws", 1, attacker);
    if (stats.smash && attacker.smashChargeScale > 1.001) addAchievementProgress("chargedSmashHits", 1, attacker);
    if (target.damage >= 100) addAchievementProgress("hitsAt100", 1, attacker);
    if (target.damage >= 200) addAchievementProgress("hitsAt200", 1, attacker);
  });
}

function resetEyebrowStreak(player) {
  if (!isAchievementPlayer(player) || !achievementProfile.progress.eyebrowStreak) return;
  setAchievementProgress("eyebrowStreak", 0, player);
}

function registerFighterUsed(player) {
  if (!isAchievementPlayer(player)) return;
  const name = player.fighter.name;
  // 隠しキャラ「りかちゃん」は通常13体コンプリートの判定には含めない
  if (!STANDARD_FIGHTER_NAMES.has(name)) return;
  if (!achievementProfile.fightersUsed.includes(name)) {
    achievementProfile.fightersUsed.push(name);
    setAchievementProgress("fightersUsed", achievementProfile.fightersUsed.length, player);
  }
  addAchievementProgress(`fighter:${name}`, 1, player);
}

function registerFighterWin(player) {
  if (!isAchievementPlayer(player)) return;
  const name = player.fighter.name;
  // The hidden unlock requires a separate victory with every standard fighter; Rika cannot unlock herself.
  if (!STANDARD_FIGHTER_NAMES.has(name)) return;
  if (!Array.isArray(achievementProfile.fightersWon)) achievementProfile.fightersWon = [];
  if (achievementProfile.fightersWon.includes(name)) return;
  achievementProfile.fightersWon.push(name);
  setAchievementProgress("fightersWon", achievementProfile.fightersWon.length, player);
}

function registerStageUsed(stageIndex) {
  if (stageIndex < 0 || stageIndex >= STAGES.length) return;
  const name = STAGES[stageIndex].name;
  if (!achievementProfile.stagesUsed.includes(name)) {
    achievementProfile.stagesUsed.push(name);
    setAchievementProgress("stagesUsed", achievementProfile.stagesUsed.length);
  }
}

function registerMatchStarted(wasRandomFighter, wasRandomStage) {
  const player = getLocalAchievementPlayer();
  if (!isAchievementPlayer(player)) return;
  withAchievementSaveBatch(() => {
    matchAchievementFinished = false;
    addAchievementProgress("matchesPlayed", 1, player);
    registerFighterUsed(player);
    registerStageUsed(STAGES.indexOf(currentStage));
    if (wasRandomFighter) addAchievementProgress("randomFighterMatches", 1, player);
    if (wasRandomStage) addAchievementProgress("randomStageMatches", 1, player);
    if (trainingMode) addAchievementProgress("trainingMatches", 1, player);
    if (netMode) addAchievementProgress("onlineMatches", 1, player);
  });
}

function finishMatchAchievements() {
  if (matchAchievementFinished || players.length < 2) return;
  matchAchievementFinished = true;
  const local = getLocalAchievementPlayer();
  if (!isAchievementPlayer(local)) return;
  withAchievementSaveBatch(() => {
    const opponent = players[1 - local.side];
    const won = local.alive && opponent && !opponent.alive;
    if (!won) {
      achievementProfile.winStreak = 0;
      setAchievementProgress("winStreak", 0, local);
      return;
    }
    addAchievementProgress("wins", 1, local);
    registerFighterWin(local);
    if (hasGodSpeed(local) && opponent && !opponent.isSandbag && !(opponent.fighter && opponent.fighter.isGod)) {
      const storyWasLocked = !isStoryUnlocked();
      addAchievementProgress("rikaWins", 1, local);
      if (storyWasLocked && isStoryUnlocked()) { uiNotice = "タイトルに新モード「ストーリー」が追加されました！"; uiNoticeTimer = 320; }
    }
    achievementProfile.winStreak++;
    setAchievementProgress("winStreak", achievementProfile.winStreak, local);
    if (local.damage <= 0) addAchievementProgress("noDamageWins", 1, local);
    if (local.damage >= 200) addAchievementProgress("winsAt200", 1, local);
    if (opponent.isCPU && opponent.cpuLevel >= 3) addAchievementProgress("cpuLevel3Wins", 1, local);
  });
}

function recordLedgeRecovery(player) {
  if (isAchievementPlayer(player)) addAchievementProgress("ledgeRecoveries", 1, player);
}

function recordEyebrowUse(player) {
  if (!isAchievementPlayer(player)) return;
  const streak = (Number(achievementProfile.progress.eyebrowStreak) || 0) + 1;
  achievementProfile.progress.eyebrowStreak = streak;
  checkAchievementProgress("eyebrowStreak");
  saveAchievementProfile();
}

// ---------- 全画面ボタン ----------
const fullscreenBtn = document.getElementById("fullscreen-btn");
const gameWrap = document.querySelector(".game-wrap");

function isFullscreenActive() {
  return !!(document.fullscreenElement || document.webkitFullscreenElement);
}

function requestFullscreenOn(el) {
  if (el.requestFullscreen) return el.requestFullscreen();
  if (el.webkitRequestFullscreen) return el.webkitRequestFullscreen();
  return Promise.reject(new Error("fullscreen unsupported"));
}

function exitFullscreen() {
  if (document.exitFullscreen) return document.exitFullscreen();
  if (document.webkitExitFullscreen) return document.webkitExitFullscreen();
  return Promise.reject(new Error("fullscreen unsupported"));
}

function resizeCanvasResolution() {
  const bounds = canvas.getBoundingClientRect();
  if (!bounds.width || !bounds.height) return;
  const dpr = Math.max(1, window.devicePixelRatio || 1);
  // Match the backing bitmap to the physical display size while keeping game coordinates at 900x500.
  const scale = Math.max(1, Math.min(4, dpr * (bounds.width / VIEW_W)));
  const pixelW = Math.round(VIEW_W * scale);
  const pixelH = Math.round(VIEW_H * scale);
  if (canvas.width !== pixelW || canvas.height !== pixelH) {
    canvas.width = pixelW;
    canvas.height = pixelH;
    ctx = canvas.getContext("2d");
  }
  canvasPixelScale = canvas.width / VIEW_W;
  avatarRenderScale = canvasPixelScale;
  ctx.imageSmoothingEnabled = true;
  ctx.imageSmoothingQuality = "high";
}

function updateFullscreenButton() {
  if (!fullscreenBtn) return;
  const active = isFullscreenActive();
  wasFullscreen = active;
  resizeCanvasResolution();
  fullscreenBtn.textContent = active ? "⤡" : "⛶";
  fullscreenBtn.title = active ? "全画面を解除する" : "全画面で遊ぶ";
  fullscreenBtn.setAttribute("aria-label", fullscreenBtn.title);
}

function toggleFullscreen() {
  getAudio();
  const p = isFullscreenActive() ? exitFullscreen() : requestFullscreenOn(gameWrap);
  if (p && typeof p.catch === "function") {
    p.catch(() => {
      uiNotice = "このブラウザーでは全画面表示が使えません。F11キーをお試しください。";
      uiNoticeTimer = 140;
    });
  }
}

if (fullscreenBtn) {
  fullscreenBtn.addEventListener("click", e => { e.stopPropagation(); toggleFullscreen(); });
  fullscreenBtn.addEventListener("dblclick", e => e.stopPropagation());
}
document.addEventListener("fullscreenchange", updateFullscreenButton);
